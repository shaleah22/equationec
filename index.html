<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equations &amp; Inequalities Test Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the test question in a Canvas-style card on the left; on the right, the class drill that fits
   that kind of question (two-step, inequalities, or clearing / both sides) works it with the student. */
:root{
  --ink:#0f172a; --text:#334155; --muted:#5b6474; --faint:#94a3b8; --line:#d5dbe3; --edge:#e5e9ef;
  --page:#f3f5f8; --paper:#ffffff;
  --blue:#1d4ed8; --blue-b:#3b82f6; --blue-bg:#eff6ff;
  --green:#047857; --green-b:#10b981; --green-bg:#ecfdf5;
  --rose:#be123c; --rose-b:#fb7185; --rose-bg:#fff1f2;
  --canvas-head:#f5f5f5; --canvas-edge:#c7cdd1;
  --f-ui:Tahoma,Verdana,"DejaVu Sans",Geneva,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-ui);font-size:clamp(15px,.5vw + .7vh,19px);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue-b);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;flex-shrink:0;padding-bottom:6px;border-bottom:2px solid var(--edge)}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand-k{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.brand-t{font-size:1.1rem;font-weight:700}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.score{font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}
.score small{color:var(--muted);font-weight:600}
.btn{font-weight:700;font-size:.85rem;padding:6px 14px;border-radius:8px;cursor:pointer;background:var(--paper);color:var(--blue);border:2px solid #bfdbfe}
.btn:hover{background:var(--blue-bg);border-color:var(--blue-b)}
.btn.go{color:var(--green);border-color:#a7f3d0}
.btn.go:hover{background:var(--green-bg);border-color:var(--green-b)}
.strip{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 0;flex-shrink:0}
.strip .lab{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-right:4px}
.qn{min-width:2em;height:1.85em;border-radius:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.qn:hover{border-color:var(--blue-b);color:var(--blue)}
.qn.right{background:var(--green-bg);border-color:var(--green-b);color:var(--green)}
.qn.miss{background:var(--rose-bg);border-color:var(--rose-b);color:var(--rose)}
.qn.on{outline:3px solid var(--blue);outline-offset:1px}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.qcol{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:6px}
/* the problem: a bar across the top of the workspace */
.qbar{flex:0 0 auto;display:flex;align-items:flex-start;gap:10px 20px;padding:10px 18px;border-bottom:1px solid var(--line);background:#fbfcfd;max-height:42vh;overflow-y:auto}
.qcard{flex:1;min-width:0;display:flex;align-items:flex-start;gap:16px}
.stagebody{flex:1;min-height:0;position:relative}
.qhead{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;font-weight:700;white-space:nowrap;padding-right:16px;border-right:2px solid var(--edge);line-height:1.3}
.qhead .pts{font-weight:600;color:var(--muted);font-size:.9rem}
.qbody{flex:1;min-width:0;line-height:1.5;max-width:62rem}
.qbody .blank{display:none}
.qbody .prevans{display:inline-block;margin:4px 0 0;padding:3px 10px;border-radius:6px;background:var(--blue-bg);color:var(--blue)}
.qcard.ineng .qeq{display:none}
.qcard.bare .qbody{display:none}
.qcard.bare .qhead{border-right:0;flex-direction:row;gap:10px}
.qbody p{margin:0 0 .6em}
.qbody p:last-child{margin-bottom:0}
.sawc{font-size:.76rem;font-weight:700;margin-bottom:.6em}
.qeq{font-size:1.4rem;font-weight:700;margin:.3em 0 .5em;display:flex;flex-wrap:wrap;align-items:center;gap:.25em}
.blank{color:var(--muted)}
.qt{border-collapse:collapse;margin:.2em 0 .8em;font-size:.95rem}
.qt th,.qt td{border:1px solid #9aa3ad;padding:5px 9px;text-align:left;vertical-align:top}
.qt th{background:#eef0f2}
.m{font-weight:700;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.78em;line-height:1.12;margin:0 .06em}
.fr>.ft{padding:0 .14em}
.fr>.frb{padding:0 .14em;border-top:2px solid currentColor}
.status{flex:0 1 19rem;border-left:4px solid var(--blue-b);padding:2px 0 2px 12px;color:var(--text);line-height:1.4;font-size:.86rem}
.status:empty{display:none}
.status.done{border-left-color:var(--green-b)}
.status b{color:var(--ink)}
.status .ok{color:var(--green);font-weight:700;font-size:1.15rem}
.status .note{color:var(--muted);font-size:.9rem}
.status .restart{display:block;margin:6px 0 4px;color:var(--rose);border-color:var(--rose-b);background:var(--rose-bg);font-size:.95rem}
.status .restart:hover{background:#ffe4e6;border-color:var(--rose)}
.stage{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#frames,#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#frames iframe{background:#fff}
.hpanel{position:absolute;inset:0;overflow:auto;padding:24px clamp(14px,3vw,36px);display:flex;flex-direction:column;align-items:center;gap:16px;background:var(--paper)}
.hp-lab{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--blue)}
.hp-q{margin:0;font-size:1.2rem;font-weight:700;line-height:1.45;text-align:center;max-width:40rem;text-wrap:balance}
.hp-fb{margin:0;color:var(--rose);font-weight:700;text-align:center;max-width:40rem;line-height:1.45}
.hp-done{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--green);font-weight:700}
.hp-done .big{font-size:1.6rem}
.opts{display:grid;grid-template-columns:1fr;gap:10px;width:100%;max-width:40rem}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font-size:1.2rem;font-weight:700;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer}
.ctab{border-collapse:collapse;font-size:1rem;margin:0 auto}
.ctab th,.ctab td{border:1.5px solid var(--line);padding:7px 12px;text-align:center;min-width:5.5em;white-space:nowrap}
.ctab tr:first-child th{font-size:.85rem;color:var(--muted);background:var(--canvas-head)}
.ctab th{text-align:left;background:var(--canvas-head)}
.ctab td.got{font-weight:700;color:var(--ink)}
.ctab td.now{background:var(--blue-bg);color:var(--blue);font-weight:700;outline:2px solid var(--blue-b);outline-offset:-2px}
.ctab tr.tot td,.ctab tr.tot th{border-top-width:3px}
.menu{font:700 1.15rem var(--f-ui);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 14px;min-width:16rem;cursor:pointer}
.menu:focus{border-color:var(--blue-b)}
.opt:hover{border-color:var(--blue-b);background:var(--blue-bg)}
.opt.wrong{border-color:var(--rose-b);color:var(--rose);opacity:.55;cursor:default;text-decoration:line-through}
.opt .lt{flex:0 0 auto;width:1.8em;height:1.8em;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:.9rem}
.fields{display:flex;flex-direction:column;gap:12px;width:100%;max-width:34rem}
.field{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:1.15rem;font-weight:700}
.box{height:2.2em;width:6em;font-size:1.1rem;font-weight:700;text-align:center;border:2px solid #10b981;background:#fff;color:var(--green);border-radius:6px;outline:none}
.box:focus{border-color:var(--green)}
.box.ok{background:var(--green-bg)}
.box.bad{border-color:var(--rose-b);background:var(--rose-bg);color:var(--rose)}
.srow{width:100%;max-width:40rem;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.srow p{margin:0 0 8px;line-height:1.4}
.sline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:1.25rem;font-weight:700}
.sg{font:700 1.15rem var(--f-ui);min-width:2.4em;height:2em;border-radius:8px;border:2px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
.sg:hover{border-color:var(--blue-b);background:var(--blue-bg)}
.sg.right{background:var(--green-bg);border-color:var(--green-b);color:var(--green)}
.sg.wrong{opacity:.4;text-decoration:line-through;cursor:default}
.sg:disabled:not(.right):not(.wrong){opacity:.35}
.next{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:11px 22px;font-size:1.05rem;font-weight:700;cursor:pointer}
.next:hover{background:#1e293b}
.big-ok{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50;animation:bo-out 1.2s ease forwards}
.big-ok svg{width:min(30vw,30vh,200px);height:auto;animation:bo-pop .4s cubic-bezier(.2,1.5,.4,1)}
.bo-c{fill:var(--green)}
.bo-k{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:bo-draw .35s .12s ease-out forwards}
@keyframes bo-pop{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes bo-draw{to{stroke-dashoffset:0}}
@keyframes bo-out{0%,70%{opacity:1}100%{opacity:0}}
/* turn-in page (Microsoft Form, cropped to its Submit button) */
.turnin{flex:1 1 auto;min-height:0;overflow:auto;background:var(--paper);border:2px solid var(--green);border-radius:16px;margin-top:10px;padding:20px clamp(16px,4vw,36px);display:flex;flex-direction:column;gap:14px}
.turnin.early{border-color:var(--line)}
.ti-top{display:flex;align-items:center;gap:18px}
.ti-check{flex:0 0 auto;width:60px;height:60px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:700}
.turnin h2{margin:0;font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.1;color:var(--green)}
.turnin.early h2{color:var(--ink)}
.ti-sub{margin:4px 0 0;color:var(--text)}
.ti-formcol{max-width:760px;display:flex;flex-direction:column;gap:6px}
.ti-press{margin:0 0 4px;font-size:1.1rem;line-height:1.45}
.ti-press small{display:block;color:var(--muted);font-size:.85em;margin-top:4px}
.ti-crop{position:relative}
.ti-form{display:block;width:100%;height:calc(100vh - 160px);min-height:420px;border:2px solid var(--line);border-radius:12px;background:#fff}
.turnin.cropped .ti-crop{overflow:hidden;height:var(--crop-h);width:var(--crop-w);max-width:100%;box-sizing:content-box;border:2px solid var(--line);border-radius:12px;background:#fff}
.turnin.cropped .ti-form{position:absolute;left:calc(-1px * var(--crop-x));top:calc(-1px * var(--crop-y));width:528px;height:1600px;min-height:0;border:0;border-radius:0;max-width:none}
.ti-how{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.ti-how a{color:var(--blue)}
.ti-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:6px;font-size:.88rem}
.ti-list span{border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--muted)}
.ti-list span.r{border-color:var(--green-b);color:var(--green);background:var(--green-bg)}
.ti-list span.m{border-color:var(--rose-b);color:var(--rose)}
.cal{position:fixed;inset:0;z-index:200;background:#f4f6f9;overflow:auto;font:600 16px/1.45 var(--f-ui);color:#1a202c}
.cal-in{max-width:760px;margin:16px auto;background:#fff;border-radius:16px;padding:20px 24px}
.cal label{display:flex;gap:12px;align-items:center;margin:8px 0}.cal input[type=range]{flex:1}
.cal .cal-win{position:relative;overflow:hidden;border:3px solid #1d4fa0;border-radius:12px;background:#fff;margin:14px 0}
.cal .cal-win iframe{position:absolute;width:528px;height:1600px;border:0}
.cal-out{font-size:1.1em;background:#ebf8ff;border-radius:10px;padding:10px 14px}
@media (max-width:860px){
  .main{overflow-y:auto}
  .stage{flex-shrink:0;height:86vh}
  .qbar{flex-direction:column;gap:8px;padding:10px 12px}
  .qcard{width:100%}
  .status{flex:none;width:100%}
  .qcard{flex-direction:column;gap:6px}
  .qhead{flex-direction:row;gap:10px;border-right:0;padding-right:0}
}
@media (prefers-reduced-motion:reduce){ .big-ok svg{animation:none} .bo-k{animation:none;stroke-dashoffset:0} }
</style>
</head><body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="brand-t">Equations &amp; Inequalities</span></div>
    <div class="top-r">
      <span class="score" id="score"></span>
      <button class="btn" id="newBtn" type="button" title="Same kind of question, new numbers">New numbers</button>
      <button class="btn go" id="turnBtn" type="button">Turn in</button>
    </div>
  </header>
  <nav class="strip" id="strip" aria-label="Questions"></nav>
  <main class="main" id="main">
    <section class="stage" aria-label="Work it out">
      <div class="qbar">
        <div class="qcard" id="qcard"></div>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
      <div class="stagebody">
        <div id="frames"></div>
        <div class="hpanel" id="hpanel" hidden></div>
      </div>
    </section>
  </main>
  <section id="tipage" hidden></section>
</div>

<script>
const ENG={"two": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Two-Step Equations\u003c/title>\n\u003cstyle>\n  :root{\n    --ink:#0f172a; --line:#1e293b; --muted:#64748b; --faint:#94a3b8;\n    --blue:#1d4ed8; --blue-b:#3b82f6; --blue-bg:#eff6ff;\n    --green:#059669; --green-bg:#ecfdf5;\n    --rose:#e11d48; --rose-bg:#fff1f2;\n    --page:#f8fafc; --edge:#e2e8f0;\n  }\n  *{box-sizing:border-box;}\n  html,body{height:100%;margin:0;}\n  /* scale everything with the screen so the problem fills it */\n  html{font-size:clamp(16px,1.15vw + .6vh,26px);}\n  body{\n    background:var(--page); color:var(--ink);\n    font-family:Tahoma,Verdana,Geneva,sans-serif;\n    -webkit-font-smoothing:antialiased;\n  }\n  .app{height:100%;display:flex;flex-direction:column;overflow:hidden;padding:12px 16px;}\n  .wrap{width:100%;max-width:64rem;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0;}\n\n  /* work area */\n  .ghost{position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none;width:max-content;}\n  .work{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;\n        justify-content:safe center;padding:6px 0;overflow:hidden;}\n  /* the equation and the panel under it scale together as one block, so the\n     size is set once per problem and nothing shifts underfoot mid-solve */\n  .stagebox{display:flex;justify-content:center;align-items:flex-start;flex-shrink:0;}\n  /* the working on the left, the buttons and the check beside it */\n  .stage{display:flex;flex-direction:row;align-items:flex-start;gap:0;transform-origin:top center;}\n  .stage-main{display:flex;justify-content:center;}\n  .stage-side{display:flex;flex-direction:column;align-items:center;gap:1.4rem;}\n  /* tall, narrow screens: stack the two columns instead */\n  @media (max-aspect-ratio:1/1){ .stage{flex-direction:column;align-items:center;gap:0;} }\n\n  .scroller{display:flex;justify-content:center;}\n  .scroller > .eq{flex:0 0 auto;}\n  .eq{display:grid;column-gap:30px;row-gap:10px;width:max-content;margin:0 auto;\n      font-family:Tahoma,Verdana,Geneva,sans-serif;font-size:2.4rem;}\n  /* two-step needs both shapes at once: four columns for the line that still\n     carries a constant, and room for a fraction bar on the line below it */\n  .eq.k-two{grid-template-columns:auto auto auto auto;row-gap:10px;column-gap:26px;}\n  .eq.k-two .cell{gap:10px;min-height:3.4rem;}\n  .cell.span2{grid-column:span 2;}\n  .eq.k-two .dfrac{font-size:1em;}\n  .eq.k-two .dfrac > .t,.eq.k-two .dfrac > .b{padding:0 8px;gap:.28em;}\n  .eq.k-two .dfrac > .bar{min-width:4.2rem;border-top-color:var(--line);}\n  .eq.k-two .mgroup{gap:6px;}\n  .eq.k-two .mgroup.tall .paren{font-size:2.2em;}\n  /* room above and below for the cancelled numbers, without wasting a whole line */\n  .eq.k-two .mgroup.roomy{padding:1.8rem 0;}\n  .cell{min-height:4rem;padding:2px 0;display:flex;align-items:center;justify-content:center;gap:6px;\n        transition:opacity .7s ease-out;}\n  .rule{grid-column:1 / -1;height:2px;margin:5px 0;border-top:2px solid var(--line);}\n  /* same row break as .rule, but with no line drawn: nothing is being summed */\n  .spacer{grid-column:1 / -1;height:0;margin:9px 0;}\n  .hide{visibility:hidden;}\n  .eqsign{color:var(--faint);}\n  .blue{color:var(--blue);}\n  .green{color:var(--green);}\n  .grey{color:var(--muted);}\n  .faint{color:var(--faint);}\n  .cancelling{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6;}\n  .struck{text-decoration:line-through;text-decoration-thickness:2px;opacity:.25;}\n\n  .num{display:inline-flex;align-items:center;vertical-align:middle;}\n  .sgn{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;}\n\n  /* full-size fractions, used when multiplying and dividing */\n  .dfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;\n         line-height:1.15;margin:0 1px;font-size:.86em;}\n  .dfrac > .t,.dfrac > .b{padding:0 7px;display:flex;align-items:center;justify-content:center;}\n  .dfrac > .bar{width:100%;min-width:1.4rem;border-top:2px solid currentColor;margin:4px 0;}\n  .dfrac.grow{animation:grow .35s ease-out;}\n\n  /* the reciprocal the student writes: two boxes stacked over a bar */\n  .fracbox{display:inline-flex;flex-direction:column;align-items:center;gap:4px;vertical-align:middle;}\n  .fracbox > .bar{width:112%;border-top:2px solid var(--line);}\n\n  /* diagonal cancel stroke, drawn corner to corner so it fits whatever it crosses */\n  .slash{position:relative;display:inline-flex;align-items:center;justify-content:center;\n         padding:0 .18em;background-repeat:no-repeat;background-position:center;background-size:100% 100%;\n         background-image:linear-gradient(to bottom right,\n           transparent calc(50% - 1.8px), var(--sl) calc(50% - 1.8px),\n           var(--sl) calc(50% + 1.8px), transparent calc(50% + 1.8px));}\n  .slash.draw{--sl:#475569;color:#94a3b8;animation:draw .5s ease-out both;}\n  .slash.dim{--sl:#a3aec0;color:#cbd5e1;}\n  .slash.cross{--sl:#64748b;color:#9aa7bb;}\n  /* a number waiting to be simplified: same box as .slash, but no stroke yet */\n  .pend{display:inline-flex;align-items:center;justify-content:center;padding:0 .18em;}\n\n  /* cross-simplifying: the reduced number is written above or below the crossed-out one\n     without shifting it, so the originals keep their place on the line */\n  .cx{position:relative;display:inline-flex;align-items:center;justify-content:center;}\n  .cx .redu{position:absolute;left:50%;transform:translateX(-50%);\n            display:flex;align-items:center;justify-content:center;\n            color:var(--blue);font-size:.66em;line-height:1;}\n  .cx.above .redu{bottom:100%;margin-bottom:3px;}\n  .cx.below .redu{top:100%;margin-top:3px;}\n\n  /* parenthesised group: multiplying both sides */\n  .mgroup{display:inline-flex;align-items:center;gap:9px;}\n  .paren{font-size:1.35em;line-height:1;color:var(--line);}\n  .mgroup.tall .paren{font-size:2.6em;font-weight:300;}\n  .mgroup.fade{animation:grow .35s ease-out;}\n  @keyframes grow{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}\n  @keyframes draw{from{background-size:0% 100%;}to{background-size:100% 100%;}}\n\n  /* inputs */\n  .box{height:2.9rem;width:3.9rem;border:2px solid var(--blue-b);background:var(--blue-bg);color:var(--blue);\n       border-radius:6px;text-align:center;font-family:Tahoma,Verdana,Geneva,sans-serif;font-size:1.9rem;\n       outline:none;transition:border-color .15s,background .15s;}\n  .box.wide{width:5.4rem;}\n  .box.small{font-size:1.4rem;}\n  .box.mini{height:2.4rem;width:3.4rem;font-size:1.4rem;}\n  .box.tiny{height:1.9rem;width:2.6rem;font-size:1.1rem;border-radius:5px;}\n  .box:focus{border-color:var(--blue);background:#fff;}\n  .box.bad{border-color:#fb7185;background:var(--rose-bg);color:var(--rose);}\n  .box.ok{border-color:#10b981;background:var(--green-bg);color:var(--green);}\n  .preview{color:var(--faint);}\n\n  /* operation buttons */\n  .ops{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;}\n  .op{width:5.6rem;height:4.4rem;border:2px solid var(--edge);background:#fff;color:var(--line);\n      border-radius:12px;cursor:pointer;font-family:Tahoma,Verdana,Geneva,sans-serif;font-size:2.3rem;\n      line-height:1;display:flex;align-items:center;justify-content:center;\n      transition:border-color .15s,background .15s,transform .1s;}\n  .op:hover{border-color:var(--blue-b);background:var(--blue-bg);color:var(--blue);}\n  .op:active{transform:translateY(1px);}\n  .op:focus-visible{outline:3px solid var(--blue-b);outline-offset:2px;}\n  .op.shake{animation:shake .32s;border-color:#fb7185;background:var(--rose-bg);color:var(--rose);}\n  /* the key that picks this move, in the corner of the button */\n  .op{position:relative;}\n  .op .key{position:absolute;right:7px;bottom:5px;font-size:.8rem;line-height:1;color:var(--faint);}\n  /* a typed key flashes its button the way a click would */\n  .op.kbd{border-color:var(--blue-b);background:var(--blue-bg);color:var(--blue);transform:translateY(1px);}\n  /* first part of each move: click the part of the equation that's in the way */\n  .tgt{display:inline-flex;align-items:center;justify-content:center;gap:inherit;padding:2px 8px;\n       border-radius:10px;transition:border-color .15s,background .15s,color .15s;}\n  /* a number stuck to its variable (3w): keep the two together, highlight space only on the outside */\n  .tpair{display:inline-flex;align-items:center;}\n  .tpair > .tgt:first-child{padding-right:1px;}\n  .tpair > .tgt:last-child{padding-left:1px;}\n  .tgt[role=button]{cursor:pointer;}\n  .tgt[role=button]:hover{background:#fef9c3;}\n  .tgt[role=button]:focus-visible{outline:3px solid var(--blue-b);outline-offset:2px;}\n  .tgt.picked{background:#fde047;color:var(--ink);}\n  .tgt.shake{animation:shake .32s;background:var(--rose-bg);color:var(--rose);}\n  @keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}\n\n  /* first part of each move: the part in the way is highlighted, and a box under it\n     asks what we do to both sides. It hangs below the line so nothing above it moves. */\n  .tgt.asking{position:relative;}\n  .ask{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:.4rem;z-index:2;\n       display:flex;flex-direction:column;align-items:center;gap:.45rem;white-space:nowrap;\n       font-family:Tahoma,Verdana,Geneva,sans-serif;line-height:1.2;}\n  .ask-q{font-size:.9rem;color:var(--muted);}\n  .box.ask-box{width:2.8rem;height:2.2rem;font-size:1.5rem;padding:0;border:none;border-radius:0;\n               border-bottom:2px solid #cbd5e1;background:transparent;color:var(--blue);}\n  .box.ask-box:focus{border-bottom-color:var(--blue-b);background:transparent;}\n  .box.ask-box.bad{border-bottom-color:#fb7185;background:transparent;color:var(--rose);}\n  .box.ask-box.ok{border-bottom-color:#10b981;background:transparent;color:var(--green);}\n  .box.shake{animation:shake .32s;}\n\n  /* the answer put back in for the variable on the top line */\n  .subv{display:inline-flex;align-items:center;color:var(--green);animation:fadein .4s ease-out;}\n  .subv .sp{color:var(--line);}\n  .subnum{display:inline-block;}\n  .subnum.landing{visibility:hidden;}\n  .subnum.landed{animation:pop .45s ease-out;}\n  @keyframes fadein{from{opacity:0;}to{opacity:1;}}\n  @keyframes pop{0%{transform:scale(1.3);}100%{transform:none;}}\n  /* the copy of the answer that travels up */\n  .flyer{position:fixed;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none;\n         color:var(--green);font-family:Tahoma,Verdana,Geneva,sans-serif;line-height:1;white-space:nowrap;}\n  /* working the substituted line out, one line at a time */\n  .evalline{opacity:0;transition:opacity .4s ease-out;}\n  /* the work clears away before the answer goes back up */\n  .eq > .goaway{opacity:0;transition:opacity .5s ease-out;}\n  .evalline.show{opacity:1;}\n  .cell.to-eq-r{justify-content:flex-end;}\n  .cell.to-eq-l{justify-content:flex-start;}\n  .checkline{width:100%;text-align:center;font-family:Tahoma,Verdana,Geneva,sans-serif;font-size:1.7rem;line-height:2.1;}\n  .checkline .orig{color:var(--faint);}\n  .checkline .sub{margin-top:12px;}\n\n  /* prompt bar */\n  /* fixed height on purpose: a message appearing must not change how much\n     room the equation has, or the writing would resize mid-problem */\n  .promptbar{flex-shrink:0;border-top:1px solid var(--edge);padding-top:12px;padding-bottom:4px;\n             height:5rem;overflow-y:auto;}\n  .prompt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;color:#334155;font-size:1.35rem;}\n  .prompt .math{font-family:Tahoma,Verdana,Geneva,sans-serif;}\n  .prompt strong{font-weight:600;}\n  .hintline{width:100%;font-size:.85rem;color:#475569;display:flex;flex-wrap:wrap;align-items:center;gap:5px;}\n  .missline{margin-top:4px;font-size:1.05rem;color:var(--rose);}\n  .noteline{margin-top:4px;font-size:1.05rem;color:var(--muted);}\n  .next{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:12px 24px;\n        font-size:1.1rem;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;}\n  .next:hover{background:#1e293b;}\n  .row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;}\n\n  @media (max-width:640px){\n    .eq{font-size:1.45rem;column-gap:15px;}\n    .eq.k-two{font-size:1.3rem;column-gap:13px;row-gap:7px;}\n    .eq.k-two .cell{min-height:2.7rem;gap:7px;}\n    .eq.k-two .dfrac > .bar{min-width:2.6rem;}\n    .eq.k-two .mgroup.roomy{padding:1.1rem 0;}\n    .cell{min-height:3.1rem;}\n    .checkline{font-size:1.15rem;line-height:1.9;}\n    .ops{gap:9px;}\n    .op{width:4rem;height:3.4rem;font-size:1.7rem;}\n    .box{height:2.3rem;width:3.1rem;font-size:1.3rem;}\n    .box.wide{width:4.4rem;}\n    .box.mini{height:2rem;width:2.8rem;font-size:1.15rem;}\n    .box.tiny{height:1.6rem;width:2.1rem;font-size:.95rem;}\n    .ask-q{font-size:.8rem;}\n    .box.ask-box{width:2.3rem;height:1.9rem;font-size:1.2rem;}\n    .prompt{font-size:1.1rem;}\n    .promptbar{height:5.6rem;}\n    .stage{flex-direction:column;align-items:center;gap:0;}\n  }\n  @media (prefers-reduced-motion:reduce){\n    .dfrac.grow,.mgroup.fade,.op.shake,.slash.draw,.subv,.subnum.landed{animation:none;}\n    .evalline,.eq > .goaway{transition:none;}\n  }\n\n  /* ---------- problem counter + turn in ---------- */\n  .drillhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;\n    flex-shrink:0;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--edge);}\n  .dh-name{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);}\n  .dh-right{display:inline-flex;align-items:center;gap:12px;}\n  .dh-count{font-size:1rem;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap;}\n  .turnin-link{font-family:inherit;font-weight:700;font-size:.75rem;padding:4px 12px;border-radius:8px;cursor:pointer;\n    background:#fff;color:var(--blue);border:2px solid #bfdbfe;}\n  .turnin-link:hover{border-color:#93c5fd;background:var(--blue-bg);}\n  .off{display:none !important;}\n\n  /* ---------- the turn-in page ---------- */\n  .turnin{position:fixed;inset:0;z-index:100;overflow:auto;background:#f4f6f9;font-size:16px;\n    font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;font-weight:600;color:#1a202c;\n    -webkit-user-select:text;user-select:text;}\n  .turnin button{font-family:inherit;font-weight:800;border-radius:10px;cursor:pointer;border:none;transition:background .2s;}\n  .turnin button:focus-visible{outline:3px solid #1a365d;outline-offset:3px;}\n  .check-btn{color:#fff;background-color:#2b6cb0;padding:12px 30px;font-size:1.1em;}\n  .check-btn:hover{background-color:#2c5282;}\n  .ti-inner{max-width:640px;margin:clamp(12px,4vh,40px) auto;padding:28px clamp(18px,4vw,36px) 32px;\n    background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.08);}\n  .ti-inner h2{color:#1a365d;font-size:1.6em;font-weight:800;margin:0 0 20px;letter-spacing:-.01em;}\n  .ti-inner h3{color:#1a365d;font-size:1.05em;font-weight:800;margin:26px 0 10px;}\n  .ti-sub{color:#718096;font-weight:600;line-height:1.55;margin:0 0 20px;}\n  .ti-recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}\n  .ti-recap > div{border:2px solid #e2e8f0;border-radius:12px;padding:10px 14px;color:#718096;font-size:.85em;}\n  .ti-recap b{display:block;color:#1a202c;font-size:1.9em;font-weight:800;}\n  .ti-log{max-height:320px;overflow:auto;margin-top:16px;padding:6px 0;border-top:2px solid #e2e8f0;border-bottom:2px solid #e2e8f0;}\n  .ti-empty{color:#a0aec0;margin-top:14px;}\n  .ti-row{display:flex;gap:10px;align-items:baseline;padding:5px 2px;font-size:1.02em;}\n  .ti-n{color:#a0aec0;min-width:28px;text-align:right;font-size:.85em;}\n  .ti-q{flex:1;min-width:0;overflow-wrap:anywhere;}\n  .ti-arrow{color:#a0aec0;padding:0 4px;}\n  .ti-k{font-size:.8em;white-space:nowrap;color:#38a169;}\n  .ti-k.retry{color:#dd6b20;}\n  #gform{margin-top:4px;}\n  .ti-warn{background:#fefcbf;color:#744210;border-radius:10px;padding:11px 14px;margin-bottom:18px;line-height:1.55;font-size:.92em;}\n  .ti-field{margin-bottom:14px;}\n  .ti-field label{display:block;margin-bottom:6px;color:#2d3748;}\n  .ti-field label em{font-style:normal;color:#a0aec0;font-weight:600;font-size:.88em;}\n  .ti-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-right:8px;\n    border-radius:50%;background:#2b6cb0;color:#fff;font-size:.8em;}\n  .ti-field input{font-family:inherit;font-size:1.05em;font-weight:700;color:#1a202c;width:100%;\n    border:2px solid #cbd5e0;border-radius:10px;padding:9px 12px;background:#fff;}\n  .ti-field input:focus{outline:none;border-color:#3182ce;}\n  .ti-check{border:2px solid #e2e8f0;border-radius:12px;padding:11px 14px;margin:4px 0 16px;background:#f7fafc;}\n  .ti-check .head{color:#718096;font-size:.88em;margin-bottom:8px;}\n  .ti-check .row{display:flex;gap:12px;align-items:baseline;margin-bottom:4px;}\n  .ti-check .row:last-child{margin-bottom:0;padding-top:6px;border-top:2px solid #e2e8f0;}\n  .ti-check .t{color:#a0aec0;min-width:88px;font-size:.85em;}\n  .ti-check .v{color:#1a202c;}\n  .ti-check .v.empty{color:#cbd5e0;}\n  .ti-feedback{margin-top:14px;min-height:1.2em;}\n  .ti-feedback .ok{color:#2f855a;}\n  .ti-feedback .note{color:#718096;}\n  .ti-after{margin-top:20px;padding-top:16px;border-top:2px solid #e2e8f0;display:flex;gap:12px;align-items:center;\n    flex-wrap:wrap;color:#718096;}\n  .ti-ghost{background:#edf2f7;color:#2d3748;padding:8px 16px;font-size:.95em;}\n  .ti-ghost:hover{background:#e2e8f0;}\n.drillhead,#turnin{display:none!important}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"drillhead\">\n      \u003cspan class=\"dh-name\">Two-Step Equations\u003c/span>\n      \u003cspan class=\"dh-right\">\u003cspan class=\"dh-count\" id=\"problem-title\">Problem 1 of 10\u003c/span>\u003cbutton class=\"turnin-link\" id=\"turnin-link\" type=\"button\">Turn in\u003c/button>\u003c/span>\n    \u003c/div>\n\n    \u003cdiv class=\"work\">\n      \u003cdiv class=\"stagebox\" id=\"stagebox\">\n        \u003cdiv class=\"stage\" id=\"stage\">\n          \u003cdiv class=\"stage-main\" id=\"stageMain\">\n            \u003cdiv class=\"scroller\">\u003cdiv class=\"eq\" id=\"eq\">\u003c/div>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"stage-side\" id=\"stageSide\">\n            \u003cdiv id=\"panel\">\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"promptbar\" id=\"promptbar\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- offscreen: a finished copy of the problem is drawn here and measured, so the\n     real one can be sized once and left alone -->\n\u003cdiv class=\"ghost\" id=\"ghost\" aria-hidden=\"true\">\u003c/div>\n\n\u003c!-- the turn-in page: after problem 10, or any time from the Turn in button -->\n\u003cdiv class=\"turnin off\" id=\"turnin\" role=\"dialog\" aria-labelledby=\"ti-title\">\n  \u003cdiv class=\"ti-inner\">\n    \u003ch2 id=\"ti-title\">All 10 done\u003c/h2>\n\n    \u003ciframe name=\"hidden_iframe\" id=\"hidden_iframe\" style=\"display:none\"\n            onload=\"if(window.onHiddenFrameLoad)onHiddenFrameLoad()\">\u003c/iframe>\n\n    \u003cform action=\"#\"\n          method=\"POST\" target=\"hidden_iframe\" id=\"gform\">\n      \u003cdiv class=\"ti-field\">\n        \u003clabel for=\"studentPeriod\">\u003cspan class=\"ti-num\">1\u003c/span>Period\u003c/label>\n        \u003cinput type=\"number\" id=\"studentPeriod\" placeholder=\"e.g. 3\" min=\"1\" max=\"10\" required>\n      \u003c/div>\n      \u003cdiv class=\"ti-field\">\n        \u003clabel for=\"lastName\">\u003cspan class=\"ti-num\">2\u003c/span>LAST name\n          \u003cem>&mdash; your family name, the one the roster is alphabetized by\u003c/em>\u003c/label>\n        \u003cinput type=\"text\" id=\"lastName\" placeholder=\"Rodriguez\" autocomplete=\"family-name\" required>\n      \u003c/div>\n      \u003cdiv class=\"ti-field\">\n        \u003clabel for=\"firstName\">\u003cspan class=\"ti-num\">3\u003c/span>FIRST name\n          \u003cem>&mdash; the name your teacher calls you by\u003c/em>\u003c/label>\n        \u003cinput type=\"text\" id=\"firstName\" placeholder=\"Maria\" autocomplete=\"given-name\" required>\n      \u003c/div>\n      \u003cdiv class=\"ti-check\" id=\"nameCheck\">\u003c/div>\n      \u003cinput type=\"hidden\" id=\"studentName\" name=\"entry.1899284808\" value=\"\">\n      \u003cinput type=\"hidden\" id=\"formScore\" name=\"entry.1974610095\" value=\"\">\n      \u003cbutton type=\"submit\" class=\"check-btn\" id=\"ti-submit\">Submit Results\u003c/button>\n    \u003c/form>\n\n    \u003cdiv class=\"ti-feedback\" id=\"ti-feedback\">\u003c/div>\n    \u003cdiv class=\"ti-after\">\n      \u003cspan id=\"ti-after-lab\">Want more practice?\u003c/span>\n      \u003cbutton class=\"ti-ghost\" type=\"button\" id=\"ti-back\">Keep practicing\u003c/button>\n    \u003c/div>\n\n    \u003ch3>Your work\u003c/h3>\n    \u003cdiv class=\"ti-recap\" id=\"ti-recap\">\u003c/div>\n    \u003cdiv id=\"ti-log\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>/*SPEC*/\u003c/script>\n\u003cscript>\nconst SPEC=window.HOST_SPEC||{};\nfunction fN(x){ const r=Math.round(x*1e6)/1e6; if(SPEC.money&&!Number.isInteger(r)) return r.toFixed(2); return String(r); }\nfunction near(a,b){ return a!==null&&a!==undefined&&!isNaN(a)&&Math.abs(a-b)\u003c1e-9; }\nfunction POST(m){ try{ parent.postMessage(Object.assign({drill:1},m),'*'); }catch(e){} }\nlet MISSED=false;\nwindow.addEventListener('message',function(e){ if(e.data&&e.data.refit) window.dispatchEvent(new Event('resize')); });\n\u003c/script>\n\u003cscript>\n\n/* ============ shell: one score, mixed dealing, router ============ */\nconst Shell = {\n  done:0, streak:0, active:null, activeEng:null, bag:[], lastKind:null, engines:{}, timers:[],\n  counts:{basic:0, negfrac:0, fcoef:0},\n\n  /* the three kinds of two-step problem, dealt in equal amounts */\n  kinds:[\n    {id:\"basic\",   eng:\"two\", arg:\"basic\"},\n    {id:\"negfrac\", eng:\"two\", arg:\"negfrac\"},\n    {id:\"fcoef\",   eng:\"two\", arg:\"fcoef\"}\n  ],\n  kind:function(id){\n    const ks=Shell.kinds;\n    for(let i=0;i\u003cks.length;i++) if(ks[i].id===id) return ks[i];\n    return ks[0];\n  },\n\n  later:function(ms,fn){ Shell.timers.push(setTimeout(fn,ms)); },\n  clearTimers:function(){ Shell.timers.forEach(clearTimeout); Shell.timers=[]; },\n\n  /* One size per problem. The engine works out a scale from the FINISHED\n     problem before the first line is drawn, and that scale is held for every\n     step, so the writing never changes size while the student is working. */\n  scale:1,\n  applyScale:function(){\n    const stage=document.getElementById(\"stage\");\n    if(!stage) return;\n    const box=stage.parentNode, s=Shell.scale;\n    stage.style.transform = Math.abs(s-1)\u003c0.001 ? \"none\" : \"scale(\"+s+\")\";\n    /* each column keeps its finished width, so nothing slides sideways as lines appear */\n    const main=document.getElementById(\"stageMain\"), side=document.getElementById(\"stageSide\");\n    if(main) main.style.minWidth = Shell.mainW ? Shell.mainW+\"px\" : \"\";\n    if(side) side.style.minWidth = Shell.sideW ? Shell.sideW+\"px\" : \"\";\n    /* hold the room for the finished problem from the first step on */\n    box.style.height=Math.ceil(Math.max(stage.offsetHeight, Shell.stageH||0)*s)+\"px\";\n  },\n  /* how much room the whole stage has to fit into */\n  room:function(){\n    const work=document.querySelector(\".work\");\n    const cs=getComputedStyle(work);\n    const pad=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);\n    return {h:work.clientHeight-pad, w:work.clientWidth};\n  },\n  /* measure a finished problem off-screen without disturbing the live one */\n  ghost:function(html){\n    const g=document.getElementById(\"ghost\");\n    g.innerHTML=html;\n    const out=[].map.call(g.children,function(c){\n      return {w:c.offsetWidth, h:c.offsetHeight};\n    });\n    g.innerHTML=\"\";\n    return out;\n  },\n  /* re-measure only when the box around the equation actually changes size */\n  watchFit:function(){\n    let queued=false;\n    const go=function(){\n      if(queued) return;\n      queued=true;\n      requestAnimationFrame(function(){\n        queued=false;\n        if(Shell.onResize) Shell.onResize();\n      });\n    };\n    window.addEventListener(\"resize\",go);\n    if(window.ResizeObserver){\n      const ro=new ResizeObserver(go);\n      ro.observe(document.querySelector(\".work\"));\n    }\n  },\n\n  head:function(){\n    document.getElementById(\"eq\").className = \"eq k-two\";\n  },\n  solved:function(clean,info){\n    POST({done:1,clean:!!clean});\n    TI.record(clean,info);\n    Shell.done++;\n    Shell.streak = clean ? Shell.streak+1 : 0;\n    if(Shell.active && Shell.counts[Shell.active]!==undefined) Shell.counts[Shell.active]++;\n  },\n\n  /* the same four moves on every problem: press one (or type its key), then type the number */\n  OPS:[\n    [\"opPlus\", \"add\",      \"+\",         \"Add to both sides\",        \"+\", \"A\"],\n    [\"opMinus\",\"sub\",      \"\\u2212\",    \"Subtract from both sides\", \"\\u2212\", \"S\"],\n    [\"opMul\",  \"multiply\", \"(\\u2009)\",  \"Multiply both sides\",      \"x\", \"M\"],\n    [\"opDiv\",  \"divide\",   \"\\u00f7\",    \"Divide both sides\",        \"/\", \"D\"]\n  ],\n  /* keys that choose each move: the plain keys, the number-pad keys, and look-alikes */\n  KEYS:{\n    \"+\":\"opPlus\", \"=\":\"opPlus\",\n    \"-\":\"opMinus\", \"\\u2212\":\"opMinus\", \"_\":\"opMinus\",\n    \"x\":\"opMul\", \"X\":\"opMul\", \"*\":\"opMul\", \"\\u00d7\":\"opMul\", \"(\":\"opMul\", \")\":\"opMul\",\n    \"/\":\"opDiv\", \"\\u00f7\":\"opDiv\",\n    \"a\":\"opPlus\", \"A\":\"opPlus\", \"s\":\"opMinus\", \"S\":\"opMinus\",\n    \"m\":\"opMul\", \"M\":\"opMul\", \"d\":\"opDiv\", \"D\":\"opDiv\"\n  },\n  opsHTML:function(){\n    return '\u003cdiv class=\"ops\">'+Shell.OPS.map(function(o){\n      return '\u003cbutton class=\"op\" id=\"'+o[0]+'\" aria-label=\"'+o[3]+'\" aria-keyshortcuts=\"'+o[4]+' '+o[5]+'\"'\n           + ' title=\"'+o[3]+' (type '+o[4]+' or '+o[5]+')\">'+o[2]+'\u003cspan class=\"key\">'+o[5]+'\u003c/span>\u003c/button>';\n    }).join(\"\")+'\u003c/div>';\n  },\n  /* typing + \\u2212 x / while the buttons are showing presses that button */\n  keyOp:function(e){\n    if(e.ctrlKey||e.metaKey||e.altKey) return;\n    if(TI.isOpen()) return;\n    const a=document.activeElement;\n    if(a && ((a.tagName===\"INPUT\" && a.type!==\"checkbox\")||a.tagName===\"TEXTAREA\")) return;\n    const id=Shell.KEYS[e.key];\n    const btn=id && document.getElementById(id);\n    if(!btn) return;\n    e.preventDefault();\n    btn.classList.add(\"kbd\");\n    setTimeout(function(){ btn.classList.remove(\"kbd\"); },180);\n    btn.click();\n  },\n  bindOps:function(fn){\n    Shell.OPS.forEach(function(o){\n      const b=document.getElementById(o[0]);\n      if(b) b.onclick=function(){ fn(o[1],b); };\n    });\n  },\n  shake:function(btn){\n    if(!btn) return;\n    btn.classList.add(\"shake\");\n    Shell.later(340,function(){ btn.classList.remove(\"shake\"); });\n  },\n\n  /* wrap a piece of the equation so it can be clicked (target step), or shown as the one picked */\n  mark:function(phase,html,id,want){\n    if(phase===\"target\") return '\u003cspan class=\"tgt\" role=\"button\" tabindex=\"0\" data-t=\"'+id+'\">'+html+'\u003c/span>';\n    if(phase===\"pick\") return '\u003cspan class=\"tgt'+(id===want?\" picked\":\"\")+'\">'+html+'\u003c/span>';\n    return html;\n  },\n  bindTargets:function(fn){\n    document.querySelectorAll('#eq .tgt[role=button]').forEach(function(t){\n      const go=function(){ fn(t.getAttribute(\"data-t\"),t); };\n      t.onclick=go;\n      t.onkeydown=function(e){ if(e.key===\"Enter\"||e.key===\" \"){ e.preventDefault(); go(); } };\n    });\n  },\n\n  /* equal amounts: deal from a shuffled bag of the three kinds, so every three in a row has one of each */\n  pickKind:function(){\n    if(!Shell.bag.length){\n      let b;\n      do{\n        b=Shell.kinds.map(function(k){return k.id;});\n        for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=b[i]; b[i]=b[j]; b[j]=t; }\n      }while(b[b.length-1]===Shell.lastKind);\n      Shell.bag=b;\n    }\n    const k=Shell.bag.pop(); Shell.lastKind=k;\n    return k;\n  },\n  nextLabel:function(){ return \"Next &rarr;\"; },\n\n  next:function(){\n    if(Shell.begun){ POST({next:1}); return; }\n    Shell.begun=true;\n    Shell.clearTimers();\n    document.getElementById(\"panel\").innerHTML=\"\";\n    Shell.active=\"basic\"; Shell.activeEng=\"two\";\n    Shell.engines.two.start(\"basic\");\n  }\n};\n\nShell.watchFit();\ndocument.addEventListener(\"keydown\",Shell.keyOp);\n\n\n/* ================= two-step =================\n   Every two-step problem is one \"constant\" move and one \"coefficient\" move.\n   Normally the constant goes first; the wrapped form (x + 4)/5 = 3 needs the\n   coefficient cleared first, so the two steps just swap roles.\n   Each move starts with the part in the way highlighted and a box under it\n   asking what we do to both sides. */\nShell.engines[\"two\"] = (function(){\nconst KEY=\"two\";\n\n/* ============ formatting ============ */\nconst MINUS=\"\\u2212\", TIMES=\"\\u00d7\", DIV=\"\\u00f7\";\nfunction esc(s){return String(s).replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");}\nfunction dash(s){return String(s).replace(/-/g,MINUS);}\nfunction gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t;}return a||1;}\n/* a term written with its own sign in front:  + 5   or   \\u2212 7 */\nfunction sgnHTML(n){\n  return '\u003cspan class=\"sgn\">'+(n\u003c0?MINUS:\"+\")+'\u003cspan>'+fN(Math.abs(n))+'\u003c/span>\u003c/span>';\n}\n\n/* ============ parsing ============ */\nfunction parseInt2(raw){\n  if(raw===null||raw===undefined) return null;\n  const s=String(raw).trim().replace(/[\\u2212\\u2013\\u2014]/g,\"-\").replace(/\\s+/g,\"\");\n  const m=s.replace(/\\$/g,\"\").match(/^([+-]?)(\\d+(?:\\.\\d*)?|\\.\\d+)$/);\n  if(!m) return null;\n  return (m[1]===\"-\"?-1:1)*parseFloat(m[2]);\n}\n\n/* ============ problem generation ============ */\nfunction rint(a,b){return Math.floor(Math.random()*(b-a+1))+a;}\nfunction pick(a){return a[Math.floor(Math.random()*a.length)];}\nconst VARS=[\"x\",\"y\",\"n\",\"m\",\"k\",\"t\",\"w\",\"p\",\"r\",\"v\",\"z\",\"c\"];\n\n/* kind tells you what is attached to the variable, and so what the second move is:\n     mul   3x       -> divide by 3\n     div   x/4      -> multiply by 4\n     frac  (2/3)x   -> multiply by 3/2\n     wrap  (x+4)/5  -> multiply by 5 FIRST, then subtract 4\n   M is what the number side is worth after step one; sol is the answer.      */\nfunction tryGen(fl){\n  const V=pick(VARS), varLeft=Math.random()\u003c0.5;\n\n  if(fl===\"negfrac\" && Math.random()\u003c0.2){\n    const a=rint(2,8), k=rint(2,12)*(Math.random()\u003c0.4?-1:1), C=rint(-9,9);\n    if(C===0) return null;\n    const M=a*C, sol=M-k;\n    if(sol===0 || Math.abs(sol)>60) return null;\n    return {kind:\"wrap\", wrapped:true, V:V, a:a, num:0, den:0, s:1,\n            k:k, C:C, M:M, sol:sol, varLeft:varLeft, varFirst:true};\n  }\n\n  let kind, a=0, num=0, den=0, s=1, M=0, sol=0;\n  if(fl===\"fcoef\"){\n    kind=\"frac\";\n    do{ num=rint(1,7); den=rint(2,9); }while(num>=den || gcd(num,den)!==1);\n    s = Math.random()\u003c0.35 ? -1 : 1;\n    const t = rint(1,5)*(Math.random()\u003c0.4?-1:1);\n    sol = den*t; M = s*num*t;\n  } else if(fl===\"basic\"){\n    if(Math.random()\u003c0.6){ kind=\"mul\"; a=rint(2,9); sol=rint(2,12); M=a*sol; }\n    else                 { kind=\"div\"; a=rint(2,9); M=rint(2,12); sol=a*M; }\n  } else {\n    if(Math.random()\u003c0.6){\n      kind=\"mul\"; a=rint(2,9)*(Math.random()\u003c0.6?-1:1);\n      sol=rint(2,12)*(Math.random()\u003c0.45?-1:1); M=a*sol;\n    } else {\n      kind=\"div\"; a=rint(2,9)*(Math.random()\u003c0.6?-1:1);\n      M=rint(2,10)*(Math.random()\u003c0.45?-1:1); sol=a*M;\n    }\n  }\n  if(M===0 || sol===0 || Math.abs(sol)>60 || Math.abs(M)>60) return null;\n\n  const k = rint(2,15)*(Math.random()\u003c(fl===\"basic\"?0.4:0.5) ? -1 : 1);\n  const C = M+k;\n  if(Math.abs(C)>75) return null;\n\n  const varFirst = kind===\"div\" ? Math.random()\u003c0.75 : Math.random()\u003c0.62;\n  return {kind:kind, wrapped:false, V:V, a:a, num:num, den:den, s:s,\n          k:k, C:C, M:M, sol:sol, varLeft:varLeft, varFirst:varFirst};\n}\nfunction genProblem(fl){\n  if(SPEC.p) return Object.assign({},SPEC.p);\n  for(let i=0;i\u003c600;i++){\n    const p=tryGen(fl||\"basic\");\n    if(p) return p;\n  }\n  return {kind:\"mul\",wrapped:false,V:\"x\",a:2,num:0,den:0,s:1,\n          k:5,C:15,M:10,sol:5,varLeft:true,varFirst:true};\n}\n\n/* ============ state ============ */\nconst S={\n  p:null, fl:\"basic\", phase:\"ask1\", sign:1,\n  opIn:\"\", coefIn:\"\", recN:\"\", recD:\"\", mIn:\"\", ansIn:\"\", moveIn:\"\",\n  simpDen:\"\", simpNum:\"\",\n  miss:\"\", hint:false, clean:true, firstId:null\n};\nconst clearTimers=Shell.clearTimers, later=Shell.later;\n\n/* ============ where we are ============ */\nconst ORDER=[\"dist\",\"ask1\",\"op1\",\"cancel1\",\"simplify1\",\"compute1\",\n             \"ask2\",\"op2\",\"cancel2\",\"simplify2\",\"compute2\",\"solved\",\"check\"];\nfunction idx(ph){return ORDER.indexOf(ph);}\nfunction at(ph){return idx(S.phase)>=idx(ph);}\nfunction past(ph){return idx(S.phase)>idx(ph);}\nfunction stepNo(){return /\\d$/.test(S.phase) ? +S.phase.slice(-1) : 0;}\nfunction subName(){return stepNo() ? S.phase.slice(0,-1) : S.phase;}\nfunction cs(){return S.p.wrapped?2:1;}          /* which step clears the constant */\nfunction ks(){return S.p.wrapped?1:2;}          /* which step clears the coefficient */\nfunction isConst(){return stepNo()===cs();}\n\n/* what each move works on and what it produces */\nfunction constIn(){return S.p.wrapped?S.p.M:S.p.C;}\nfunction coefIn(){return S.p.wrapped?S.p.C:S.p.M;}\n\n/* ---- what's in the way ----\n   ids:  k = the loose number,  a = what is attached to the variable,\n         v = the variable,      c = the lone number on the other side\n   While a step is asking, the piece in the way is highlighted and the\n   question box hangs underneath it. */\nfunction wantT(step){ return step===cs() ? \"k\" : \"a\"; }\nfunction askHTML(h){\n  return '\u003cspan class=\"tgt picked asking\">'+h+'\u003cspan class=\"ask\">'\n    + boxHTML(\"askIn\",S.moveIn,\" ask-box\").replace('\u003cinput ','\u003cinput enterkeyhint=\"done\" aria-label=\"What do we do to both sides?\" ')\n    + '\u003cspan class=\"ask-q\">What do we do to both sides?\u003c/span>\u003c/span>\u003c/span>';\n}\nfunction marker(step){\n  const asking=S.phase===\"ask\"+step, w=wantT(step);\n  return function(h,id){ return (asking && id===w) ? askHTML(h) : h; };\n}\nfunction plain(h){ return h; }\n\n/* ---- cross-simplifying, set up exactly as the one-step fraction drill does it. */\nfunction gFac(){return gcd(S.p.num, Math.abs(coefIn()));}\nfunction canSimp(){return S.p.kind===\"frac\" && gFac()>1;}\nfunction redDen(){return S.p.num/gFac();}\nfunction redNum(){return coefIn()/gFac();}\nfunction simpPhase(){return \"simplify\"+ks();}\nfunction simplifying(){return S.phase===simpPhase();}\nfunction simpDenOK(){return parseInt2(S.simpDen)===redDen();}\nfunction simpNumOK(){const v=parseInt2(S.simpNum); return v!==null && v===redNum();}\nfunction simpOK(){return simpDenOK()&&simpNumOK();}\nfunction simpPartial(){\n  const dv=parseInt2(S.simpDen), nv=parseInt2(S.simpNum);\n  if(dv===null||nv===null||dv\u003c=redDen()) return false;\n  const g=S.p.num/dv;\n  return Number.isInteger(g) && g>1 && nv===coefIn()/g;\n}\n\n/* how the cancelled pieces are marked right now */\nfunction cCls(){ return S.phase===\"cancel\"+cs() ? \"cancelling\" : (past(\"cancel\"+cs())?\"struck\":\"\"); }\nfunction kCls(){ return S.phase===\"cancel\"+ks() ? \"cancelling\" : (past(\"cancel\"+ks())?\"struck\":\"\"); }\nfunction slashCls(){ return S.phase===\"cancel\"+ks() ? \"slash draw\" : (past(\"cancel\"+ks())?\"slash dim\":\"\"); }\nfunction coefMoved(){return at(\"op\"+ks());}     /* the coefficient move is on the page */\nfunction coefLive(){return S.phase===\"op\"+ks();} /* ...and still being typed into */\nfunction varSign(){\n  const p=S.p;\n  if(p.kind===\"mul\")  return p.a\u003c0?-1:1;\n  if(p.kind===\"frac\") return p.s\u003c0?-1:1;\n  return (p.kind===\"div\"&&p.negShow)?-1:1;\n}\n\n/* ============ rendering pieces ============ */\nfunction boxHTML(id,val,extra){\n  return '\u003cinput id=\"'+id+'\" class=\"box'+(extra||\"\")+'\" value=\"'+esc(val)\n       + '\" autocomplete=\"off\" spellcheck=\"false\" inputmode=\"text\">';\n}\nfunction cell(html,cls){return '\u003cdiv class=\"cell '+(cls||\"\")+'\">'+html+'\u003c/div>';}\nfunction wideCell(html,cls){return '\u003cdiv class=\"cell span2 '+(cls||\"\")+'\">'+html+'\u003c/div>';}\nfunction dfrac(t,b,cls){\n  return '\u003cspan class=\"dfrac '+(cls||\"\")+'\">\u003cspan class=\"t\">'+t+'\u003c/span>'\n       + '\u003cspan class=\"bar\">\u003c/span>\u003cspan class=\"b\">'+b+'\u003c/span>\u003c/span>';\n}\nfunction mgroup(mult,inner,tall,cls){\n  return '\u003cspan class=\"mgroup'+(tall?\" tall\":\"\")+' '+(cls||\"\")+'\">'+mult\n       + '\u003cspan class=\"paren\">(\u003c/span>'+inner+'\u003cspan class=\"paren\">)\u003c/span>\u003c/span>';\n}\nfunction tpair(a,b){ return '\u003cspan class=\"tpair\">'+a+b+'\u003c/span>'; }\nfunction markK(v){\n  const c=kCls();\n  return c ? '\u003cspan class=\"'+c+'\">'+dash(fN(v))+'\u003c/span>' : dash(fN(v));\n}\nfunction coefFracHTML(){const p=S.p; return (p.s\u003c0?MINUS:\"\")+dfrac(p.num,p.den);}\nfunction recipHTML(marked){\n  const p=S.p, inner=(p.s\u003c0?MINUS:\"\")+dfrac(p.den,p.num);\n  return marked ? '\u003cspan class=\"'+slashCls()+'\">'+inner+'\u003c/span>' : inner;\n}\nfunction recipOK(){\n  const p=S.p, n=parseInt2(S.recN), d=parseInt2(S.recD);\n  if(n===null||d===null||n===0||d===0) return false;\n  return Math.abs(n)===p.den && Math.abs(d)===p.num && ((n*d>0)===(p.s>0));\n}\nfunction fracboxHTML(nId,dId){\n  const cls=\" mini\"+(recipOK()?\" ok\":\"\");\n  return '\u003cspan class=\"fracbox\">'+boxHTML(nId,S.recN,cls)\n       + '\u003cspan class=\"bar\">\u003c/span>'+boxHTML(dId,S.recD,cls)+'\u003c/span>';\n}\n\n/* live: the student is still filling the two small boxes in.\n   otherwise the reduced numbers are just written in, and the strokes stay. */\nfunction pendCls(ok,live){return live ? (ok?\"slash draw\":\"pend\") : \"slash cross\";}\nfunction recipCancelHTML(live){\n  const p=S.p;\n  const den='\u003cspan class=\"cx below\">\u003cspan id=\"slD\" class=\"'+pendCls(simpDenOK(),live)+'\">'+p.num+'\u003c/span>'\n    + '\u003cspan class=\"redu\">'\n    + (live?boxHTML(\"sd\",S.simpDen,\" tiny\"+(simpDenOK()?\" ok\":\"\")):String(redDen()))\n    + '\u003c/span>\u003c/span>';\n  return (p.s\u003c0?MINUS:\"\")+dfrac(p.den,den);\n}\nfunction constCancelHTML(live){\n  return '\u003cspan class=\"cx above\">\u003cspan class=\"redu\">'\n    + (live?boxHTML(\"sn\",S.simpNum,\" tiny\"+(simpNumOK()?\" ok\":\"\")):dash(fN(redNum())))\n    + '\u003c/span>\u003cspan id=\"slN\" class=\"'+pendCls(simpNumOK(),live)+'\">'\n    + dash(fN(coefIn()))+'\u003c/span>\u003c/span>';\n}\n\n/* the variable term as written.  inline folds its sign in ( \\u22123p );\n   otherwise the sign is left to the caller, which is how 12 \\u2212 3p is set.\n   tm wraps the piece in the way when it is time to ask about it. */\nfunction varTermHTML(inline,marked,tm){\n  const p=S.p, V=p.V, c=kCls();\n  tm = tm || plain;\n  const mk=function(h){return (marked&&c) ? '\u003cspan class=\"'+c+'\">'+h+'\u003c/span>' : h;};\n  if(p.kind===\"wrap\") return dfrac(tm(V,\"v\")+tm(sgnHTML(p.k),\"k\"), tm(mk(String(p.a)),\"a\"));\n  if(p.kind===\"mul\")  return tpair(tm(mk(inline?dash(fN(p.a)):String(Math.abs(p.a))),\"a\"), tm(V,\"v\"));\n  if(p.kind===\"div\")  return dfrac(tm(V,\"v\"), tm(mk((p.negShow&&!inline)?String(Math.abs(p.a)):dash(fN(p.a))),\"a\"));\n  const f=(inline&&p.s\u003c0?MINUS:\"\")+dfrac(p.num,p.den);\n  return tpair(tm(marked ? '\u003cspan class=\"'+slashCls()+'\">'+f+'\u003c/span>' : f,\"a\"), tm(V,\"v\"));\n}\n\n/* the second move, written on both sides of whatever line it lands on */\nfunction coefApply(t,n){\n  const p=S.p, live=coefLive();\n  if(p.kind===\"mul\"){\n    return [dfrac(t, live?boxHTML(\"kA\",S.coefIn,\"\"):markK(p.a), \"grow\"),\n            dfrac(n, live?boxHTML(\"kB\",S.coefIn,\"\"):dash(fN(p.a)), \"grow\")];\n  }\n  if(p.kind===\"frac\"){\n    const vSide = mgroup(live?fracboxHTML(\"nA\",\"dA\"):recipHTML(true), t, true, \"fade\");\n    /* once the coefficient is gone, the number side is a fraction times a number.\n       If they share a factor, cancel it there before multiplying. */\n    const nSide = (canSimp() && at(simpPhase()))\n      ? mgroup(recipCancelHTML(simplifying()), constCancelHTML(simplifying()), true, \"roomy\")\n      : mgroup(live?fracboxHTML(\"nB\",\"dB\"):recipHTML(false), n, true, \"fade\");\n    return [vSide, nSide];\n  }\n  return [mgroup(live?boxHTML(\"kA\",S.coefIn,\"\"):markK(p.a), t, true,  \"fade\"),\n          mgroup(live?boxHTML(\"kB\",S.coefIn,\"\"):dash(fN(p.a)), n, false, \"fade\")];\n}\n\n/* ============ the equation ============ */\n/* once the answer is found, it goes back into the top line in place of the variable */\nfunction subHTML(){\n  return '\u003cspan class=\"subv\">\u003cspan class=\"sp\">(\u003c/span>\u003cspan class=\"subnum landing\">'\n       + dash(fN(S.p.sol))+'\u003c/span>\u003cspan class=\"sp\">)\u003c/span>\u003c/span>';\n}\nfunction subMark(h,id){ return id===\"v\" ? subHTML() : h; }\nfunction order(t1,t2,eq,n){ return S.p.varLeft ? t1+t2+eq+n : n+eq+t1+t2; }\n\nfunction normalRows(){\n  const p=S.p, rows=[];\n  const EQ=cell(\"=\",\"eqsign\"), BLANK=cell(\"\",\"hide\"), NOEQ=cell(\"\",\"\");\n  if(SPEC.dist && !at(\"check\")){\n    const Cc=cell(dash(fN(p.C)));\n    rows.push(p.varLeft ? wideCell(SPEC.dist.orig)+EQ+Cc : Cc+EQ+wideCell(SPEC.dist.orig));\n    if(S.phase===\"dist\"){\n      const r=distOK();\n      const bA=boxHTML(\"dA\",S.dA,\" wide\"+(r.a?\" ok\":\"\")), bB=boxHTML(\"dB\",S.dB,\" wide\"+(r.b?\" ok\":\"\"));\n      rows.push(order(cell(bA),cell(bB),EQ,cell(dash(fN(p.C)))));\n      return rows;\n    }\n  }\n  /* line 1 \u2014 the problem as given (at the check, clean again, with no marks on it) */\n  const chk=at(\"check\");\n  rows.push(topLine(chk ? plain : marker(1), chk ? \"\" : cCls(), \"\"));\n  if(chk) return rows.concat(evalRows());\n\n  /* line 2 \u2014 the same move on both sides */\n  if(at(\"op1\")){\n    const live=S.phase===\"op1\";\n    const g='\u003cspan class=\"sgn\">'+(S.sign\u003c0?MINUS:\"+\")+'\u003c/span>';\n    const vSide = live ? g+boxHTML(\"cA\",S.opIn,\"\") : sgnHTML(-p.k);\n    const nSide = live ? g+boxHTML(\"cB\",S.opIn,\"\") : sgnHTML(-p.k);\n    rows.push(p.varFirst\n      ? order(BLANK, cell(vSide,cCls()+\" blue\"), NOEQ, cell(nSide,\"blue\"))\n      : order(cell(vSide,cCls()+\" blue\"), BLANK, NOEQ, cell(nSide,\"blue\")));\n    if(at(\"cancel1\")) rows.push('\u003cdiv class=\"rule\">\u003c/div>');\n  }\n\n  /* line 3 \u2014 what is left, and then the second move written over it */\n  if(at(\"compute1\")){\n    const m2=marker(2);\n    let v=varTermHTML(true,coefMoved(),m2);\n    let n=S.phase===\"compute1\" ? boxHTML(\"mv\",S.mIn,\"\") : m2(dash(fN(p.M)),\"c\");\n    if(coefMoved()){ const r=coefApply(v,n); v=r[0]; n=r[1]; }\n    const nCls = (S.phase===\"compute2\"||simplifying()) ? \"blue\" : \"\";\n    rows.push(p.varFirst ? order(cell(v),BLANK,EQ,cell(n,nCls))\n                         : order(BLANK,cell(v),EQ,cell(n,nCls)));\n  }\n\n  /* line 4 \u2014 the answer */\n  if(at(\"compute2\")){\n    rows.push('\u003cdiv class=\"spacer\">\u003c/div>');\n    const ans = S.phase===\"compute2\" ? boxHTML(\"ans\",S.ansIn,\"\")\n              : '\u003cspan class=\"green ansval\">'+dash(fN(p.sol))+'\u003c/span>';\n    const vc = cell('\u003cspan class=\"'+(at(\"solved\")?\"green\":\"\")+'\">'+p.V+'\u003c/span>');\n    rows.push(p.varFirst ? order(vc,BLANK,EQ,cell(ans)) : order(BLANK,vc,EQ,cell(ans)));\n  }\n  return rows;\n}\n\nfunction wrappedRows(){\n  const p=S.p, rows=[];\n  const EQ=cell(\"=\",\"eqsign\"), BLANK=cell(\"\",\"hide\"), NOEQ=cell(\"\",\"\");\n  const m1=marker(1);\n\n  /* line 1 \u2014 the whole side sits over a, so that has to go first.\n     At the check it goes back to the original, clean. */\n  if(at(\"check\")) return [topLine(plain,\"\",\"\")].concat(evalRows());\n  let v=varTermHTML(true,coefMoved(),m1), n=m1(dash(fN(p.C)),\"c\");\n  if(coefMoved()){ const r=coefApply(v,n); v=r[0]; n=r[1]; }\n  const nCls = S.phase===\"compute1\" ? \"blue\" : \"\";\n  rows.push(p.varLeft ? wideCell(v)+EQ+cell(n,nCls) : cell(n,nCls)+EQ+wideCell(v));\n\n  /* line 2 \u2014 now an ordinary one-step problem */\n  if(at(\"compute1\")){\n    const m2=marker(2);\n    rows.push('\u003cdiv class=\"spacer\">\u003c/div>');\n    const mHTML = S.phase===\"compute1\" ? boxHTML(\"mv\",S.mIn,\"\") : m2(dash(fN(p.M)),\"c\");\n    rows.push(order(cell(m2(p.V,\"v\")), cell(m2(sgnHTML(p.k),\"k\"),cCls()), EQ,\n                    cell(mHTML, S.phase===\"compute2\"?\"blue\":\"\")));\n  }\n\n  /* line 3 \u2014 the same move on both sides */\n  if(at(\"op2\")){\n    const live=S.phase===\"op2\";\n    const g='\u003cspan class=\"sgn\">'+(S.sign\u003c0?MINUS:\"+\")+'\u003c/span>';\n    const vSide = live ? g+boxHTML(\"cA\",S.opIn,\"\") : sgnHTML(-p.k);\n    const nSide = live ? g+boxHTML(\"cB\",S.opIn,\"\") : sgnHTML(-p.k);\n    rows.push(order(BLANK, cell(vSide,cCls()+\" blue\"), NOEQ, cell(nSide,\"blue\")));\n    if(at(\"cancel2\")) rows.push('\u003cdiv class=\"rule\">\u003c/div>');\n  }\n\n  /* line 4 \u2014 the answer */\n  if(at(\"compute2\")){\n    const ans = S.phase===\"compute2\" ? boxHTML(\"ans\",S.ansIn,\"\")\n              : '\u003cspan class=\"green ansval\">'+dash(fN(p.sol))+'\u003c/span>';\n    rows.push(order(cell('\u003cspan class=\"'+(at(\"solved\")?\"green\":\"\")+'\">'+p.V+'\u003c/span>'),\n                    BLANK, EQ, cell(ans)));\n  }\n  return rows;\n}\n\nfunction renderEquation(){\n  document.getElementById(\"eq\").innerHTML = (S.p.wrapped?wrappedRows():normalRows()).join(\"\");\n}\n\n/* ============ the panel ============ */\n/* the top line, worked out underneath it with the answer in place:\n   first what each piece comes to, then both sides the same */\n/* the problem as written. tm wraps pieces (to ask about them, or to put the answer\n   in for the variable), kc marks the loose number, extra goes on every cell. */\nfunction topLine(tm,kc,extra){\n  const p=S.p, x=extra ? \" \"+extra : \"\";\n  const EQ=cell(\"=\",\"eqsign\"+x), cBlue=S.phase===\"compute1\" ? \"blue\" : \"\";\n  if(p.wrapped){\n    const v=varTermHTML(true,false,tm), n=dash(fN(p.C));\n    return p.varLeft ? wideCell(v,x)+EQ+cell(n,x) : cell(n,x)+EQ+wideCell(v,x);\n  }\n  const cHTML=tm(dash(fN(p.C)),\"c\");\n  if(p.varFirst)\n    return order(cell(varTermHTML(true,false,tm),x), cell(tm(sgnHTML(p.k),\"k\"),kc+x),\n                 EQ, cell(cHTML,cBlue+x));\n  return order(cell(tm(dash(fN(p.k)),\"k\"),kc+x),\n               cell('\u003cspan class=\"sgn\">'+(varSign()\u003c0?MINUS:\"+\")+'\u003c/span>'+varTermHTML(false,false,tm),x),\n               EQ, cell(cHTML,cBlue+x));\n}\n/* under the original: the same equation with the answer in, then worked out a line at a time */\nfunction evalRows(){\n  const p=S.p, C=dash(fN(p.C));\n  const mid = p.wrapped  ? dfrac(dash(fN(p.M)), dash(fN(p.a)))\n            : p.varFirst ? dash(fN(p.M))+' '+sgnHTML(p.k)\n                         : dash(fN(p.k))+' '+sgnHTML(p.M);\n  const line=function(vSide,first,last,cls){\n    const E=cell(\"=\",\"eqsign \"+cls);\n    /* the worked-out side sits up against the = sign, so the three = line up neatly */\n    return p.varLeft ? wideCell(first,cls+\" to-eq-r\")+E+cell(last,cls)\n                     : cell(first,cls)+E+wideCell(last,cls+\" to-eq-l\");\n  };\n  const g='\u003cspan class=\"green\">'+C+'\u003c/span>';\n  return ['\u003cdiv class=\"spacer\">\u003c/div>',\n          topLine(subMark,\"\",\"evalline ev0\"),\n          '\u003cdiv class=\"spacer\">\u003c/div>',\n          p.varLeft ? line(1,mid,C,\"evalline ev1\") : line(1,C,mid,\"evalline ev1\"),\n          '\u003cdiv class=\"spacer\">\u003c/div>',\n          line(1,g,g+' \u003cspan class=\"green\">&#10003;\u003c/span>',\"evalline ev2\")];\n}\nfunction renderPanel(){\n  const el=document.getElementById(\"panel\");\n  el.innerHTML=\"\";\n}\n\n/* ============ the prompt ============ */\nfunction renderPrompt(){\n  const el=document.getElementById(\"promptbar\"), p=S.p, V=p.V;\n  const sub=subName(), konst=isConst();\n  let h=\"\";\n\n  if(S.phase===\"dist\"){\n    h='\u003cdiv class=\"prompt\">\u003cspan>'+SPEC.dist.prompt+'\u003c/span>\u003c/div>';\n  }\n  else if(sub===\"ask\"){\n    h='\u003cdiv class=\"prompt\">\u003cspan>Get rid of the highlighted part. '\n      + '\u003cstrong>a\u003c/strong> add, \u003cstrong>s\u003c/strong> subtract, \u003cstrong>m\u003c/strong> multiply, \u003cstrong>d\u003c/strong> divide.\u003c/span>'\n      + '\u003cspan class=\"faint\">Type the move. It goes on both sides, then you type the number.\u003c/span>\u003c/div>';\n  }\n  else if(sub===\"op\"){\n    if(konst){\n      h='\u003cdiv class=\"prompt\">\u003cspan>Now type how much you '+(S.sign\u003c0?\"subtract from\":\"add to\")+' both sides.\u003c/span>\u003c/div>';\n    } else if(p.kind===\"mul\"){\n      h='\u003cdiv class=\"prompt\">\u003cspan>Divide both sides by the number multiplying '+V+'.\u003c/span>\u003c/div>';\n    } else if(p.kind===\"frac\"){\n      h='\u003cdiv class=\"prompt\">\u003cspan>Multiply both sides by the reciprocal of\u003c/span>'\n        + '\u003cspan class=\"math\">'+coefFracHTML()+'\u003c/span>\u003c/div>';\n    } else {\n      h='\u003cdiv class=\"prompt\">\u003cspan>Multiply both sides by the number underneath '+V+'.'+(p.negShow?' The minus sign in front counts, so it is '+dash(fN(p.a))+'.':'')+'\u003c/span>\u003c/div>';\n    }\n  }\n  else if(sub===\"cancel\"){\n    if(konst){\n      h='\u003cdiv class=\"prompt\">\u003cspan class=\"math\">'+dash(fN(p.k))+'\u003c/span>\u003cspan>and\u003c/span>'\n        + '\u003cspan class=\"math\">'+sgnHTML(-p.k)+'\u003c/span>\u003cspan>make zero, so they cancel'\n        + (p.wrapped?' &mdash; leaving '+V+' alone':' &mdash; leaving the '+V+' term by itself')+'.\u003c/span>\u003c/div>';\n    } else if(p.kind===\"frac\"){\n      h='\u003cdiv class=\"prompt\">\u003cspan class=\"math\">'+recipHTML(false)+'\u003c/span>\u003cspan>'+TIMES+'\u003c/span>'\n        + '\u003cspan class=\"math\">'+coefFracHTML()+'\u003c/span>'\n        + '\u003cspan>makes 1, so the coefficient is gone &mdash; leaving '+V+' alone.\u003c/span>\u003c/div>';\n    } else {\n      h='\u003cdiv class=\"prompt\">\u003cspan class=\"math\">'+dash(fN(p.a))+'\u003c/span>\u003cspan>over\u003c/span>'\n        + '\u003cspan class=\"math\">'+dash(fN(p.a))+'\u003c/span>'\n        + '\u003cspan>makes 1, so they cancel &mdash; leaving '+V+(p.wrapped?' and the '+Math.abs(p.k)+' free of the fraction':' alone')\n        + '.\u003c/span>\u003c/div>';\n    }\n  }\n  else if(sub===\"simplify\"){\n    const M=coefIn();\n    h='\u003cdiv class=\"prompt\">\u003cspan>\u003cstrong>Simplify before you multiply.\u003c/strong> '\n      + p.num+' and '+Math.abs(M)+' share a factor &mdash; divide them both by it.\u003c/span>';\n    if(simpPartial()) h+='\u003cdiv class=\"noteline\">That is a common factor, but not the biggest one '\n      + '&mdash; those two can still be cancelled further.\u003c/div>';\n    h+='\u003c/div>';\n  }\n  else if(sub===\"compute\"){\n    if(konst){\n      h='\u003cdiv class=\"prompt\">\u003cspan>Combine the blue side:\u003c/span>\u003cspan class=\"math blue\">'\n        + dash(fN(constIn()))+' '+sgnHTML(-p.k)+'\u003c/span>\u003c/div>';\n    } else {\n      const M=coefIn(), Md=dash(fN(M));\n      /* after cancelling, the numbers on the page are the small ones */\n      const cut = (p.s\u003c0?MINUS:\"\")+(redDen()>1?dfrac(p.den,redDen()):String(p.den))\n                + ' '+TIMES+' '+dash(fN(redNum()));\n      const expr = p.kind===\"mul\"  ? Md+' '+DIV+' '+dash(fN(p.a))\n                 : p.kind===\"frac\" ? (canSimp() ? cut : recipHTML(false)+' '+TIMES+' '+Md)\n                                   : dash(fN(p.a))+' '+TIMES+' '+Md;\n      h='\u003cdiv class=\"prompt\">\u003cspan>Now finish the other side:\u003c/span>'\n        + '\u003cspan class=\"math blue\">'+expr+'\u003c/span>\u003c/div>';\n    }\n  }\n  else if(S.phase===\"solved\"){\n    h='\u003cdiv class=\"prompt\">\u003cspan class=\"green\">\u003cstrong>That\\'s '+V+'. Now check it.\u003c/strong>\u003c/span>\u003c/div>';\n  }\n  else if(S.phase===\"check\"){\n    h='\u003cdiv class=\"row-between\">\u003cdiv class=\"prompt\">\u003cspan>Put\u003c/span>\u003cspan class=\"math\">'\n      + dash(fN(p.sol))+'\u003c/span>\u003cspan>back in for '+V+'. Both sides match, so it\\'s true.\u003c/span>\u003c/div>'\n      + '\u003cbutton class=\"next\" id=\"nextBtn\">'+Shell.nextLabel()+'\u003c/button>\u003c/div>';\n  }\n  if(S.miss) h+='\u003cdiv class=\"missline\">'+S.miss+'\u003c/div>';\n  el.innerHTML=h;\n}\n\n/* ---- one size per problem, as big as the screen allows ----\n   Before the first line is drawn, this problem is drawn off-screen in its two\n   biggest states (every line of working plus the check, and the last set of\n   operation buttons) and measured. It is then scaled up or down so that finished\n   problem just fills the room, and the block keeps that height from the start,\n   so new lines appear below without anything moving or resizing mid-solve. */\nfunction lockScale(){\n  const room=Shell.room();\n  Shell.stageH=0; Shell.mainW=0; Shell.sideW=0;\n  if(!room.h || !room.w){ Shell.scale=1; return; }\n  const savePhase=S.phase, saveMiss=S.miss;\n  const g=document.getElementById(\"ghost\");\n  let mw=0, mh=0, sw=0, sh=0, gap=0, row=true, half=0, low=0;\n  /* the finished problem, and each question box, which hangs below its line\n     and can reach past the edges of the equation */\n  [\"solved\",\"check\",\"ask1\",\"ask2\"].forEach(function(ph){\n    S.phase=ph; S.miss=\"\";\n    g.innerHTML='\u003cdiv class=\"stage\">\u003cdiv class=\"stage-main\">'\n      + '\u003cdiv class=\"scroller\">\u003cdiv class=\"eq k-two\">'\n      + (S.p.wrapped?wrappedRows():normalRows()).join(\"\")\n      + '\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"stage-side\">'\n      + '\u003cdiv>'+\"\"+'\u003c/div>\u003c/div>\u003c/div>';\n    const stage=g.firstChild, main=stage.children[0], side=stage.children[1];\n    const cs=getComputedStyle(stage);\n    row = cs.flexDirection===\"row\";\n    gap = parseFloat(row?cs.columnGap:cs.rowGap)||0;\n    mw=Math.max(mw,main.offsetWidth); mh=Math.max(mh,main.offsetHeight);\n    sw=Math.max(sw,side.offsetWidth); sh=Math.max(sh,side.offsetHeight);\n    const a=main.querySelector(\".ask\");\n    if(a){\n      const r=main.getBoundingClientRect(), q=a.getBoundingClientRect(), mid=r.left+r.width/2;\n      half=Math.max(half, mid-q.left, q.right-mid);\n      low=Math.max(low, q.bottom-r.top);\n    }\n  });\n  g.innerHTML=\"\";\n  S.phase=savePhase; S.miss=saveMiss;\n  mh=Math.max(mh,Math.ceil(low));\n  const spill=Math.max(0, half-mw/2)*2;\n  const w = (row ? mw+gap+sw : Math.max(mw,sw)) + spill;\n  const h = row ? Math.max(mh,sh) : mh+gap+sh;\n  if(!w || !h){ Shell.scale=1; return; }\n  /* a little spare width for the click highlights on the first line */\n  const raw=Math.min(room.w*0.95/w, room.h*0.97/h);\n  /* a floor, so a very short window shrinks the writing only so far; a ceiling so a\n     small problem on a huge screen doesn't turn into a billboard */\n  Shell.scale=Math.min(Math.max(raw,0.5),2.4);\n  Shell.stageH=h; Shell.mainW=mw; Shell.sideW=sw;\n  document.querySelector(\".work\").style.overflowY = (raw \u003c 0.5) ? \"auto\" : \"hidden\";\n}\n\nfunction render(){\n  Shell.head(); renderEquation(); renderPanel(); renderPrompt(); attach();\n  Shell.applyScale(); focusFirst();\n}\nfunction focusFirst(){\n  later(60,function(){\n    const el=S.firstId && document.getElementById(S.firstId);\n    if(el && !el.readOnly) el.focus();\n  });\n}\n\n/* ============ flow ============ */\nfunction setPhase(ph){\n  clearTimers();\n  S.phase=ph; S.miss=\"\";\n  S.firstId = /^ask/.test(ph)   ? \"askIn\"\n            : ph===\"op\"+cs()   ? \"cA\"\n            : ph===\"op\"+ks()   ? (S.p.kind===\"frac\" ? (parseInt2(S.recN)===null?\"nA\":\"dA\") : \"kA\")\n            : ph===simpPhase() ? \"sd\"\n            : ph===\"compute1\"  ? \"mv\"\n            : ph===\"compute2\"  ? \"ans\" : null;\n  render();\n  if(ph===\"cancel1\") later(1700,function(){ setPhase(afterCancel(1)); });\n  if(ph===\"cancel2\") later(1750,function(){ setPhase(afterCancel(2)); });\n  if(ph===\"solved\")  later(850, clearWork);\n  if(ph===\"check\")   flyAnswer();\n}\n/* the coefficient step gets a cancelling stop first when there is one to make */\nfunction afterCancel(step){\n  return (step===ks() && canSimp()) ? \"simplify\"+step : \"compute\"+step;\n}\n/* plain-text version of the problem and answer, for the turn-in log */\nfunction describe(){\n  const p=S.p, V=p.V;\n  const pm=function(n){ return (n\u003c0?MINUS:\"+\")+\" \"+Math.abs(n); };\n  let side;\n  if(p.kind===\"wrap\") side=\"(\"+V+\" \"+pm(p.k)+\")/\"+p.a;\n  else {\n    let lead, bare;\n    if(p.kind===\"mul\"){ lead=dash(fN(p.a))+V; bare=Math.abs(p.a)+V; }\n    else if(p.kind===\"div\"){ lead=V+\"/\"+dash(fN(p.a)); bare=lead; }\n    else { bare=\"(\"+p.num+\"/\"+p.den+\")\"+V; lead=(p.s\u003c0?MINUS:\"\")+bare; }\n    side = p.varFirst ? lead+\" \"+pm(p.k)\n                      : dash(fN(p.k))+\" \"+(varSign()\u003c0?MINUS:\"+\")+\" \"+bare;\n  }\n  const C=dash(fN(p.C));\n  return {q: p.varLeft ? side+\" = \"+C : C+\" = \"+side, a: V+\" = \"+dash(fN(p.sol))};\n}\nfunction finish(){ Shell.solved(S.clean, describe()); setPhase(\"solved\"); }\nfunction flagMiss(msg){\n  POST({miss:1});\n  S.clean=false; S.miss=msg; renderPrompt(); attach();\n  later(3000,function(){ S.miss=\"\"; renderPrompt(); attach(); });\n}\nfunction missMessage(){\n  const sub=subName();\n  if(sub===\"op\") return isConst()\n    ? \"That won't cancel it out \\u2014 use the same size number that's in the way.\"\n    : (S.p.kind===\"frac\" ? \"Not quite \\u2014 flip the fraction over, and keep the sign in mind.\"\n                         : \"Not quite \\u2014 check the number and its sign, then try again.\");\n  if(sub===\"simplify\") return \"Divide both numbers by the same factor, then write what each one becomes.\";\n  if(sub===\"compute\") return \"Not quite \\u2014 check the size and the sign, then try again.\";\n  return \"\";\n}\nfunction nextProblem(){ Shell.next(); }\n/* the check: the work fades away, leaving the top line and the answer.\n   The answer travels up into the top line where the variable was, and the\n   top line is worked out underneath to show both sides match. */\nfunction stillMotion(){ return !!(window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches); }\nfunction dropFlyers(){ document.querySelectorAll(\".flyer\").forEach(function(f){ f.remove(); }); }\nfunction clearWork(){\n  const eq=document.getElementById(\"eq\"), kids=[].slice.call(eq.children);\n  const top=S.p.wrapped ? 3 : 4, off=SPEC.dist?3:0;\n  kids.forEach(function(c,i){ if((i\u003coff||i>=off+top) && !c.querySelector(\".ansval\")) c.classList.add(\"goaway\"); });\n  later(600, function(){\n    const a=document.querySelector(\"#eq .ansval\");\n    S.flyFrom = a ? {r:a.getBoundingClientRect(), text:a.textContent,\n                     fs:parseFloat(getComputedStyle(a).fontSize)*Shell.scale} : null;\n    setPhase(\"check\");\n  });\n}\n/* One line at a time, a second apart. With reduced motion turned on, nothing flies\n   or fades, but the lines still come one at a time. */\nconst BEAT=1000;\nfunction flyAnswer(){\n  dropFlyers();\n  const from=S.flyFrom; S.flyFrom=null;\n  const still=stillMotion();\n  /* the answer stays put at the bottom while the original sits alone on top */\n  let f=null;\n  if(from){\n    f=document.createElement(\"span\");\n    f.className=\"flyer\"; f.textContent=from.text; f.setAttribute(\"aria-hidden\",\"true\");\n    f.style.left=from.r.left+\"px\"; f.style.top=from.r.top+\"px\";\n    f.style.width=from.r.width+\"px\"; f.style.height=from.r.height+\"px\";\n    f.style.fontSize=from.fs+\"px\";\n    document.body.appendChild(f);\n  }\n  /* then the equation is written again underneath, with a gap where the variable was */\n  later(BEAT,function(){ showRow(\"ev0\"); });\n  /* then the answer travels up into the gap */\n  later(2*BEAT,function(){\n    const dst=document.querySelector(\"#eq .subnum\");\n    if(!f || !dst || still || !f.animate){ landAnswer(); return; }\n    const r=from.r, t=dst.getBoundingClientRect();\n    const dx=(t.left+t.width/2)-(r.left+r.width/2), dy=(t.top+t.height/2)-(r.top+r.height/2);\n    const k=(t.height && r.height) ? t.height/r.height : 1;\n    f.animate([\n      {transform:\"translate(0,0) scale(1)\"},\n      {transform:\"translate(\"+(dx*0.5+Math.min(60,Math.abs(dy)*0.25))+\"px,\"+(dy*0.5)+\"px) scale(1.2)\", offset:0.5},\n      {transform:\"translate(\"+dx+\"px,\"+dy+\"px) scale(\"+k+\")\"}\n    ],{duration:BEAT, easing:\"cubic-bezier(.45,0,.25,1)\", fill:\"forwards\"});\n    later(BEAT,landAnswer);\n  });\n}\nfunction showRow(cls){ document.querySelectorAll(\"#eq .\"+cls).forEach(function(c){ c.classList.add(\"show\"); }); }\nfunction landAnswer(){\n  dropFlyers();\n  const d=document.querySelector(\"#eq .subnum\");\n  if(d){ d.classList.remove(\"landing\"); d.classList.add(\"landed\"); }\n  /* then the working, one line at a time */\n  later(BEAT,  function(){ showRow(\"ev1\"); });\n  later(2*BEAT,function(){ showRow(\"ev2\"); });\n}\nfunction begin(fl){\n  clearTimers(); dropFlyers();\n  S.fl = fl || \"basic\";\n  S.p = genProblem(S.fl);\n  S.phase=SPEC.dist?\"dist\":\"ask1\"; S.sign=1; S.dA=\"\"; S.dB=\"\";\n  S.opIn=\"\"; S.coefIn=\"\"; S.recN=\"\"; S.recD=\"\"; S.mIn=\"\"; S.ansIn=\"\"; S.moveIn=\"\";\n  S.simpDen=\"\"; S.simpNum=\"\";\n  S.hint=false; S.clean=true; S.miss=\"\"; S.firstId=SPEC.dist?\"dA\":\"askIn\";\n  lockScale();\n  render();\n}\n/* back from the turn-in page mid-problem: pick up where it left off */\nfunction resume(){ if(S.p) setPhase(S.phase); }\n/* if the window changes size, work the one size out again for the problem in hand */\nShell.onResize=function(){\n  if(Shell.activeEng!==KEY || !S.p) return;\n  lockScale(); Shell.applyScale();\n};\n\n/* ============ input handling ============ */\nfunction attach(){\n  const nb=document.getElementById(\"nextBtn\"); if(nb) nb.onclick=nextProblem;\n  const ai=document.getElementById(\"askIn\");\n  if(ai){\n    ai.oninput=function(){ showSign(ai); S.moveIn=ai.value; ai.classList.remove(\"bad\"); autoMove(ai); };\n    ai.onkeydown=function(e){ if(e.key===\"Enter\"){ e.preventDefault(); submitMove(); } };\n  }\n\n  bind(\"cA\",onConst); bind(\"cB\",onConst);\n  bind(\"kA\",onCoef);  bind(\"kB\",onCoef);\n  bind(\"nA\",onRecN);  bind(\"nB\",onRecN);\n  bind(\"dA\",onRecD);  bind(\"dB\",onRecD);\n  bind(\"sd\",onSimpDen); bind(\"sn\",onSimpNum);\n  bind(\"mv\",onMid);   bind(\"ans\",onAns);\n  [\"dA\",\"dB\"].forEach(function(id){\n    const el=document.getElementById(id); if(!el) return;\n    el.oninput=function(){ S[id]=el.value; el.classList.remove(\"bad\"); onDist(id); };\n    el.onkeydown=function(e){ if(e.key!==\"Enter\") return; e.preventDefault();\n      const r=distOK(), ok=id===\"dA\"?r.a:r.b;\n      if(ok){ const o=document.getElementById(id===\"dA\"?\"dB\":\"dA\"); if(o && !(id===\"dA\"?r.b:r.a)) o.focus(); return; }\n      el.classList.add(\"bad\"); flagMiss('\u003cstrong>Not quite.\u003c/strong> '+SPEC.dist.hint); };\n  });\n}\nfunction distOK(){\n  const a=parseInt2(S.dA);\n  const tb=String(S.dB||\"\").trim().replace(/[\\u2212\\u2013\\u2014]/g,\"-\").replace(/\\s+/g,\"\");\n  const m=tb.match(new RegExp(\"^([+-]?)(\\\\d*)\"+S.p.V+\"$\",\"i\"));\n  const bv=m?((m[1]===\"-\"?-1:1)*(m[2]===\"\"?1:+m[2])):null;\n  return {a:near(a,SPEC.dist.A), b:bv!==null&&bv===SPEC.dist.B};\n}\nfunction onDist(id){\n  const r=distOK(), A=document.getElementById(\"dA\"), B=document.getElementById(\"dB\");\n  if(A) A.className=\"box wide\"+(r.a?\" ok\":\"\"); if(B) B.className=\"box wide\"+(r.b?\" ok\":\"\");\n  if(id===\"dA\" && r.a && !r.b && B) B.focus();\n  clearTimers();\n  if(r.a&&r.b) later(320,function(){ S.hint=false; setPhase(\"ask1\"); });\n}\nfunction bind(id,handler){\n  const el=document.getElementById(id);\n  if(!el) return;\n  el.oninput=handler;\n  el.onkeydown=function(e){ if(e.key===\"Enter\"){ e.preventDefault(); flagMiss(missMessage()); } };\n}\nfunction mirror(ids,val){\n  ids.forEach(function(id){\n    const b=document.getElementById(id);\n    if(b && b.value!==val) b.v
