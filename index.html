alue=val;\n  });\n}\n\n/* ---- the opposite move for each step ---- */\nfunction wantOp(step){\n  const p=S.p;\n  if(step===cs()) return p.k>0 ? \"sub\" : \"add\";\n  return p.kind===\"mul\" ? \"divide\" : \"multiply\";\n}\nfunction wrongOpMsg(step,pressed){\n  const p=S.p, V=p.V;\n  if(step===cs()){\n    if(pressed===\"add\"||pressed===\"sub\")\n      return \"That moves the wrong way \\u2014 it makes that side bigger instead of clearing the \"\n        + (p.k\u003c0?\"subtraction\":\"addition\")+\".\";\n    return \"Nothing is multiplying or dividing that \"+Math.abs(p.k)+\" \\u2014 it is being \"\n      + (p.k\u003c0?\"subtracted\":\"added\")+\", so undo it the same way.\";\n  }\n  if(pressed===\"add\"||pressed===\"sub\"){\n    if(p.wrapped) return \"Careful \\u2014 the whole side is over \"+p.a+\", so nothing is loose yet. \"\n      + \"Undo the division first.\";\n    return \"Nothing is being added here \\u2014 \"+V+\" is \"\n      + (p.kind===\"mul\"  ? \"multiplied by \"+dash(fN(p.a))\n       : p.kind===\"frac\" ? \"multiplied by a fraction\"\n                         : \"divided by \"+dash(fN(p.a)))\n      + \", so adding or subtracting won't free it.\";\n  }\n  return p.kind===\"mul\"\n    ? \"That side is already a multiplication \\u2014 multiplying again won't free \"+V+\".\"\n    : (p.kind===\"frac\"\n       ? \"Dividing by a fraction is the hard way \\u2014 flipping it over and multiplying does the \"\n         + \"same job. Multiply by its reciprocal instead.\"\n       : V+\" is already being divided \\u2014 dividing again won't free it.\");\n}\n/* ---- reading what they typed ----\n   A move word or sign, then (optionally) a number:\n     subtract 6 \u00b7 minus 6 \u00b7 \u22126 \u00b7 add 4 \u00b7 +4 \u00b7 divide by \u22123 \u00b7 \u00f73 \u00b7 /3\n     multiply by 5 \u00b7 times 5 \u00b7 x5 \u00b7 \u00d7(3/2) \u00b7 multiply by the reciprocal\n     or the one-letter shortcuts:  a 4 \u00b7 s 6 \u00b7 m 5 \u00b7 d 3\n   Returns {op, num:{n,d}|null}, or {bad:true} when it can't be read. */\nfunction parseMove(raw){\n  let s=String(raw||\"\").toLowerCase()\n    .replace(/[\\u2212\\u2013\\u2014]/g,\"-\").replace(/[\\u00d7\\u22c5\\u00b7]/g,\"*\").replace(/\\u00f7/g,\"/\")\n    .replace(/\\bnegative\\s*/g,\"-\").trim();\n  const WORDS=[[\"add\",/\\b(add|plus)/],[\"sub\",/\\b(sub|minus|take ?away)/],\n               [\"multiply\",/\\b(mult|times)/],[\"divide\",/\\bdiv/]];\n  let op=null;\n  /* shortcuts: a 4, s6, m 5, d -3 (a single letter, not the start of a word) */\n  const sc=s.match(/^([asmd])(?![a-z])(.*)$/);\n  if(sc){ op={a:\"add\",s:\"sub\",m:\"multiply\",d:\"divide\"}[sc[1]]; s=sc[2]; }\n  else {\n    for(let i=0;i\u003cWORDS.length;i++){\n      if(WORDS[i][1].test(s)){ if(op) return {bad:true}; op=WORDS[i][0]; }\n    }\n    if(op) s=s.replace(/[a-z]+/g,\" \");    /* \"by\", \"both sides\", \"the reciprocal\"... */\n  }\n  s=s.replace(/\\s+/g,\"\");\n  if(!op){\n    const m=s.match(/^([*x/+-])(.*)$/);\n    if(m){\n      op = m[1]===\"/\" ? \"divide\" : m[1]===\"+\" ? \"add\" : m[1]===\"-\" ? \"sub\" : \"multiply\";\n      s=m[2];\n    }\n  }\n  s=s.replace(/[()]/g,\"\");\n  if(s===\"\") return op ? {op:op, num:null} : {bad:true};\n  const f=s.match(/^([+-]?)(\\d+(?:\\.\\d+)?)(?:\\/([+-]?)(\\d+))?$/);\n  if(!f) return {bad:true};\n  let n=(f[1]===\"-\"?-1:1)*(+f[2]), d=f[4]?+f[4]:1;\n  if(f[3]===\"-\") n=-n;\n  if(d===0) return {bad:true};\n  return {op:op, num:{n:n, d:d}};\n}\n/* is it the right move, and if a number came with it, the right number?\n   go: \"op\" means move on and type the number; \"cancel\" means it was all there */\nfunction judgeMove(step,mv){\n  const p=S.p, want=wantOp(step);\n  if(step===cs()){\n    if(mv.op!==\"add\" && mv.op!==\"sub\") return {miss:wrongOpMsg(step,mv.op)};\n    if(!mv.num) return mv.op===want ? {go:\"op\"} : {miss:wrongOpMsg(step,mv.op)};\n    const eff=(mv.op===\"add\"?1:-1)*mv.num.n;       /* what is really added, over d */\n    if(near(eff,-p.k*mv.num.d)) return {go:\"cancel\"};\n    if(near(Math.abs(eff),Math.abs(p.k)*mv.num.d)) return {miss:wrongOpMsg(step,mv.op)};\n    return {miss:\"That won't cancel it out \\u2014 use the same size number that's in the way.\"};\n  }\n  if(mv.op!==want) return {miss:wrongOpMsg(step,mv.op)};\n  if(!mv.num) return {go:\"op\"};\n  const tn = p.kind===\"frac\" ? p.s*p.den : p.a, td = p.kind===\"frac\" ? p.num : 1;\n  if(mv.num.n*td===tn*mv.num.d) return {go:\"cancel\"};\n  return {miss: p.kind===\"frac\" ? \"Not quite \\u2014 flip the fraction over, and keep the sign in mind.\"\n                                : \"Not quite \\u2014 check the number and its sign, then try again.\"};\n}\n/* the first thing typed is the move: a s m d (or + - x * /) shows as + \\u2212 \\u00d7 \\u00f7.\n   Only the first character, so 3/2 and \\u22123 later on are left as typed. */\nconst SIGN={a:\"+\",s:MINUS,m:TIMES,d:DIV,x:TIMES,\"*\":TIMES,\"/\":DIV,\"-\":MINUS};\nfunction showSign(el){\n  let v=el.value.replace(/-/g,MINUS);            /* a negative number gets a real minus too */\n  const i=v.search(/\\S/);\n  if(i>=0 && SIGN[v[i].toLowerCase()]) v=v.slice(0,i)+SIGN[v[i].toLowerCase()]+v.slice(i+1);\n  if(v===el.value) return;\n  const a=el.selectionStart, b=el.selectionEnd;\n  el.value=v;\n  try{ el.setSelectionRange(a,b); }catch(e){}\n}\nfunction askNote(msg){\n  S.miss=msg; renderPrompt(); attach();\n  later(3000,function(){ S.miss=\"\"; renderPrompt(); attach(); });\n}\nfunction submitMove(){\n  const el=document.getElementById(\"askIn\");\n  if(el) S.moveIn=el.value;\n  const step=stepNo(), p=S.p;\n  if(!S.moveIn.trim()){ askNote(\"Type what we do to both sides, like s 6 or d 3.\"); return; }\n  const mv=parseMove(S.moveIn);\n  if(mv.bad){ askNote(\"Type a move and a number: a 4 adds 4, s 6 subtracts 6, m 5 multiplies by 5, d 3 divides by 3.\"); return; }\n  if(!mv.op){ askNote(\"Say what we do with that number: a add, s subtract, m multiply or d divide.\"); return; }\n  const r=judgeMove(step,mv);\n  if(r.miss){\n    S.clean=false;\n    if(el){ el.classList.add(\"bad\"); Shell.shake(el); el.select(); }\n    flagMiss(r.miss);\n    return;\n  }\n  acceptMove(step, r.go===\"cancel\", el);\n}\n/* Typing the move is enough: the right one is written on both sides straight\n   away (\u00d7 puts parentheses round both sides), with a box on each side for the\n   number. A wrong move is pointed out straight away. */\nfunction autoMove(el){\n  if(el.readOnly) return;\n  const mv=parseMove(el.value);\n  if(mv.bad || !mv.op) return;\n  if(!mv.num){ submitMove(); return; }\n  if(judgeMove(stepNo(),mv).go===\"cancel\") acceptMove(stepNo(), true, el);\n}\nfunction acceptMove(step,full,el){\n  const p=S.p;\n  if(step===cs()){\n    S.sign = wantOp(step)===\"sub\" ? -1 : 1;\n    S.opIn = full ? String(Math.abs(p.k)) : \"\";\n  } else {\n    S.coefIn = full ? String(p.a) : \"\";\n    S.recN = full && p.kind===\"frac\" ? String(p.s*p.den) : \"\";\n    S.recD = full && p.kind===\"frac\" ? String(p.num) : \"\";\n    S.simpDen=\"\"; S.simpNum=\"\";\n  }\n  if(el){ el.className=\"box ask-box ok\"; el.readOnly=true; }\n  clearTimers();\n  later(full?350:200,function(){ S.hint=false; setPhase((full?\"cancel\":\"op\")+step); });\n}\n\nfunction paint(ids,ok,base){\n  const cls=base+(ok?\" ok\":\"\");\n  ids.forEach(function(id){ const b=document.getElementById(id); if(b) b.className=cls; });\n}\nfunction onConst(e){\n  S.opIn=e.target.value; mirror([\"cA\",\"cB\"],S.opIn);\n  const v=parseInt2(S.opIn), ok=(v!==null && near(Math.abs(v),Math.abs(S.p.k)));\n  paint([\"cA\",\"cB\"],ok,\"box\");\n  clearTimers();\n  if(ok) later(300,function(){ S.hint=false; setPhase(\"cancel\"+cs()); });\n}\nfunction onCoef(e){\n  S.coefIn=e.target.value; mirror([\"kA\",\"kB\"],S.coefIn);\n  const v=parseInt2(S.coefIn), ok=(v!==null && v===S.p.a);\n  paint([\"kA\",\"kB\"],ok,\"box\");\n  clearTimers();\n  if(ok) later(300,function(){ S.hint=false; setPhase(\"cancel\"+ks()); });\n}\nfunction onRecN(e){\n  S.recN=e.target.value; mirror([\"nA\",\"nB\"],S.recN);\n  paint([\"nA\",\"nB\",\"dA\",\"dB\"],recipOK(),\"box mini\");\n  clearTimers();\n  if(recipOK()){ later(320,function(){ S.hint=false; setPhase(\"cancel\"+ks()); }); return; }\n  const n=parseInt2(S.recN);\n  if(n!==null && Math.abs(n)===S.p.den && parseInt2(S.recD)===null){\n    const d=document.getElementById(e.target.id===\"nA\"?\"dA\":\"dB\");\n    if(d) d.focus();\n  }\n}\nfunction onRecD(e){\n  S.recD=e.target.value; mirror([\"dA\",\"dB\"],S.recD);\n  paint([\"nA\",\"nB\",\"dA\",\"dB\"],recipOK(),\"box mini\");\n  clearTimers();\n  if(recipOK()) later(320,function(){ S.hint=false; setPhase(\"cancel\"+ks()); });\n}\nfunction setCls(el,cls){ if(el && el.className!==cls) el.className=cls; }\nfunction paintSimp(){\n  if(!simplifying()) return;\n  setCls(document.getElementById(\"sd\"),\"box tiny\"+(simpDenOK()?\" ok\":\"\"));\n  setCls(document.getElementById(\"sn\"),\"box tiny\"+(simpNumOK()?\" ok\":\"\"));\n  setCls(document.getElementById(\"slD\"),pendCls(simpDenOK(),true));\n  setCls(document.getElementById(\"slN\"),pendCls(simpNumOK(),true));\n  renderPrompt(); attach();\n}\nfunction onSimpDen(e){\n  S.simpDen=e.target.value;\n  paintSimp(); clearTimers();\n  if(simpOK()){ later(420,function(){ S.hint=false; setPhase(\"compute\"+ks()); }); return; }\n  if(simpDenOK() && parseInt2(S.simpNum)===null){\n    const sn=document.getElementById(\"sn\"); if(sn) sn.focus();\n  }\n}\nfunction onSimpNum(e){\n  S.simpNum=e.target.value;\n  paintSimp(); clearTimers();\n  if(simpOK()) later(420,function(){ S.hint=false; setPhase(\"compute\"+ks()); });\n}\nfunction onMid(e){\n  S.mIn=e.target.value;\n  const v=parseInt2(S.mIn);\n  clearTimers();\n  if(near(v,S.p.M)) later(300,function(){ S.hint=false; S.moveIn=\"\"; setPhase(\"ask2\"); });\n}\nfunction onAns(e){\n  S.ansIn=e.target.value;\n  const v=parseInt2(S.ansIn);\n  clearTimers();\n  if(near(v,S.p.sol)) later(280,finish);\n}\n\ndocument.addEventListener(\"keydown\",function(e){\n  if(Shell.activeEng!==KEY) return;\n  if(e.key===\"Enter\" && S.phase===\"check\") nextProblem();\n});\n\nreturn {start:begin, resume:resume};\n\n})();\n\n/* ============================================================\n   Turning it in\n   ------------------------------------------------------------\n   10 problems get turned in. After the 10th the turn-in page\n   comes up; after that, practice keeps going. The Turn in button\n   opens the same page any time, so a student who runs out of\n   time can send what they have (the newer send counts).\n   ============================================================ */\nconst GOAL = 10;\nconst DRILL_NAME = \"Two-Step Equations\";\nconst byId = function(id){ return document.getElementById(id); };\nconst escHtml = function(t){ return String(t).replace(/[&\u003c>\"]/g,function(c){ return {\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); };\n\nconst TI = {\n  records:[], served:0, currentDone:false, autoShown:false, submitted:false, submittedAt:0,\n\n  isOpen:function(){ return !byId(\"turnin\").classList.contains(\"off\"); },\n  clean:function(){ return TI.records.filter(function(r){ return r.clean; }).length; },\n  record:function(clean,info){\n    if(TI.currentDone) return;\n    TI.currentDone = true;\n    info = info || {q:\"\",a:\"\"};\n    TI.records.push({q:info.q, a:info.a, clean:!!clean});\n  },\n  /* after the 10th, the Next button becomes the way to the turn-in page */\n  nextLabel:function(){\n    return (TI.records.length >= GOAL && !TI.autoShown) ? \"Turn in my work &rarr;\" : \"Next problem &rarr;\";\n  },\n  wantsTurnIn:function(){\n    if(TI.records.length >= GOAL && !TI.autoShown){ TI.autoShown = true; return true; }\n    return false;\n  },\n  newProblem:function(){\n    TI.served++;\n    TI.currentDone = false;\n    byId(\"problem-title\").textContent = TI.served \u003c= GOAL\n      ? \"Problem \" + TI.served + \" of \" + GOAL\n      : \"Problem \" + TI.served + \" \\u00b7 extra practice\";\n  },\n\n  show:function(){\n    const done = TI.records.length, clean = TI.clean();\n    if(done >= GOAL){\n      byId(\"ti-title\").textContent = done > GOAL ? done + \" problems done\" : \"All \" + GOAL + \" done\";\n      byId(\"ti-after-lab\").textContent = \"Want more practice?\";\n      byId(\"ti-back\").textContent = \"Keep practicing\";\n    } else {\n      byId(\"ti-title\").textContent = \"Turn in your work so far\";\n      byId(\"ti-after-lab\").textContent = \"Not done yet?\";\n      byId(\"ti-back\").textContent = \"Go back and keep working\";\n    }\n    byId(\"ti-recap\").innerHTML =\n        \"\u003cdiv>Problems\u003cb>\" + done + \"\u003c/b>\u003c/div>\"\n      + \"\u003cdiv>Right the first time\u003cb>\" + clean + \"\u003c/b>\u003c/div>\"\n      + \"\u003cdiv>Needed a retry\u003cb>\" + (done - clean) + \"\u003c/b>\u003c/div>\";\n    byId(\"ti-log\").innerHTML = done\n      ? '\u003cdiv class=\"ti-log\">' + TI.records.map(function(r,i){\n          return '\u003cdiv class=\"ti-row\">\u003cspan class=\"ti-n\">' + (i+1) + '.\u003c/span>'\n            + '\u003cspan class=\"ti-q\">' + escHtml(r.q) + '\u003cspan class=\"ti-arrow\">&rarr;\u003c/span>' + escHtml(r.a) + '\u003c/span>'\n            + '\u003cspan class=\"ti-k' + (r.clean ? '' : ' retry') + '\">' + (r.clean ? 'first try' : 'retry') + '\u003c/span>\u003c/div>';\n        }).join(\"\") + '\u003c/div>'\n      : '\u003cdiv class=\"ti-empty\">Nothing finished yet \\u2014 finished problems show up here.\u003c/div>';\n\n    const more = TI.submitted && done > TI.submittedAt;\n    byId(\"gform\").classList.toggle(\"off\", TI.submitted && !more);\n    if(more){\n      byId(\"ti-feedback\").innerHTML = '\u003cspan class=\"note\">You turned in ' + TI.submittedAt + ' \\u2014 you have ' + done + ' now. '\n        + 'Send it again and the newer one counts.\u003c/span>';\n      byId(\"ti-submit\").textContent = \"Send updated results\";\n    } else if(!TI.submitted){\n      byId(\"ti-feedback\").innerHTML = \"\";\n      byId(\"ti-submit\").textContent = \"Submit Results\";\n    }\n    byId(\"formScore\").value = done;\n\n    Shell.clearTimers();\n    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();\n    byId(\"turnin\").classList.remove(\"off\");\n    byId(\"turnin\").scrollTop = 0;\n    if(!TI.submitted || more) setTimeout(function(){ byId(TI.submitted ? \"ti-submit\" : \"studentPeriod\").focus(); }, 50);\n  },\n\n  /* back to the drill: a finished problem moves on, a half-done one is left right where it was */\n  back:function(){\n    byId(\"turnin\").classList.add(\"off\");\n    if(TI.currentDone && (TI.records.length !== GOAL || TI.autoShown)){\n      if(TI.records.length >= GOAL) TI.autoShown = true;\n      Shell.next();\n    } else {\n      const eng = Shell.engines[Shell.activeEng];\n      if(eng && eng.resume) eng.resume();\n      const el = document.querySelector(\"#eq input, #panel input, #nextBtn\");\n      if(el) el.focus();\n    }\n  }\n};\n\nfunction onHiddenFrameLoad(){\n  if(!TI.submitted) return;\n  byId(\"ti-feedback\").innerHTML = '\u003cspan class=\"ok\">Successfully submitted. '\n    + (TI.records.length >= GOAL\n        ? 'You can close this page, or keep practicing.'\n        : 'You can close this page, or go back and keep working.')\n    + '\u003c/span>';\n  byId(\"gform\").classList.add(\"off\");\n}\n\nfunction nameCheck(){\n  const ln = byId(\"lastName\").value.trim(), fn = byId(\"firstName\").value.trim();\n  const row = function(t,v){ return '\u003cdiv class=\"row\">\u003cspan class=\"t\">' + t + '\u003c/span>'\n    + '\u003cspan class=\"v' + (v ? '' : ' empty') + '\">' + (v ? escHtml(v) : '\\u2014') + '\u003c/span>\u003c/div>'; };\n  byId(\"nameCheck\").innerHTML =\n      '\u003cdiv class=\"head\">This is what will be sent \\u2014 check it is the right way round:\u003c/div>'\n    + row(\"Last name\", ln) + row(\"First name\", fn) + row(\"Roll call\", ln && fn ? ln + \", \" + fn : \"\");\n}\n[\"lastName\",\"firstName\"].forEach(function(id){ byId(id).addEventListener(\"input\", nameCheck); });\nnameCheck();\n\nbyId(\"gform\").addEventListener(\"submit\", function(){\n  const ln = byId(\"lastName\").value.trim(), fn = byId(\"firstName\").value.trim();\n  byId(\"studentName\").value =\n      \"Period \" + byId(\"studentPeriod\").value.trim() + \" \\u2014 \" + ln + \" \\u2014 \" + fn\n    + \" \\u2014 \" + TI.clean() + \" clean solves \\u2014 \" + DRILL_NAME + \" (\" + TI.records.length + \" problems)\";\n  byId(\"formScore\").value = TI.records.length;\n  TI.submitted = true;\n  TI.submittedAt = TI.records.length;\n});\nbyId(\"ti-back\").addEventListener(\"click\", TI.back);\nbyId(\"turnin-link\").addEventListener(\"click\", TI.show);\n\nShell.next();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "ineq": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>One- and Two-Step Inequalities\u003c/title>\n\u003cstyle>\n  :root{\n    --ink:#0f172a; --line:#1e293b; --muted:#64748b; --faint:#94a3b8;\n    --blue:#1d4ed8; --blue-b:#3b82f6; --blue-bg:#eff6ff;\n    --green:#059669; --green-bg:#ecfdf5;\n    --rose:#e11d48; --rose-bg:#fff1f2;\n    --page:#ffffff; --edge:#e2e8f0;\n    --card:#ffffff; --tabbg:#f1f5f9; --text2:#334155; --text3:#475569; --on-ink:#ffffff;\n    --yellow:#b45309; --yellow-bg:#fffbeb;\n  }\n  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--page);}\n  *{box-sizing:border-box;}\n  html,body{height:100%;margin:0;}\n  body{\n    background:var(--page); color:var(--ink);\n    font-family:Verdana,Geneva,Tahoma,sans-serif;\n    -webkit-font-smoothing:antialiased;\n  }\n  .app{height:100%;display:flex;flex-direction:column;overflow:hidden;padding:16px 16px 20px;}\n  .wrap{width:100%;max-width:60rem;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0;}\n\n  /* nav tabs */\n  .nav-tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:2px solid var(--edge);padding-bottom:2px;}\n  .tab-btn{\n    background:none; border:none; padding:8px 14px; font-size:.9rem; font-weight:600;\n    color:var(--muted); cursor:pointer; border-radius:6px 6px 0 0; transition:all .15s ease;\n  }\n  .tab-btn:hover{color:var(--ink); background:var(--edge);}\n  .tab-btn.active{color:var(--blue); border-bottom:3px solid var(--blue); background:var(--card);}\n\n  /* header */\n  .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;flex-shrink:0;}\n  h1{font-size:1.3rem;font-weight:700;text-transform:uppercase;letter-spacing:.18em;margin:0;}\n  .levels{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}\n  .score{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}\n  .score b{color:var(--green);}\n  /* how many of each kind have been solved; the current kind is highlighted */\n  .tally{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:.72rem;\n         color:var(--faint);font-variant-numeric:tabular-nums;}\n  .tally span{white-space:nowrap;}\n  .tally b{color:var(--muted);font-weight:600;}\n  .tally .on,.tally .on b{color:var(--blue);}\n\n  /* work area */\n  .ghost{position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none;\n         width:max-content;}\n  .work{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;\n        justify-content:safe center;padding:6px 0;overflow:hidden;}\n  /* the equation and the panel under it scale together as one block, so the\n     size is set once per problem and nothing shifts underfoot mid-solve */\n  .stagebox{display:flex;justify-content:center;align-items:flex-start;flex-shrink:0;}\n  .stage{display:flex;flex-direction:column;align-items:center;gap:14px;transform-origin:top center;}\n  .scroller{display:flex;justify-content:center;}\n  .scroller > .eq{flex:0 0 auto;}\n  .eq{display:grid;column-gap:30px;row-gap:10px;width:max-content;margin:0 auto;\n      transform-origin:top center;\n      font-family:Verdana,Geneva,Tahoma,sans-serif;font-size:3rem;font-weight:700;}\n  /* two-step needs both shapes at once: four columns for the line that still\n     carries a constant, and room for a fraction bar on the line below it */\n  .eq.k-two{grid-template-columns:auto auto auto auto;row-gap:10px;font-size:2.9rem;column-gap:30px;}\n  .eq.k-two .cell{gap:10px;min-height:3rem;}\n  .cell.span2{grid-column:span 2;}\n  .eq.k-two .dfrac{font-size:1em;}\n  .eq.k-two .dfrac > .t,.eq.k-two .dfrac > .b{padding:0 8px;gap:.28em;}\n  .eq.k-two .dfrac > .bar{min-width:3.2rem;border-top-color:var(--line);}\n  .eq.k-two .mgroup{gap:6px;}\n  .eq.k-two .mgroup.tall .paren{font-size:2.2em;}\n  /* room above and below for the cancelled numbers, without wasting a whole line */\n  .eq.k-two .mgroup.roomy{padding:1.3rem 0;}\n  .cell{min-height:3.6rem;padding:2px 0;display:flex;align-items:center;justify-content:center;gap:6px;\n        transition:opacity .7s ease-out;}\n  .rule{grid-column:1 / -1;height:2px;margin:5px 0;border-top:2px solid var(--line);}\n  /* same row break as .rule, but with no line drawn: nothing is being summed */\n  .spacer{grid-column:1 / -1;height:0;margin:9px 0;}\n  .hide{visibility:hidden;}\n  .eqsign{color:var(--faint);}\n  .blue{color:var(--blue);}\n  .green{color:var(--green);}\n  .grey{color:var(--muted);}\n  .faint{color:var(--faint);}\n  .cancelling{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6;}\n  .struck{text-decoration:line-through;text-decoration-thickness:2px;opacity:.25;}\n\n  /* small inline fractions, used while adding and subtracting */\n  .stack{display:inline-flex;flex-direction:column;align-items:center;margin:0 3px;\n         font-size:.66em;line-height:1.18;vertical-align:-.44em;}\n  .stack .t,.stack .b{padding:0 5px;}\n  .stack .bar{width:100%;border-top:2px solid currentColor;margin:.14em 0;}\n  .num{display:inline-flex;align-items:center;vertical-align:middle;}\n  .num .whole{margin-left:2px;}\n  /* a mixed number: whole part beside a smaller stacked fraction */\n  .mixnum{display:inline-flex;align-items:center;vertical-align:middle;}\n  .mixnum .whole{line-height:1;}\n  .mixnum .dfrac{font-size:.6em;margin-left:4px;}\n  .sgn{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;}\n\n  /* full-size fractions, used when multiplying and dividing */\n  .dfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;\n         line-height:1.15;margin:0 1px;font-size:.86em;}\n  .dfrac > .t,.dfrac > .b{padding:0 7px;display:flex;align-items:center;justify-content:center;}\n  .dfrac > .bar{width:100%;min-width:1.4rem;border-top:2px solid currentColor;margin:4px 0;}\n  .dfrac.grow{animation:grow .35s ease-out;}\n\n  /* the reciprocal the student writes: two boxes stacked over a bar */\n  .fracbox{display:inline-flex;flex-direction:column;align-items:center;gap:4px;vertical-align:middle;}\n  .fracbox > .bar{width:112%;border-top:2px solid var(--line);}\n\n  /* diagonal cancel stroke, drawn corner to corner so it fits whatever it crosses */\n  .slash{position:relative;display:inline-flex;align-items:center;justify-content:center;\n         padding:0 .18em;background-repeat:no-repeat;background-position:center;background-size:100% 100%;\n         background-image:linear-gradient(to bottom right,\n           transparent calc(50% - 1.8px), var(--sl) calc(50% - 1.8px),\n           var(--sl) calc(50% + 1.8px), transparent calc(50% + 1.8px));}\n  .slash.draw{--sl:var(--text3);color:var(--faint);animation:draw .5s ease-out both;}\n  .slash.dim{--sl:var(--faint);color:var(--edge);}\n  .slash.cross{--sl:var(--muted);color:var(--faint);}\n  /* a number waiting to be simplified: same box as .slash, but no stroke yet */\n  .pend{display:inline-flex;align-items:center;justify-content:center;padding:0 .18em;}\n\n  /* cross-simplifying: the reduced number is written above or below the crossed-out one\n     without shifting it, so the originals keep their place on the line */\n  .cx{position:relative;display:inline-flex;align-items:center;justify-content:center;}\n  .cx .redu{position:absolute;left:50%;transform:translateX(-50%);\n            display:flex;align-items:center;justify-content:center;\n            color:var(--blue);font-size:.66em;line-height:1;}\n  .cx.above .redu{bottom:100%;margin-bottom:3px;}\n  .cx.below .redu{top:100%;margin-top:3px;}\n\n  /* parenthesised group: multiplying both sides */\n  .mgroup{display:inline-flex;align-items:center;gap:9px;}\n  .mgroup.roomy{padding:1.9rem 0;}\n  .paren{font-size:1.35em;line-height:1;color:var(--line);}\n  .mgroup.tall .paren{font-size:2.6em;font-weight:300;}\n  .mgroup.fade{animation:grow .35s ease-out;}\n  @keyframes grow{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}\n  @keyframes draw{from{background-size:0% 100%;}to{background-size:100% 100%;}}\n\n  /* inputs */\n  .box{height:3.6rem;width:5rem;font-weight:700;border:2px solid var(--blue-b);background:var(--blue-bg);color:var(--blue);\n       border-radius:6px;text-align:center;font-family:Verdana,Geneva,Tahoma,sans-serif;font-size:2.2rem;\n       outline:none;transition:border-color .15s,background .15s;}\n  .box.wide{width:6rem;}\n  .box.small{font-size:1.25rem;}\n  .box.mini{height:2.6rem;width:3.9rem;font-size:1.5rem;}\n  .mirr{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;opacity:.85;box-sizing:border-box;}\n  .box.tiny{height:2.2rem;width:3rem;font-size:1.3rem;border-radius:5px;}\n  .box:focus{border-color:var(--blue);background:var(--card);}\n  .box.bad{border-color:#fb7185;background:var(--rose-bg);color:var(--rose);}\n  .box.ok{border-color:#10b981;background:var(--green-bg);color:var(--green);}\n  .preview{color:var(--faint);}\n\n  /* fraction-shaped input: box above the denominator */\n  .fracin{display:inline-flex;flex-direction:column;align-items:center;gap:4px;}\n  .fracin .bar2{width:4rem;border-top:2px solid var(--line);}\n  .fracin .den{color:var(--text3);line-height:1;font-family:Verdana,Geneva,Tahoma,sans-serif;}\n\n  /* operation buttons */\n  .ops{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;}\n  .op{width:6rem;height:5rem;font-weight:700;border:2px solid var(--edge);background:var(--card);color:var(--line);\n      border-radius:12px;cursor:pointer;font-family:Verdana,Geneva,Tahoma,sans-serif;font-size:2.1rem;\n      line-height:1;display:flex;align-items:center;justify-content:center;\n      transition:border-color .15s,background .15s,transform .1s;}\n  .op:hover{border-color:var(--blue-b);background:var(--blue-bg);color:var(--blue);}\n  .op:active{transform:translateY(1px);}\n  .op:focus-visible{outline:3px solid var(--blue-b);outline-offset:2px;}\n  .op.shake{animation:shake .32s;border-color:#fb7185;background:var(--rose-bg);color:var(--rose);}\n  @keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}\n\n  /* the keyboard guide. Nothing in it is clicked: students type the key shown.\n     On a wide screen it sits in its own column on the right; on a narrow one it\n     drops under the problem. */\n  .keyguide{display:flex;flex-direction:column;gap:12px;font-family:Verdana,Geneva,Tahoma,sans-serif;}\n  .keyguide:empty{display:none;}\n  .kg-lead{font-size:1.05rem;font-weight:700;color:var(--muted);}\n  .kg-list{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;}\n  .gitem{display:flex;flex-direction:column;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;}\n  .gitem .caps{display:flex;align-items:center;gap:6px;}\n  .gitem kbd{min-width:2.6rem;height:2.6rem;padding:0 .5rem;display:inline-flex;align-items:center;justify-content:center;\n      font:700 1.35rem Verdana,Geneva,Tahoma,sans-serif;color:var(--line);background:var(--card);\n      border:2px solid var(--edge);border-bottom-width:5px;border-radius:9px;}\n  .gitem .what{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:700;color:var(--text3);}\n  .gitem .sym{display:inline-flex;align-items:center;justify-content:center;min-width:1.8rem;\n      font-size:1.7rem;line-height:1;color:var(--line);}\n  .gitem.shake{animation:shake .32s;background:var(--rose-bg);}\n  .gitem.shake kbd{border-color:#fb7185;color:var(--rose);}\n  .gitem.shake .what,.gitem.shake .sym{color:var(--rose);}\n  /* the side column holds the word problem and the key guide. On a narrow\n     screen it dissolves and the two fall back under the problem. */\n  .side{display:contents;}\n  @media (min-width:900px){\n    .work{padding-right:19rem !important;}\n    .work .toast{left:calc((100% - 19rem) / 2);max-width:calc(100% - 19rem - 24px);}\n    .side{position:absolute;right:0;top:28px;width:17rem;max-height:calc(100% - 40px);overflow-y:auto;\n          display:flex;flex-direction:column;gap:22px;padding:6px 0 6px 20px;border-left:2px solid var(--edge);}\n    .side .story{order:0;margin:0;max-width:none;text-align:left;font-size:1.15rem;line-height:1.6;}\n    .side .story .letv{margin-top:10px;white-space:normal;}\n    .side .story:not(:empty) + .keyguide:not(:empty){padding-top:22px;border-top:2px solid var(--edge);}\n    .kg-list{display:grid;grid-template-columns:auto 1fr;gap:4px 0;}\n    .gitem{display:grid;grid-template-columns:subgrid;grid-column:1 / -1;align-items:center;column-gap:14px;}\n  }\n  @media (max-width:899px){\n    .keyguide{order:1;align-items:center;margin-top:16px;}\n  }\n\n  .panel{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;\n         font-family:Verdana,Geneva,Tahoma,sans-serif;font-size:1.35rem;}\n  .panel .lbl{font-size:.85rem;color:var(--muted);\n              font-family:Verdana,Geneva,Tahoma,sans-serif;}\n  .checkline{width:100%;text-align:center;font-family:Verdana,Geneva,Tahoma,sans-serif;font-size:1.8rem;font-weight:700;line-height:2.1;}\n  .checkline .orig{color:var(--faint);}\n  .checkline .sub{margin-top:12px;}\n\n  /* prompt bar */\n  /* fixed height on purpose: a hint or a nudge appearing must not change how\n     much room the equation has, or the writing would resize mid-problem */\n  .promptbar{flex-shrink:0;border-top:1px solid var(--edge);padding-top:12px;padding-bottom:4px;\n             height:7rem;overflow-y:auto;}\n  .prompt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;color:var(--text2);font-size:.98rem;}\n  .prompt .math{font-family:Verdana,Geneva,Tahoma,sans-serif;}\n  .prompt strong{font-weight:600;}\n  .link{background:none;border:none;padding:0;color:var(--muted);font-size:.85rem;font-family:inherit;\n        text-decoration:underline;text-underline-offset:4px;cursor:pointer;}\n  .link:hover{color:var(--ink);}\n  .hintline{width:100%;font-size:.85rem;color:var(--text3);display:flex;flex-wrap:wrap;align-items:center;gap:5px;}\n  .missline{margin-top:4px;font-size:.85rem;color:var(--rose);}\n  .noteline{margin-top:4px;font-size:.85rem;color:var(--muted);}\n  .next{background:var(--ink);color:var(--on-ink);border:none;border-radius:10px;padding:14px 28px;\n        font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}\n  .next:hover{opacity:.88;}\n  .skip{margin-top:4px;font-size:.72rem;color:var(--faint);}\n  .row-between{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;width:100%;}\n\n  /* the inequality sign: darker than = was, because it carries meaning */\n  .rel{color:var(--line);font-weight:600;}\n  .rel.flipped{color:var(--yellow);}\n  .relq{display:inline-flex;align-items:center;justify-content:center;width:2.6rem;height:2.6rem;\n        border:2px dashed var(--yellow);border-radius:8px;color:var(--yellow);background:var(--yellow-bg);\n        font-size:.9em;animation:pulse 1.4s ease-in-out infinite;}\n  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}\n  .op.choice{flex-direction:column;gap:4px;width:8rem;height:6.4rem;}\n  .op.choice small{font-weight:700 !important;font-family:Verdana,Geneva,Tahoma,sans-serif;\n        font-size:.72rem;color:var(--muted);font-weight:500;}\n  .op.choice:hover small{color:var(--blue);}\n  .op.choice svg{display:block;}\n  .nlwrap{display:flex;justify-content:center;}\n  .numline{display:block;overflow:visible;}\n  .nl-axis{stroke:var(--faint);stroke-width:2;fill:none;}\n  .nl-head{fill:var(--faint);}\n  .nl-tick{stroke:var(--faint);stroke-width:1.5;}\n  .nl-lbl{fill:var(--line);font:700 17px Verdana,Geneva,Tahoma,sans-serif;text-anchor:middle;}\n  .nl-lbl.key{fill:var(--ink);font-weight:700;}\n  .nl-ray{stroke:var(--blue);stroke-width:6;stroke-linecap:round;fill:none;}\n  .nl-rayhead{fill:var(--blue);}\n  .nl-dot{stroke:var(--blue);stroke-width:3;}\n  .nl-dot.closed{fill:var(--blue);}\n  .nl-dot.open{fill:var(--card);}\n  .nl-ghost{stroke:var(--yellow);stroke-width:2;stroke-dasharray:4 3;fill:var(--yellow-bg);\n            animation:pulse 1.4s ease-in-out infinite;}\n  .nl-test{fill:var(--green);}\n  .nl-testlbl{fill:var(--green);font:700 15px Verdana,Geneva,Tahoma,sans-serif;text-anchor:middle;}\n  .ic{stroke:currentColor;fill:none;stroke-width:2.5;}\n  .ic.fill{fill:currentColor;}\n  .checkline .truth{font-family:Verdana,Geneva,Tahoma,sans-serif;\n        font-size:.75em;color:var(--green);font-weight:600;margin-left:6px;}\n\n  /* ---- word problem ---- */\n  /* the word problem: in the side column on a wide screen, underneath on a narrow one */\n  .story{order:2;max-width:44rem;margin:auto auto 6px;text-align:center;font-size:1.3rem;font-weight:700;\n         line-height:1.55;color:var(--text2);flex-shrink:0;}\n  .story .letv{display:block;margin-top:8px;}\n  .story:empty{display:none;}\n  .work{position:relative;justify-content:flex-start !important;padding-top:28px !important;}\n  .story .letv{color:var(--blue);white-space:nowrap;}\n\n  /* ---- hint after a wrong answer: floats over the bottom so nothing resizes ---- */\n  .toast{position:absolute;left:50%;top:var(--toasttop,auto);bottom:auto;transform:translateX(-50%);\n         width:max-content;max-width:min(44rem,92vw);background:var(--yellow-bg);color:var(--ink);\n         border:2px solid #f6c768;border-radius:12px;box-shadow:0 6px 20px rgba(15,23,42,.14);\n         padding:14px 20px;font-size:1.1rem;font-weight:700;line-height:1.5;z-index:20;}\n  .toast[hidden]{display:none;}\n  .toast .dfrac,.toast .stack{font-size:.9em;}\n  .box.bad{animation:shake .32s;}\n\n  /* ---- turn in ---- */\n  .top{align-items:center;}\n  .turn-in{font-family:inherit;font-size:1rem;font-weight:700;color:var(--text2);background:var(--card);\n           border:2px solid #cbd5e0;border-radius:10px;padding:9px 18px;cursor:pointer;white-space:nowrap;}\n  .turn-in:hover{border-color:#a0aec0;color:#1a365d;}\n  body.oncard .work{display:none;}\n  body.oncard .toast{display:none;}\n  .submit-card{display:none;flex:1;min-height:0;overflow:auto;width:100%;max-width:640px;margin:0 auto;\n               padding:clamp(16px,3vh,36px) clamp(4px,2vw,20px) 34px;}\n  body.oncard .submit-card{display:block;}\n  .submit-card h2{font-size:1.5rem;color:#1a365d;font-weight:700;margin:0 0 5px;}\n  .sub-note{font-size:.92rem;color:#718096;margin:0 0 20px;line-height:1.6;font-weight:700;}\n  .recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;}\n  .recap > div{border:2px solid #e2e8f0;border-radius:12px;padding:10px 12px;background:#fff;\n               font-size:.7rem;color:#90a4bd;font-weight:700;}\n  .recap .bar{display:block;height:14px;margin-top:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;}\n  .recap .fill{display:block;height:100%;background:#38a169;border-radius:999px;}\n  .log{max-height:260px;overflow:auto;margin-top:17px;border-top:2px solid #e2e8f0;border-bottom:2px solid #e2e8f0;padding:9px 0;}\n  .logrow{display:flex;gap:11px;align-items:baseline;font-size:.95rem;padding:4px 2px;line-height:1.5;}\n  .logn{color:#a0aec0;min-width:26px;text-align:right;font-size:.8rem;}\n  .logq{flex:1;font-weight:700;}\n  .logh{font-size:.7rem;color:#b6c2d1;white-space:nowrap;font-weight:700;}\n  .logempty{font-size:.85rem;color:#a0aec0;margin-top:15px;font-weight:700;}\n  #gform{margin-top:6px;}\n  .name-warning{font-size:.82rem;line-height:1.65;color:#5a6474;background:#fffbea;border-radius:8px;\n                padding:11px 13px;margin-bottom:19px;font-weight:700;}\n  .name-warning b{color:#1a202c;}\n  .field{margin-bottom:15px;}\n  .field label{font-size:.82rem;color:#5a6474;display:block;margin-bottom:6px;font-weight:700;}\n  .field label .step-num{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;\n        margin-right:8px;border-radius:50%;background:#1a365d;color:#fff;font-size:.68rem;}\n  .field label .big{font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;color:#1a202c;}\n  .field label em{color:#a0aec0;font-style:normal;font-size:.76rem;}\n  .field input{font-family:inherit;font-size:1.05rem;font-weight:700;color:#1a202c;width:100%;background:#fff;\n        border:2px solid #cbd5e0;border-radius:8px;padding:9px 11px;}\n  .field input:focus{border-color:#3182ce;outline:none;}\n  .name-check{border:2px solid #e2e8f0;border-radius:9px;padding:11px 13px;margin:4px 0 15px;background:#f7fafc;}\n  .name-check .checkhead{font-size:.78rem;color:#718096;margin-bottom:9px;line-height:1.6;font-weight:700;}\n  .name-check .row{display:flex;gap:11px;align-items:baseline;margin-bottom:5px;}\n  .name-check .row:last-child{margin-bottom:0;padding-top:6px;border-top:2px solid #e2e8f0;}\n  .name-check .tag{min-width:78px;font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:#90a4bd;font-weight:700;}\n  .name-check .val{font-size:1rem;color:#1a202c;font-weight:700;}\n  .name-check .val.empty{color:#cbd5e0;}\n  .submit-btn{font-family:inherit;font-size:1.05rem;font-weight:700;color:#fff;background:#38a169;border:none;\n        border-radius:10px;padding:12px 26px;cursor:pointer;}\n  .submit-btn:hover{background:#2f855a;}\n  #formFeedback{font-size:.9rem;margin-top:14px;font-weight:700;}\n  .after-submit{margin-top:22px;padding-top:17px;border-top:2px solid #e2e8f0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}\n  .after-submit .lab{font-size:.76rem;color:#90a4bd;margin-right:3px;font-weight:700;}\n  .ghost-btn{font-family:inherit;font-size:.95rem;font-weight:700;color:#1a365d;background:none;\n        border:2px solid #cbd5e0;border-radius:9px;padding:8px 15px;cursor:pointer;}\n  .ghost-btn:hover{border-color:#a0aec0;}\n  .resend{color:#b7791f;}\n  .work-head{font-size:1.05rem;color:#1a365d;font-weight:700;margin:26px 0 10px;}\n\n  .qcount{font-size:1.15rem;font-weight:700;color:var(--blue);white-space:nowrap;font-variant-numeric:tabular-nums;}\n  .levels{margin-left:auto;margin-right:14px;}\n\n  @media (max-width:640px){\n    .story{font-size:1.05rem;}\n    .toast{font-size:.98rem;padding:11px 14px;}\n    .turn-in{font-size:.9rem;padding:7px 13px;}\n    .nav-tabs{overflow-x:auto;}\n    .tab-btn{padding:6px 10px;font-size:.8rem;white-space:nowrap;}\n    .eq{font-size:2.2rem;column-gap:15px;}\n    .eq.k-two{font-size:2.05rem;column-gap:13px;row-gap:7px;}\n    .eq.k-two .cell{min-height:2.7rem;gap:7px;}\n    .eq.k-two .dfrac > .bar{min-width:2.6rem;}\n    .cell{min-height:3.1rem;}\n    h1{font-size:1.1rem;}\n    .checkline{font-size:1.45rem;line-height:1.9;}\n    .ops{gap:9px;}\n    .op{width:4.8rem;height:4.2rem;font-size:2rem;}\n    .box{height:2.7rem;width:3.7rem;font-size:1.55rem;}\n    .box.wide{width:4.4rem;}\n    .box.mini{height:2rem;width:2.8rem;font-size:1.15rem;}\n    .box.tiny{height:1.6rem;width:2.1rem;font-size:.95rem;}\n    .eq.k-two .mgroup.roomy{padding:1.1rem 0;}\n    .promptbar{height:6.4rem;}\n    .op.choice{width:6.6rem;height:5.6rem;}\n    .relq{width:2.1rem;height:2.1rem;}\n  }\n  @media (prefers-reduced-motion:reduce){\n    .dfrac.grow,.mgroup.fade,.op.shake,.gitem.shake,.slash.draw,.relq,.nl-ghost{animation:none;}\n  }\n.top,.nav-tabs,#submitCard,#story{display:none!important}\n.ltwrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:46rem}\n.ltlead{font-size:1.2rem;font-weight:700;color:var(--text2);text-align:center}\n.ltopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}\n.ltopts.txt{grid-template-columns:repeat(4,1fr)}\n.ltopt{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--edge);border-radius:10px;padding:8px 12px;cursor:pointer;font:700 1.2rem Verdana,Geneva,Tahoma,sans-serif;color:var(--line);min-width:0}\n.ltopt:hover{border-color:var(--blue-b);background:var(--blue-bg)}\n.ltopt b{flex:0 0 auto;width:1.8em;height:1.8em;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.9rem}\n.ltopt svg{flex:1 1 auto;min-width:0;width:100%;height:auto}\n.ltopt.wrong{opacity:.4;text-decoration:line-through;border-color:#fb7185;cursor:default}\n.ltopt.right{border-color:#10b981;background:var(--green-bg)}\n.ltdone{font-size:1.3rem;font-weight:700;color:var(--green)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n  \u003cdiv class=\"wrap\">\n\n    \u003cdiv class=\"top\">\n      \u003ch1 id=\"title\">One- and two-step inequalities\u003c/h1>\n      \u003cdiv class=\"levels\" id=\"levels\">\u003c/div>\n      \u003cbutton class=\"turn-in\" id=\"turnInBtn\" title=\"Turn in what you have so far\">Turn in\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"work\">\n      \u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\" hidden>\u003c/div>\n      \u003cdiv class=\"stagebox\" id=\"stagebox\">\n        \u003cdiv class=\"stage\" id=\"stage\">\n          \u003cdiv class=\"scroller\">\u003cdiv class=\"eq\" id=\"eq\">\u003c/div>\u003c/div>\n          \u003cdiv id=\"panel\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"side\" id=\"side\">\n        \u003cdiv class=\"story\" id=\"story\">\u003c/div>\n        \u003caside class=\"keyguide\" id=\"keyguide\" aria-label=\"Keyboard shortcuts\">\u003c/aside>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"promptbar\" hidden>\u003c/div>\n\n    \u003cdiv class=\"submit-card\" id=\"submitCard\">\n      \u003ch2 id=\"submitTitle\">Results\u003c/h2>\n      \u003cp class=\"sub-note\" id=\"submitNote\">Enter your period and name to submit.\u003c/p>\n\n      \u003ciframe name=\"hidden_iframe\" id=\"hidden_iframe\" style=\"display:none;\"\n              onload=\"if(window.onHiddenFrameLoad)onHiddenFrameLoad()\">\u003c/iframe>\n\n      \u003cform action=\"#\"\n            method=\"POST\" target=\"hidden_iframe\" id=\"gform\">\n        \u003cdiv class=\"name-warning\">\n          Read the box labels before you type. Your \u003cb>LAST name\u003c/b> goes in the\n          \u003cb>Last name\u003c/b> box and your \u003cb>FIRST name\u003c/b> goes in the \u003cb>First name\u003c/b> box.\n          Swapped names cannot be matched to the roster and count as missing.\n        \u003c/div>\n        \u003cdiv class=\"field\">\n          \u003clabel for=\"studentPeriod\">\u003cspan class=\"step-num\">1\u003c/span>\u003cspan class=\"big\">Period\u003c/span>\u003c/label>\n          \u003cinput type=\"number\" id=\"studentPeriod\" placeholder=\"e.g. 3\" min=\"1\" max=\"10\" required>\n        \u003c/div>\n        \u003cdiv class=\"field\">\n          \u003clabel for=\"lastName\">\u003cspan class=\"step-num\">2\u003c/span>\u003cspan class=\"big\">LAST name\u003c/span>\n            &nbsp;\u003cem>&mdash; your family name, the one the roster is alphabetized by\u003c/em>\u003c/label>\n          \u003cinput type=\"text\" id=\"lastName\" placeholder=\"Rodriguez\" autocomplete=\"family-name\" required>\n        \u003c/div>\n        \u003cdiv class=\"field\">\n          \u003clabel for=\"firstName\">\u003cspan class=\"step-num\">3\u003c/span>\u003cspan class=\"big\">FIRST name\u003c/span>\n            &nbsp;\u003cem>&mdash; the name your teacher calls you by\u003c/em>\u003c/label>\n          \u003cinput type=\"text\" id=\"firstName\" placeholder=\"Maria\" autocomplete=\"given-name\" required>\n        \u003c/div>\n        \u003cdiv class=\"name-check\" id=\"nameCheck\">\u003c/div>\n        \u003cinput type=\"hidden\" id=\"studentName\" name=\"entry.1899284808\" value=\"\">\n        \u003cinput type=\"hidden\" id=\"formScore\" name=\"entry.1974610095\" value=\"\">\n        \u003cbutton type=\"submit\" class=\"submit-btn\">Submit Results\u003c/button>\n      \u003c/form>\n\n      \u003cdiv id=\"formFeedback\">\u003c/div>\n      \u003cdiv class=\"after-submit\">\n        \u003cspan class=\"lab\">still more to do:\u003c/span>\n        \u003cbutton class=\"ghost-btn\" type=\"button\" id=\"keepBtn\">Go back and keep going\u003c/button>\n      \u003c/div>\n\n      \u003ch3 class=\"work-head\">Your work\u003c/h3>\n      \u003cdiv class=\"recap\" id=\"recap\">\u003c/div>\n      \u003cdiv id=\"workLog\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\n\n\u003c!-- offscreen: a finished copy of the problem is drawn here and measured, so the\n     real one can be sized once and left alone -->\n\u003cdiv class=\"ghost\" id=\"ghost\" aria-hidden=\"true\">\u003c/div>\n\n\u003cscript>/*SPEC*/\u003c/script>\n\u003cscript>\nconst SPEC=window.HOST_SPEC||{};\nfunction fN(x){ const r=Math.round(x*1e6)/1e6; if(SPEC.money&&!Number.isInteger(r)) return r.toFixed(2); return String(r); }\nfunction near(a,b){ return a!==null&&a!==undefined&&!isNaN(a)&&Math.abs(a-b)\u003c1e-9; }\nfunction POST(m){ try{ parent.postMessage(Object.assign({drill:1},m),'*'); }catch(e){} }\nlet MISSED=false;\nwindow.addEventListener('message',function(e){ if(e.data&&e.data.refit) window.dispatchEvent(new Event('resize')); });\n\u003c/script>\n\u003cscript>\n\n/* ============ shell: one score, tabs state, router ============ */\nconst Shell = {\n  done:0, streak:0, active:null, activeEng:null,\n  mode:\"mixed\", engines:{}, timers:[], recent:[],\n  counts:{basic:0, negfrac:0, fcoef:0},\n\n  title:\"One- and two-step inequalities\",\n  kinds:[\n    {id:\"basic\",   tab:\"Basic\",                     tally:\"ax + b &lt;\",       name:\"Basic two-step\",            eng:\"two\", arg:\"basic\",   grid:\"two\"},\n    {id:\"negfrac\", tab:\"Negatives &amp; Flipping\",  tally:\"&minus;a &divide;\", name:\"Negatives &amp; flipping\",  eng:\"two\", arg:\"negfrac\", grid:\"two\"},\n    {id:\"fcoef\",   tab:\"Fraction Coefficients\",     tally:\"a/b x\",             name:\"Fraction coefficients\",     eng:\"two\", arg:\"fcoef\",   grid:\"two\"}\n  ],\n  kind:function(id){\n    const ks=Shell.kinds;\n    for(let i=0;i\u003cks.length;i++) if(ks[i].id===id) return ks[i];\n    return ks[0];\n  },\n\n  later:function(ms,fn){ Shell.timers.push(setTimeout(fn,ms)); },\n  clearTimers:function(){ Shell.timers.forEach(clearTimeout); Shell.timers=[]; },\n\n  /* One size per problem. The engine works out a scale from the FINISHED\n     problem before the first line is drawn, and that scale is held for every\n     step, so the writing never changes size while the student is working. */\n  scale:1,\n  applyScale:function(){\n    const stage=document.getElementById(\"stage\");\n    if(!stage) return;\n    const box=stage.parentNode, s=Shell.scale;\n    if(s\u003c0.999){\n      stage.style.transform=\"scale(\"+s+\")\";\n      box.style.height=Math.ceil(stage.offsetHeight*s)+\"px\";\n    } else {\n      stage.style.transform=\"none\";\n      box.style.height=\"\";\n    }\n  },\n  /* how much room the whole stage has to fit into */\n  /* two and a half inches between the working and the word problem; a short\n     screen gives up some of that rather than shrink the math to nothing */\n  storyGap:function(){\n    const work=document.querySelector(\".work\");\n    return 40;   /* the word problem sits at the bottom; just keep the working clear of it */\n  },\n  /* wide screens put the word problem and the key guide in a column on the right */\n  sideMode:function(){\n    const sd=document.getElementById(\"side\");\n    return !!sd && getComputedStyle(sd).position===\"absolute\";\n  },\n  room:function(){\n    const work=document.querySelector(\".work\");\n    const cs=getComputedStyle(work);\n    const pad=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);\n    const st=document.getElementById(\"story\");\n    /* the side column takes the right of a wide screen; on a narrow one the key guide is a band under the problem */\n    const w=work.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0);\n    const side=Shell.sideMode(), band=side ? 0 : 150;\n    /* with the side column up, the word problem is beside the working, not under it */\n    if(side || !st || !st.offsetHeight) return {h:work.clientHeight-pad-band, w:w};\n    /* the word problem sits underneath, with a wide gap above it */\n    const gap=Shell.storyGap();\n    return {h:work.clientHeight-pad-st.offsetHeight-gap-10-band, w:w};\n  },\n  /* measure a finished problem off-screen without disturbing the live one */\n  ghost:function(html){\n    const g=document.getElementById(\"ghost\");\n    g.innerHTML=html;\n    const out=[].map.call(g.children,function(c){\n      return {w:c.offsetWidth, h:c.offsetHeight};\n    });\n    g.innerHTML=\"\";\n    return out;\n  },\n  /* re-measure only when the box around the equation actually changes size */\n  watchFit:function(){\n    let queued=false;\n    const go=function(){\n      if(queued) return;\n      queued=true;\n      requestAnimationFrame(function(){\n        queued=false;\n        if(Shell.onResize) Shell.onResize();\n      });\n    };\n    window.addEventListener(\"resize\",go);\n    if(window.ResizeObserver){\n      const ro=new ResizeObserver(go);\n      ro.observe(document.querySelector(\".work\"));\n    }\n  },\n\n  /* every drill paints the same header and tags the grid so its own layout applies */\n  head:function(id){\n    const k=Shell.kind(id), c=Shell.counts;\n    document.getElementById(\"eq\").className = \"eq k-\"+(k.grid||k.id);\n    document.getElementById(\"title\").innerHTML = Shell.title;\n    /* which problem this is, out of the ten that get turned in */\n    const n=Shell.started, T=TURNIN.TOTAL;\n    document.getElementById(\"levels\").innerHTML =\n      '\u003cspan class=\"qcount\">'+(n\u003c=T ? 'Problem '+n+' of '+T : 'Extra practice')+'\u003c/span>';\n  },\n  records:[], started:0,\n  solved:function(clean,q){\n    Shell.done++;\n    Shell.records.push({q:q||\"\", clean:!!clean});\n    Shell.streak = clean ? Shell.streak+1 : 0;\n    if(Shell.active && Shell.counts[Shell.active]!==undefined) Shell.counts[Shell.active]++;\n  },\n\n  /* the same four moves on every problem: type its key, then type the number */\n  OPS:[\n    [\"opPlus\", \"add\",      \"Add\",      [\"A\",\"+\"]],\n    [\"opMinus\",\"sub\",      \"Subtract\", [\"S\",\"\\u2212\"]],\n    [\"opMul\",  \"multiply\", \"Multiply\", [\"M\",\"X\",\"*\"]],\n    [\"opDiv\",  \"divide\",   \"Divide\",   [\"D\",\"/\"]]\n  ],\n  opFn:null, choiceFn:null,\n  /* keyboard shortcuts for the four moves */\n  OPKEYS:{\"a\":[\"opPlus\",\"lt0\"],\"+\":\"opPlus\",\n          \"s\":[\"opMinus\",\"chLeft\"],\"-\":\"opMinus\",\n          \"m\":\"opMul\",\"x\":\"opMul\",\"*\":\"opMul\",\n          \"d\":[\"opDiv\",\"lt3\"],\"/\":\"opDiv\",\n          /* the inequality sign: k keeps it, f flips it (also on the rewrite step) */\n          \"k\":[\"chKeep\",\"chSame\"], \"f\":[\"chFlip\",\"chTurn\"],\n          /* the number line: o open dot, c closed dot, then s shade smaller, b shade bigger\n             (s only means \"smaller\" when the arrow buttons are up; otherwise it subtracts) */\n          \"o\":\"chOpen\", \"c\":[\"chShut\",\"lt2\"], \"b\":[\"chRight\",\"lt1\"],\n          /* the arrow keys shade the number line too */\n          \"ArrowLeft\":\"chLeft\", \"ArrowRight\":\"chRight\"},\n  CHOICEKEYS:{chKeep:\"K\", chSame:\"K\", chFlip:\"F\", chTurn:\"F\",\n              chOpen:\"O\", chShut:\"C\", chLeft:[\"S\",\"\\u2190\"], chRight:[\"B\",\"\\u2192\"]},\n  /* the four moves and every other choice live in the key guide at the side;\n     there is nothing to click, the student types the key */\n  opsHTML:function(){\n    return '\u003cdiv class=\"kg-lead\">Type a key to choose your move\u003c/div>\u003cdiv class=\"kg-list\">'\n      + Shell.OPS.map(function(o){\n        return '\u003cdiv class=\"gitem\" id=\"'+o[0]+'\" data-op=\"'+o[1]+'\">\u003cspan class=\"caps\">'\n          + o[3].map(function(k){return '\u003ckbd>'+k+'\u003c/kbd>';}).join(\"\")\n          + '\u003c/span>\u003cspan class=\"what\">'+o[2]+'\u003c/span>\u003c/div>';\n      }).join(\"\")+'\u003c/div>';\n  },\n  bindOps:function(fn){ Shell.opFn=fn; },\n  choicesHTML:function(list){\n    return '\u003cdiv class=\"kg-lead\">Type a key to choose\u003c/div>\u003cdiv class=\"kg-list\">'\n      + list.map(function(o){\n        return '\u003cdiv class=\"gitem\" id=\"'+o[0]+'\" data-v=\"'+o[4]+'\" title=\"'+o[3]+'\">\u003cspan class=\"caps\">'\n          + [].concat(Shell.CHOICEKEYS[o[0]]||[]).map(function(k){return '\u003ckbd>'+k+'\u003c/kbd>';}).join(\"\")+'\u003c/span>\u003cspan class=\"what\">\u003cspan class=\"sym\">'+o[1]+'\u003c/span>'\n          + o[2]+'\u003c/span>\u003c/div>';\n      }).join(\"\")+'\u003c/div>';\n  },\n  bindChoices:function(list,fn){ Shell.choiceFn=fn; },\n  shake:function(btn){\n    if(!btn) return;\n    btn.classList.add(\"shake\");\n    Shell.later(340,function(){ btn.classList.remove(\"shake\"); });\n  },\n\n  /* don't let one kind of problem come up three times running in mixed mode */\n  pickKind:function(){\n    if(Shell.mode !== \"mixed\") return Shell.mode;\n    let pool=Shell.kinds.map(function(k){return k.id;});\n    if(Shell.recent.length>1 && Shell.recent[0]===Shell.recent[1]){\n      pool=pool.filter(function(k){return k!==Shell.recent[0];});\n    }\n    const k=pool[Math.floor(Math.random()*pool.length)];\n    Shell.recent.unshift(k); Shell.recent=Shell.recent.slice(0,2);\n    return k;\n  },\n\n  next:function(){\n    Shell.clearTimers();\n    if(Shell.begun){ POST({next:1}); return; }\n    Shell.begun=true; Shell.started=1;\n    document.getElementById(\"panel\").innerHTML=\"\";\n    Shell.active=\"basic\"; Shell.activeEng=\"two\";\n    Shell.engines.two.start(\"basic\");\n  },\n\n  paintTabs:function(){\n    document.getElementById(\"navTabs\").innerHTML =\n      Shell.kinds.map(function(k){\n        return '\u003cbutton class=\"tab-btn'+(Shell.mode===k.id?\" active\":\"\")\n             + '\" data-mode=\"'+k.id+'\">'+k.tab+'\u003c/button>';\n      }).join(\"\")\n      + '\u003cbutton class=\"tab-btn'+(Shell.mode===\"mixed\"?\" active\":\"\")+'\" data-mode=\"mixed\">Mixed\u003c/button>';\n    document.querySelectorAll(\"#navTabs .tab-btn\").forEach(function(btn){\n      btn.onclick = function(){ Shell.setTab(btn.getAttribute(\"data-mode\")); };\n    });\n  },\n  setTab:function(mode){\n    if(Shell.mode === mode) return;\n    Shell.mode = mode; Shell.recent=[];\n    Shell.paintTabs();\n    Shell.next();\n  }\n};\n\nShell.watchFit();\n\n/* press a key instead of clicking: a/+ add, s/- subtract, m/x/* multiply, d// divide,\n   k keep the inequality sign, f flip it, o/c open or closed dot, s/b or the left/right arrow keys\n   shade smaller or bigger.\n   Only while that step is on screen, and never while typing in a box. */\ndocument.addEventListener(\"keydown\",function(e){\n  if(e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;\n  if(document.body.classList.contains(\"oncard\")) return;\n  const t=e.target, tag=t && t.tagName;\n  if(tag===\"INPUT\" || tag===\"TEXTAREA\" || tag===\"SELECT\" || (t && t.isContentEditable)) return;\n  const ids=[].concat(Shell.OPKEYS[e.key.length===1 ? e.key.toLowerCase() : e.key]||[]);\n  const b=ids.map(function(i){return document.getElementById(i);})\n             .filter(function(x){return x && x.offsetParent;})[0];\n  if(!b) return;\n  e.preventDefault();\n  if(b.dataset.op){ if(Shell.opFn) Shell.opFn(b.dataset.op,b); return; }       /* one of the four moves */\n  if(b.dataset.v){ if(Shell.choiceFn) Shell.choiceFn(b.dataset.v,b); return; }  /* sign, dot or arrow */\n});\n\n/* ================= two-step =================\n   Every two-step problem is one \"constant\" move and one \"coefficient\" move.\n   Normally the constant goes first; the wrapped form (x + 4)/5 = 3 needs the\n   coefficient cleared first, so the two steps just swap roles.               */\nShell.engines[\"two\"] = (function(){\nconst KEY=\"two\";\n\n/* ============ formatting ============ */\nconst MINUS=\"\\u2212\", TIMES=\"\\u00d7\", DIV=\"\\u00f7\";\nfunction esc(s){return String(s).replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");}\nfunction dash(s){return String(s).replace(/-/g,MINUS);}\nconst RELS={lt:\"&lt;\",gt:\"&gt;\",le:\"&le;\",ge:\"&ge;\"};\nconst FLIPR={lt:\"gt\",gt:\"lt\",le:\"ge\",ge:\"le\"};\nfunction gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t;}return a||1;}\n/* a term written with its own sign in front:  + 5   or   \\u2212 7 */\nfunction sgnHTML(n){\n  return '\u003cspan class=\"sgn\">'+(n\u003c0?MINUS:\"+\")+'\u003cspan>'+fN(Math.abs(n))+'\u003c/span>\u003c/span>';\n}\n\n/* ============ parsing ============ */\nfunction parseInt2(raw){\n  if(raw===null||raw===undefined) return null;\n  const s=String(raw).trim().replace(/[\\u2212\\u2013\\u2014]/g,\"-\").replace(/\\s+/g,\"\");\n  const m=s.replace(/\\$/g,\"\").match(/^([+-]?)(\\d+(?:\\.\\d*)?|\\.\\d+)$/);\n  if(!m) return null;\n  return (m[1]===\"-\"?-1:1)*parseFloat(m[2]);\n}\n\n/* ============ problem generation ============ */\nfunction rint(a,b){return Math.floor(Math.random()*(b-a+1))+a;}\nfunction pick(a){return a[Math.floor(Math.random()*a.length)];}\nconst VARS=[\"x\",\"y\",\"n\",\"m\",\"k\",\"t\",\"w\",\"p\",\"r\",\"v\",\"z\",\"c\"];\n\n/* kind tells you what is attached to the variable, and so what the second move is:\n     mul   3x       -> divide by 3\n     div   x/4      -> multiply by 4\n     frac  (2/3)x   -> multiply by 3/2\n     wrap  (x+4)/5  -> multiply by 5 FIRST, then subtract 4\n   M is what the number side is worth after step one; sol is the answer.      */\n/* one-step problems, mixed in with the two-step ones.\n     one:\"const\"  x + 6 \u003c 14     add or subtract, then the sign\n     one:\"coef\"   3x \u2265 12, x/4 > 2, (2/3)x \u2264 6   multiply or divide, then the sign\n   They run on the same steps as a two-step problem, starting at the second move. */\nfunction oneStep(fl){\n  const V=pick(VARS), varLeft=Math.random()\u003c0.5;\n  const neg = fl!==\"basic\";\n  if(Math.random()\u003c0.4){\n    const k=rint(2,15)*(Math.random()\u003c0.45?-1:1);\n    const sol=rint(neg?-12:2,15);\n    const C=sol+k;\n    if(sol===0 || C===0 || (fl===\"basic\" && C\u003c0)) return null;\n    return {kind:\"add\", one:\"const\", wrapped:false, V:V, a:0, num:0, den:0, s:1,\n            k:k, C:C, M:C, sol:sol, varLeft:varLeft, varFirst:Math.random()\u003c0.75};\n  }\n  let kind, a=0, num=0, den=0, s=1, C, sol;\n  if(fl===\"fcoef\"){\n    kind=\"frac\";\n    do{ num=rint(1,7); den=rint(2,9); }while(num>=den || gcd(num,den)!==1);\n    s = Math.random()\u003c0.5 ? -1 : 1;\n    const t=rint(1,6)*(Math.random()\u003c0.4?-1:1);\n    sol=den*t; C=s*num*t;\n  } else if(Math.random()\u003c0.6){\n    kind=\"mul\"; a=rint(2,9)*(neg&&Math.random()\u003c0.6?-1:1);\n    sol=rint(2,12)*(neg&&Math.random()\u003c0.45?-1:1); C=a*sol;\n  } else {\n    kind=\"div\"; a=rint(2,9)*(neg&&Math.random()\u003c0.6?-1:1);\n    C=rint(2,12)*(neg&&Math.random()\u003c0.45?-1:1); sol=a*C;\n  }\n  if(Math.abs(sol)>60 || Math.abs(C)>75) return null;\n  return {kind:kind, one:\"coef\", wrapped:false, V:V, a:a, num:num, den:den, s:s,\n          k:0, C:C, M:C, sol:sol, varLeft:varLeft, varFirst:true};\n}\nfunction tryGen(fl){\n  if(Math.random()\u003c0.3) return oneStep(fl);\n  const V=pick(VARS), varLeft=Math.random()\u003c0.5;\n\n  if(fl===\"negfrac\" && Math.random()\u003c0.2){\n    const a=rint(2,8), k=rint(2,12)*(Math.random()\u003c0.4?-1:1), C=rint(-9,9);\n    if(C===0) return null;\n    const M=a*C, sol=M-k;\n    if(sol===0 || Math.abs(sol)>60) return null;\n    return {kind:\"wrap\", wrapped:true, V:V, a:a, num:0, den:0, s:1,\n            k:k, C:C, M:M, sol:sol, varLeft:varLeft, varFirst:true};\n  }\n\n  let kind, a=0, num=0, den=0, s=1, M=0, sol=0;\n  if(fl===\"fcoef\"){\n    kind=\"frac\";\n    do{ num=rint(1,7); den=rint(2,9); }while(num>=den || gcd(num,den)!==1);\n    s = Math.random()\u003c0.5 ? -1 : 1;\n    const t = rint(1,5)*(Math.random()\u003c0.4?-1:1);\n    sol = den*t; M = s*num*t;\n  } else if(fl===\"basic\"){\n    if(Math.random()\u003c0.6){ kind=\"mul\"; a=rint(2,9); sol=rint(2,12); M=a*sol; }\n    else                 { kind=\"div\"; a=rint(2,9); M=rint(2,12); sol=a*M; }\n  } else {\n    if(Math.random()\u003c0.6){\n      kind=\"mul\"; a=rint(2,9)*(Math.random()\u003c0.6?-1:1);\n      sol=rint(2,12)*(Math.random()\u003c0.45?-1:1); M=a*sol;\n    } else {\n      kind=\"div\"; a=rint(2,9)*(Math.random()\u003c0.6?-1:1);\n      M=rint(2,10)*(Math.random()\u003c0.45?-1:1); sol=a*M;\n    }\n  }\n  if(M===0 || sol===0 || Math.abs(sol)>60 || Math.abs(M)>60) return null;\n\n  const k = rint(2,15)*(Math.random()\u003c(fl===\"basic\"?0.4:0.5) ? -1 : 1);\n  const C = M+k;\n  if(Math.abs(C)>75) return null;\n\n  const varFirst = kind===\"div\" ? Math.random()\u003c0.75 : Math.random()\u003c0.62;\n  return {kind:kind, wrapped:false, V:V, a:a, num:num, den:den, s:s,\n          k:k, C:C, M:M, sol:sol, varLeft:varLeft, varFirst:varFirst};\n}\nfunction genProblem(fl){\n  if(SPEC.p){ const q=Object.assign({},SPEC.p); q.story=\"\"; return q; }\n  for(let i=0;i\u003c600;i++){\n    const p=tryGen(fl||\"basic\");\n    if(p){ p.rel=pick([\"lt\",\"gt\",\"le\",\"ge\"]); p.story=makeStory(p); return p; }\n  }\n  return {kind:\"mul\",wrapped:false,V:\"x\",a:2,num:0,den:0,s:1,\n          k:5,C:15,M:10,sol:5,varLeft:true,varFirst:true,rel:\"lt\"};\n}\n\n/* ============ word problems ============\n   Every problem comes with a situation that it models exactly. When the numbers\n   fit a real setting (positive amounts, a positive answer) one of those is used\n   and the variable takes a letter that suits it; otherwise the situation is the\n   inequality said in words, which fits any signs. */\nconst NAMES=[\"Maya\",\"Jordan\",\"Luis\",\"Aisha\",\"Ben\",\"Sofia\",\"Kai\",\"Priya\",\"Marcus\",\"Elena\"];\nconst CTX_W={lt:\"less than\",gt:\"more than\",le:\"at most\",ge:\"at least\"};\nconst PUZ_W={lt:\"less than\",gt:\"greater than\",le:\"less than or equal to\",ge:\"greater than or equal to\"};\nfunction letv(V,what){return '\u003cspan class=\"letv\">Let '+V+' = '+what+'.\u003c/span>';}\nfunction money(n){return \"$\"+n;}\n/* \"an $8 tip\", \"an $11 fee\": the article follows how the amount is said */\nfunction aM(n){const t=String(n); return (t.charAt(0)===\"8\"||n===11||n===18||(n>=1100&&n\u003c1200)||(n>=18000&&n\u003c19000))?\"an \":\"a \";}\n/* numbers ten and under are written out; money, negatives and fractions stay as numerals */\nconst WORDS=[\"zero\",\"one\",\"two\",\"three\",\"four\",\"five\",\"six\",\"seven\",\"eight\",\"nine\",\"ten\"];\nfunction w(n){return (Number.isInteger(n) && n>=0 && n\u003c=10) ? WORDS[n] : dash(fN(n));}\nfunction cap(t){return t.charAt(0).toUpperCase()+t.slice(1);}\nconst CNT_W={lt:\"fewer than\",gt:\"more than\",le:\"at most\",ge:\"at least\"};   /* for things you count */\nfunction makeStory(p){\n  const N=pick(NAMES), K=Math.abs(p.k), A=Math.abs(p.a), C=p.C;\n  /* each situation says which way makes sense: you want to pay LESS, earn or\n     keep MORE. The sign of the problem is then set to match the situation. */\n  const opts=[];\n  const add=function(V,dir,ok,make){ if(ok) opts.push({V:V,dir:dir,make:make}); };\n  const real = p.sol>0 && C>0;\n  const pay = C>=5;                        /* no \"spend less than $2\" */\n  const one=p.one, kd=p.kind;\n\n  /* ---- one step ---- */\n  add(\"s\",\"up\",real&&one===\"const\"&&p.k>0,function(rw,rc){return N+' has already saved '+money(K)+' for a new bike. '+N\n      +' wants to have '+rw+' '+money(C)+' saved. '+letv(\"s\",\"the amount still to save in dollars\");});\n  add(\"p\",\"up\",real&&one===\"const\"&&p.k>0,function(rw,rc){return N+' scored '+w(K)+' points in the first half of a game. '+N\n      +' wants to score '+rc+' '+w(C)+' points in the whole game. '+letv(\"p\",\"the points scored in the second half\");});\n  add(\"m\",\"up\",real&&one===\"const\"&&p.k\u003c0,function(rw,rc){return N+' spends '+money(K)+' at the movies and wants to have '+rw+' '\n      +money(C)+' left afterward. '+letv(\"m\",\"the money \"+N+\" had before the movies\");});\n  add(\"n\",\"down\",real&&pay&&one===\"coef\"&&kd===\"mul\"&&p.a>0,function(rw,rc){return 'Notebooks cost '+money(A)+' each. '+N\n      +' wants to spend '+rw+' '+money(C)+'. '+letv(\"n\",\"the number of notebooks\");});\n  add(\"h\",\"up\",real&&one===\"coef\"&&kd===\"mul\"&&p.a>0,function(rw,rc){return N+' earns '+money(A)+' an hour babysitting and wants to earn '\n      +rw+' '+money(C)+'. '+letv(\"h\",\"the number of hours\");});\n  add(\"g\",\"down\",real&&pay&&one===\"coef\"&&kd===\"div\"&&p.a>0,function(rw,rc){return N+' and '+w(A-1)+' friend'+(A>2?'s':'')\n      +' split the cost of a gift equally. '+N+' can pay '+rw+' '+money(C)+'. '+letv(\"g\",\"the cost of the gift in dollars\");});\n  add(\"b\",\"up\",real&&one===\"coef\"&&kd===\"frac\"&&p.s>0,function(rw,rc){return N+' has read '+p.num+'/'+p.den+' of a book, which is '\n      +rc+' '+w(C)+' pages. '+letv(\"b\",\"the number of pages in the book\");});\n\n  /* ---- two step ---- */\n  const two=!one;\n  add(\"m\",\"down\",real&&pay&&two&&kd===\"mul\"&&p.a>0&&p.k>0,function(rw,rc){return 'A gym charges '+aM(K)+money(K)\n      +' sign-up fee plus '+money(A)+' for each month. '+N+' wants the total cost to be '+rw+' '+money(C)+'. '\n      +letv(\"m\",\"the number of months\");});\n  add(\"d\",\"down\",real&&pay&&two&&kd===\"mul\"&&p.a>0&&p.k>0,function(rw,rc){return 'A taxi charges '+money(K)\n      +' to start a ride plus '+money(A)+' for each mile. '+N+' wants the fare to be '+rw+' '+money(C)+'. '\n      +letv(\"d\",\"the number of miles\");});\n  add(\"w\",\"up\",real&&two&&kd===\"mul\"&&p.a>0&&p.k>0,function(rw,rc){return N+' has already read '+w(K)+' pages and reads '+w(A)\n      +' more pages every day. '+N+' wants to read '+rc+' '+w(C)+' pages in all. '+letv(\"w\",\"the number of days\");});\n  add(\"t\",\"down\",real&&pay&&two&&kd===\"mul\"&&p.a>0&&p.k\u003c0,function(rw,rc){return 'Concert tickets cost '+money(A)+' each, and '+N\n      +' has a coupon for '+money(K)+' off the whole order. '+N+' wants to spend '+rw+' '+money(C)+'. '\n      +letv(\"t\",\"the number of tickets\");});\n  add(\"n\",\"up\",real&&two&&kd===\"mul\"&&p.a>0&&p.k\u003c0,function(rw,rc){return N+' earns '+money(A)+' for each lawn mowed but spends '\n      +money(K)+' on gas. '+N+' wants to make '+rw+' '+money(C)+'. '+letv(\"n\",\"the number of lawns\");});\n  add(\"h\",\"up\",real&&two&&kd===\"mul\"&&p.a\u003c0&&p.k>0,function(rw,rc){return 'A candle is '+w(K)+' inches tall and burns down '+w(A)\n      +' inches every hour. It needs to stay '+rw+' '+w(C)+' inches tall. '+letv(\"h\",\"the number of hours\");});\n  add(\"t\",\"up\",real&&two&&kd===\"mul\"&&p.a\u003c0&&p.k>0,function(rw,rc){return 'A tank holds '+w(K)+' gallons of water and drains '+w(A)\n      +' gallons every minute. It must hold '+rw+' '+w(C)+' gallons. '+letv(\"t\",\"the number of minutes\");});\n  add(\"b\",\"down\",real&&pay&&two&&kd===\"div\"&&p.a>0&&p.k>0,function(rw,rc){return N+' and '+w(A-1)+' friend'+(A>2?'s':'')\n      +' split a restaurant bill equally. On top of that share, '+N+' leaves '+aM(K)+money(K)+' tip. '+N\n      +' can spend '+rw+' '+money(C)+' in all. '+letv(\"b\",\"the whole bill in dollars\");});\n  add(\"p\",\"up\",real&&two&&kd===\"div\"&&p.a>0&&p.k\u003c0,function(rw,rc){return 'A prize is split equally among '+w(A)+' winners. '+N\n      +' then spends '+money(K)+' of that share. '+N+' wants to have '+rw+' '+money(C)+' left. '\n      +letv(\"p\",\"the whole prize in dollars\");});\n  add(\"e\",\"up\",real&&two&&kd===\"frac\"&&p.s>0&&p.k>0,function(rw,rc){return N+' saves '+p.num+'/'+p.den\n      +' of the money earned at a summer job and already had '+money(K)+' saved. '+N+' wants savings of '+rw+' '+money(C)+'. '\n      +letv(\"e\",\"the money earned in dollars\");});\n  add(\"c\",\"down\",real&&two&&kd===\"frac\"&&p.s>0&&p.k\u003c0,function(rw,rc){return 'In a club, '+p.num+'/'+p.den\n      +' of the students sign up for a trip, then '+w(K)+' of them drop out. The bus can take '+rc+' '+w(C)+' students. '\n      +letv(\"c\",\"the number of students in the club\");});\n  add(\"f\",\"down\",real&&pay&&two&&kd===\"wrap\"&&p.k>0,function(rw,rc){return cap(w(A))+' friends share the cost of a pizza order equally: the food plus '\n      +aM(K)+money(K)+' delivery fee. Each person can spend '+rw+' '+money(C)+'. '+letv(\"f\",\"the cost of the food in dollars\");});\n  add(\"p\",\"up\",real&&two&&kd===\"wrap\"&&p.k\u003c0,function(rw,rc){return 'A team of '+w(A)+' wins prize money, pays '+aM(K)+money(K)\n      +' entry fee out of it, and splits the rest equally. Each player wants '+rw+' '+money(C)+'. '\n      +letv(\"p\",\"the prize money in dollars\");});\n\n  /* only real situations: if the numbers don't fit one, show no word problem at all */\n  if(!opts.length) return \"\";\n  const o=pick(opts);\n  /* keep the problem's strict / or-equal choice; point it the way the situation needs */\n  const strict = p.rel===\"lt\"||p.rel===\"gt\";\n  const rk = o.dir===\"up\" ? (strict?\"gt\":\"ge\") : (strict?\"lt\":\"le\");\n  p.rel = p.varLeft ? rk : FLIPR[rk];\n  p.V=o.V;\n  return o.make(CTX_W[rk], CNT_W[rk]);\n}\n/* the inequality, read out in words */\nfunction puzzle(p){\n  const A=Math.abs(p.a), K=Math.abs(p.k);\n  let side;\n  if(p.kind===\"wrap\"){\n    side = (p.k>0 ? 'the sum of a number and '+w(K) : 'the difference of a number and '+w(K))\n         + ', divided by '+w(p.a)+(p.varLeft?',':'');\n  } else {\n    const neg = p.kind===\"mul\" ? p.a\u003c0 : p.kind===\"frac\" ? p.s\u003c0 : false;\n    const term = function(signed){\n      if(p.kind===\"mul\")  return (signed?w(p.a):w(A))+' times a number';\n      if(p.kind===\"div\")  return 'a number divided by '+w(p.a);\n      return (signed&&neg?'the opposite of ':'')+p.num+'/'+p.den+' of a number';\n    };\n    side = p.varFirst\n      ? term(true)+(p.k\u003c0?' minus '+w(K):' plus '+w(K))\n      : w(p.k)+(neg?' minus ':' plus ')+term(false);\n  }\n  side=side.replace(\"a number\",\"the number\");\n  const sent = p.varLeft ? side+' is '+PUZ_W[p.rel]+' '+w(p.C)\n                         : w(p.C)+' is '+PUZ_W[p.rel]+' '+side;\n  return 'Find every number for which '+sent+'. '+letv(p.V,'the number');\n}\n\n/* ============ state ============ */\nconst S={\n  p:genProblem(\"basic\"), fl:\"basic\", phase:\"pick1\", sign:1,\n  opIn:\"\", coefIn:\"\", recN:\"\", recD:\"\", mIn:\"\", ansIn:\"\",\n  simpDen:\"\", simpNum:\"\",\n  miss:\"\", hint:false, clean:true, firstId:null\n};\nconst clearTimers=Shell.clearTimers, later=Shell.later;\n\n/* ============ where we are ============ */\nconst ORDER=[\"clrA\",\"clrB\",\"clrC\",\"comb\",\"pick1\",\"op1\",\"cancel1\",\"simplify1\",\"compute1\",\"flip1\",\n             \"pick2\",\"op2\",\"cancel2\",\"simplify2\",\"compute2\",\"flip2\",\n             \"solved\",\"rewrite\",\"dot\",\"arrow\",\"check\"];\nfunction idx(ph){return ORDER.indexOf(ph);}\nfunction at(ph){return idx(S.phase)>=idx(ph);}\nfunction past(ph){return idx(S.phase)>idx(ph);}\nfunction stepNo(){return /\\d$/.test(S.phase) ? +S.phase.slice(-1) : 0;}\nfunction subName(){return stepNo() ? S.phase.slice(0,-1) : S.phase;}\n/* which step clears the constant, and which the coefficient. A one-step problem\n   only has the second step, so whichever move it needs is numbered 2. */\nfunction lateConst(){return S.p.wrapped || S.p.one===\"const\";}\nfunction cs(){return lateConst()?2:1;}\nfunction ks(){return lateConst()?1:2;}\nfunction isConst(){return stepNo()===cs();}\n\n/* what each move works on and what it produces */\nfunction constIn(){return S.p.wrapped?S.p.M:S.p.C;}\nfunction coefIn(){return S.p.wrapped?S.p.C:S.p.M;}\n\n/* ---- cross-simplifying, set up exactly as the one-step fraction drill does it.\n   The reciprocal's bottom number and the lone number on the other side share a\n   factor, so both get struck out and rewritten smaller before multiplying.     */\nfunction gFac(){return gcd(S.p.num, Math.abs(coefIn()));}\nfunction canSimp(){return S.p.kind===\"frac\" && gFac()>1;}\nfunction redDen(){return S.p.num/gFac();}\nfunction redNum(){return coefIn()/gFac();}\nfunction simpPhase(){return \"simplify\"+ks();}\nfunction simplifying(){return S.phase===simpPhase();}\nfunction simpDenOK(){return parseInt2(S.simpDen)===redDen();}\nfunction simpNumOK(){const v=parseInt2(S.simpNum); return v!==null && v===redNum();}\nfunction simpOK(){return simpDenOK()&&simpNumOK();}\nfunction simpPartial(){\n  const dv=parseInt2(S.simpDen), nv=parseInt2(S.simpNum);\n  if(dv===null||nv===null||dv\u003c=redDen()) return false;\n  const g=S.p.num/dv;\n  return Number.isInteger(g) && g>1 && nv===coefIn()/g;\n}\n\n/* how the cancelled pieces are marked right now */\nfunction cCls(){ return S.phase===\"cancel\"+cs() ? \"cancelling\" : (past(\"cancel\"+cs())?\"struck\":\"\"); }\nfunction kCls(){ return S.phase===\"cancel\"+ks() ? \"cancelling\" : (past(\"cancel\"+ks())?\"struck\":\"\"); }\nfunction slashCls(){ return S.phase===\"cancel\"+ks() ? \"slash draw\" : (past(\"cancel\"+ks())?\"slash dim\":\"\"); }\nfunction coefMoved(){return at(\"op\"+ks());}     /* the coefficient move is on the page */\nfunction coefLive(){return S.phase===\"op\"+ks();} /* ...and still being typed into */\nfunction varSign(){\n  const p=S.p;\n  if(p.kind===\"mul\")  return p.a\u003c0?-1:1;\n  if(p.kind===\"frac\") return p.s\u003c0?-1:1;\n  return 1;                                     /* x/\\u22123 keeps its sign under the bar */\n}\n\n/* ---- the inequality sign ----\n   rel is the sign as written on the page, left side to right side.\n   It flips only when both sides are multiplied or divided by a negative. */\nfunction flips(){\n  const p=S.p;\n  if(p.kind===\"mul\"||p.kind===\"div\") return p.a\u003c0;\n  if(p.kind===\"frac\") return p.s\u003c0;\n  return false;\n}\nfunction relF(){return flips()?FLIPR[S.p.rel]:S.p.rel;}\n/* the answer read with the variable first:  x \u003c 5  rather than  5 > x */\nfunction solRel(){return S.p.varLeft?relF():FLIPR[relF()];}\nfunction relWords(r){\n  return {lt:\"less than\",gt:\"greater than\",le:\"less than or equal to\",ge:\"greater than or equal to\"}[r];\n}\nfunction goesRight(){const r=solRel(); return r===\"gt\"||r===\"ge\";}\nfunction isClosed(){const r=solRel(); return r===\"le\"||r===\"ge\";}\nfunction relCell(r,fl){return '\u003cdiv class=\"cell\">\u003cspan class=\"rel'+(fl?' flipped':'')+'\">'+RELS[r]+'\u003c/span>\u003c/div>';}\nfunction finalRelCell(){\n  if(!past(\"flip2\")) return '\u003cdiv class=\"cell\">\u003cspan class=\"relq\">?\u003c/span>\u003c/div>';\n  return relCell(relF(),flips());\n}\n/* what both sides were just multiplied or divided by */\nfunction multDesc(){\n  const p=S.p;\n  if(p.kind===\"add\") return {verb:(p.k>0?\"subtracted\":\"added\"), by:String(Math.abs(p.k)), neg:false, plain:true};\n  if(p.kind===\"mul\")  return {verb:\"divided\",    by:dash(fN(p.a)), neg:p.a\u003c0};\n  if(p.kind===\"div\")  return {verb:\"multiplied\", by:dash(fN(p.a)), neg:p.a\u003c0};\n  if(p.kind===\"wrap\") return {verb:\"multiplied\", by:String(p.a),       neg:false};\n  return {verb:\"multiplied\", by:recipHTML(false), neg:p.s\u003c0};\n}\n\n/* the problem as plain text, for the work log on the turn-in sheet */\nconst RELT={lt:\"\u003c\",gt:\">\",le:\"\\u2264\",ge:\"\\u2265\"};\nfunction plainText(){\n  const p=S.p, V=p.V, d=function(n){return dash(fN(n));};\n  const A=Math.abs(p.a), K=Math.abs(p.k);\n  let side;\n  if(p.one===\"const\") side = p.varFirst ? V+(p.k\u003c0?' \\u2212 ':' + ')+K : d(p.k)+' + '+V;\n  else if(p.one===\"coef\") side = p.kind===\"mul\" ? d(p.a)+V : p.kind===\"div\" ? V+'/'+d(p.a)\n                               : (p.s\u003c0?'\\u2212':'')+'('+p.num+'/'+p.den+')'+V;\n  else if(p.kind===\"wrap\") side='('+V+(p.k\u003c0?' \\u2212 ':' + ')+K+')/'+p.a;\n  else {\n    const neg=varSign()\u003c0;\n    const t=function(signed){\n      if(p.kind===\"mul\") return (signed?d(p.a):A)+V;\n      if(p.kind===\"div\") return V+'/'+d(p.a);\n      return (signed&&neg?'\\u2212':'')+'('+p.num+'/'+p.den+')'+V;\n    };\n    side = p.varFirst ? t(true)+(p.k\u003c0?' \\u2212 ':' + ')+K\n                      : d(p.k)+(neg?' \\u2212 ':' + ')+t(false);\n  }\n  const ineq = p.varLeft ? side+' '+RELT[p.rel]+' '+d(p.C) : d(p.C)+' '+RELT[p.rel]+' '+side;\n  return ineq+'   \\u2192   '+V+' '+RELT[solRel()]+' '+d(p.sol);\n}\n\n/* ============ rendering pieces ============ */\nfunction boxHTML(id,val,extra){\n  return '\u003cinput id=\"'+id+'\" class=\"box'+(extra||\"\")+'\" value=\"'+esc(val)\n       + '\" autocomplete=\"off\" spellcheck=\"false\" inputmode=\"text\">';\n}\nfunction cell(html,cls){return '\u003cdiv class=\"cell '+(cls||\"\")+'\">'+html+'\u003c/div>';}\nfunction wideCell(html,cls){return '\u003cdiv class=\"cell span2 '+(cls||\"\")+'\">'+html+'\u003c/div>';}\nfunction dfrac(t,b,cls){\n  return '\u003cspan class=\"dfrac '+(cls||\"\")+'\">\u003cspan class=\"t\">'+t+'\u003c/span>'\n       + '\u003cspan class=\"bar\">\u003c/span>\u003cspan class=\"b\">'+b+'\u003c/span>\u003c/span>';\n}\nfunction mgroup(mult,inner,tall,cls){\n  return '\u003cspan class=\"mgroup'+(tall?\" tall\":\"\")+' '+(cls||\"\")+'\">'+mult\n       + '\u003cspan class=\"paren\">(\u003c/span>'+inner+'\u003cspan class=\"paren\">)\u003c/span>\u003c/span>';\n}\nfunction markK(v){\n  const c=kCls();\n  return c ? '\u003cspan class=\"'+c+'\">'+dash(fN(v))+'\u003c/span>' : dash(fN(v));\n}\nfunction coefFracHTML(){const p=S.p; return (p.s\u003c0?MINUS:\"\")+dfrac(p.num,p.den);}\nfunction recipHTML(marked){\n  const p=S.p, inner=(p.s\u003c0?MINUS:\"\")+dfrac(p.den,p.num);\n  return marked ? '\u003cspan class=\"'+slashCls()+'\">'+inner+'\u003c/span>' : inner;\n}\nfunction recipOK(){\n  const p=S.p, n=parseInt2(S.recN), d=parseInt2(S.recD);\n  if(n===null||d===null||n===0||d===0) return false;\n  return Math.abs(n)===p.den && Math.abs(d)===p.num && ((n*d>0)===(p.s>0));\n}\nfunction fracboxHTML(nId,dId){\n  const cls=\" mini\"+(recipOK()?\" ok\":\"\");\n  return '\u003cspan class=\"fracbox\">'+boxHTML(nId,S.recN,cls)\n       + '\u003cspan class=\"bar\">\u003c/span>'+boxHTML(dId,S.recD,cls)+'\u003c/span>';\n}\n\n/* live: the student is still filling the two small boxes in.\n   otherwise the reduced numbers are just written in, and the strokes stay. */\nfunction pendCls(ok,live){return live ? (ok?\"slash draw\":\"pend\") : \"slash cross\";}\nfunction recipCancelHTML(live){\n  const p=S.p;\n  const den='\u003cspan class=\"cx below\">\u003cspan id=\"slD\" class=\"'+pendCls(simpDenOK(),live)+'\">'+p.num+'\u003c/span>'\n    + '\u003cspan class=\"redu\">'\n    + (live?boxHTML(\"sd\",S.simpDen,\" tiny\"+(simpDenOK()?\" ok\":\"\")):String(redDen()))\n    + '\u003c/span>\u003c/span>';\n  return (p.s\u003c0?MINUS:\"\")+dfrac(p.den,den);\n}\nfunction constCancelHTML(live){\n  return '\u003cspan class=\"cx above\">\u003cspan class=\"redu\">'\n    + (live?boxHTML(\"sn\",S.simpNum,\" tiny\"+(simpNumOK()?\
