  if(s.type==='ask') h+='<div class="fields">'+s.fields.map((f,i)=>'<div class="field"><label for="hf'+i+'">'+esc(f.label)+'</label><input class="box'+(f.ok?' ok':'')+'" id="hf'+i+'" value="'+esc(f.val||'')+'" autocomplete="off" inputmode="decimal">'+(f.after?'<span>'+esc(f.after)+'</span>':'')+'</div>').join('')+'</div>';
  if(s.type==='rows') h+=s.rows.map((r,i)=>'<div class="srow"><p>'+(i+1)+'. '+esc(r.text)+'</p><div class="sline"><span>x</span>'
    +['<','>','<=','>='].map(sg=>{const w=r.wrong.indexOf(sg)>=0,ok=r.done&&r.want===sg;return '<button type="button" class="sg'+(ok?' right':'')+(w?' wrong':'')+'" data-r="'+i+'" data-s="'+sg+'"'+(r.done||w?' disabled':'')+'>'+esc(SYMT[sg])+'</button>';}).join('')
    +'<span>'+r.n+'</span></div></div>').join('');
  if(q.fb) h+='<p class="hp-fb">✗ '+q.fb+'</p>';
  hp.innerHTML=h;
  hp.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickOpt(q,s,+b.dataset.i));
  const mn=$('#hpMenu');if(mn){mn.onchange=()=>{if(mn.value!=='')pickOpt(q,s,+mn.value);};setTimeout(()=>mn.focus(),30);}
  hp.querySelectorAll('.sg').forEach(b=>b.onclick=()=>pickRow(q,s,+b.dataset.r,b.dataset.s));
  if(s.type==='ask'){
    s.fields.forEach((f,i)=>{const el=$('#hf'+i);
      el.oninput=()=>{f.val=el.value;el.classList.remove('bad');const v=parseFloat(el.value.replace(/[$,\s]/g,'').replace(/[−]/g,'-'));f.ok=!isNaN(v)&&Math.abs(v-f.w)<1e-9;el.classList.toggle('ok',f.ok);
        if(f.ok){const nx=s.fields.find(x=>!x.ok);if(nx)$('#hf'+s.fields.indexOf(nx)).focus();else setTimeout(()=>stepDone(q),300);}};
      el.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();if(!el.value.trim())return;if(!f.ok){el.classList.add('bad');miss(q,s.hint);}};
    });
    const first=s.fields.find(x=>!x.ok);if(first)setTimeout(()=>$('#hf'+s.fields.indexOf(first)).focus(),30);
  }
}
function miss(q,why){q.miss=true;q.fb=why;renderPanel(q);renderStrip();renderScore();renderStatus(q);}
function stepDone(q){
  q.fb=null;q.step++;
  const list=q.phase==='pre'?q.g.pre:q.g.post;
  if(q.step>=list.length){
    if(q.phase==='pre'&&q.g.eng){q.phase='eng';}
    else if(q.miss){keepAns(q);q.phase='retry';}
    else {keepAns(q);q.phase='done';q.done=true;celebrate();}
    q.step=0;
  }
  render();
}
function pickOpt(q,s,i){const o=s.opts[i];if(!o.ok){if(s.wrong.indexOf(i)<0)s.wrong.push(i);miss(q,o.why||'Not that one.');return;}stepDone(q);}
function pickRow(q,s,i,sg){const r=s.rows[i];if(r.done)return;
  if(sg===r.want)r.done=true;else{r.wrong.push(sg);q.miss=true;q.fb=(i+1)+'. '+MEANING[r.want](r.clue,r.n);}
  if(s.rows.every(x=>x.done)){if(!q.g.eng){q.fb=null;keepAns(q);if(q.miss)q.phase='retry';else{q.done=true;q.phase='done';celebrate();}render();return;}stepDone(q);return;}
  renderPanel(q);renderStrip();renderScore();renderStatus(q);}
function nextLabel(){if(finished()===TOTAL&&!S.autoShown)return 'Turn in my work &rarr;';return S.i===TOTAL-1?'Back to the list &rarr;':'Question '+LABEL(S.i+1)+' &rarr;';}
function goNext(){
  if(finished()===TOTAL&&!S.autoShown){S.autoShown=true;openTurnIn();return;}
  if(S.i<TOTAL-1)S.i++;else{const k=S.Q.findIndex(q=>!q.done);S.i=k<0?0:k;}
  render();
}
function celebrate(){
  const old=document.querySelector('.big-ok');if(old)old.remove();
  const el=document.createElement('div');el.className='big-ok';el.setAttribute('aria-hidden','true');
  el.innerHTML='<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" class="bo-c"/><path d="M34 62 L52 80 L87 42" class="bo-k"/></svg>';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1200);
}
/* messages from the drill working the problem */
window.addEventListener('message',e=>{
  const d=e.data;if(!d||!d.drill)return;
  const q=S.Q.find(x=>x.frame&&x.frame.contentWindow===e.source);if(!q)return;
  if(d.miss)q.miss=true;
  if(d.done&&q.g.eng2&&!q.onEng2){if(d.clean===false)q.miss=true;q.eng1Done=true;renderStrip();renderScore();return;}
  if(d.next&&q.eng1Done&&!q.onEng2){q.onEng2=true;if(q.frame)q.frame.remove();q.frame=null;if(q===cur()&&!S.ti)render();return;}
  if(d.done){q.engDone=true;if(d.clean===false)q.miss=true;if(!q.g.post.length&&!q.done){keepAns(q);if(q.miss)q.pendingRetry=true;else{q.done=true;celebrate();}}}
  if(d.next){
    if(q.engDone&&q.g.post.length&&q.phase==='eng'){q.phase='post';q.step=0;render();return;}
    if(q.pendingRetry){retry(q);return;}
    if(q.done&&q===cur()){goNext();return;}
  }
  if(!S.ti){renderScore();renderStrip();if(q===cur())renderStatus(q);}
});

/* ======================= turning it in (Microsoft Form) ======================= */
/* The same Microsoft Form as the Write It, Graph It drill. Names come from the school sign-in. */
const MS_FORM={
  url:'https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=y7Ws7nBTWEOpaqN4PJXUIl-SIiqFputDkoByW916pXZUNDRQTTZMTFZVMFVBME1VSzVTUFlPOE1GUS4u',
  score:'re0712995f44f4c60853aa931e7a40a25',
  results:'rbd5e36321bab43a4ab3c7a497c55c804',
  /* "button only": show just the form's Submit button. Open the drill with #setup at the end of its address to adjust. */
  submitButton:{x:7,y:532,width:515,height:56}
};
const DRILL_NAME='Equations Test Prep';
function checkCode(r,t){const x=(r*37+t*11+23)%676;return String.fromCharCode(65+x%26)+String.fromCharCode(65+Math.floor(x/26));}
function formLink(){
  const n=firstTry(),f=finished();
  /* Keep this line no longer than the Write It, Graph It drill's. A longer line makes the form's
     answer box taller, which pushes Submit out of the cropped window (submitButton below). */
  const text=n+' of '+TOTAL+' correct on the first try ('+f+' finished) — '+DRILL_NAME+' — check '+checkCode(n,f);
  return MS_FORM.url+'&'+MS_FORM.score+'='+n+(MS_FORM.results?'&'+MS_FORM.results+'='+encodeURIComponent(text):'');
}
function openTurnIn(){S.ti=true;$('#main').hidden=true;$('#strip').hidden=true;$('#tipage').hidden=false;$('#turnBtn').textContent='Back to the problems';$('#newBtn').hidden=true;renderTurnIn();}
function closeTurnIn(){S.ti=false;$('#main').hidden=false;$('#strip').hidden=false;$('#tipage').hidden=true;$('#turnBtn').textContent='Turn in';render();}
function renderTurnIn(){
  renderScore();
  const n=firstTry(),f=finished(),early=f<TOTAL,b=MS_FORM.submitButton||{},crop=!!MS_FORM.submitButton,url=formLink(),tp=$('#tipage');
  tp.className='turnin'+(crop?' cropped':'')+(early?' early':'');
  tp.style.cssText='--crop-x:'+(b.x||0)+';--crop-y:'+(b.y||0)+';--crop-h:'+(b.height||90)+'px;--crop-w:'+(b.width||(528-(b.x||0)))+'px';
  tp.innerHTML='<div class="ti-top">'+(early?'':'<div class="ti-check" aria-hidden="true">✓</div>')
    +'<div><h2>'+(early?'Turn in early':'All '+TOTAL+' done')+'</h2><p class="ti-sub">'+n+' of '+TOTAL+' right on the first try. A question counts once you get one like it right with no mistakes.</p></div></div>'
    +'<div class="ti-list">'+S.Q.map((q,i)=>{const st=status(q);return '<span class="'+(st==='right'?'r':st==='miss'?'m':'')+'">'+'Q'+(i+1)+': '+(st==='right'?(q.tries>1?'right on try '+q.tries:'first try'):st==='miss'?'not yet (try '+q.tries+')':'not started')+'</span>';}).join('')+'</div>'
    +'<div class="ti-formcol"><p class="ti-press"><b>Press Submit to turn in your score.</b><small>When the button goes away, you’re done. You can come back, keep working, and turn in again.</small></p>'
    +'<div class="ti-crop"><iframe id="ti-form" class="ti-form" title="Turn in your work"></iframe></div>'
    +'<p class="ti-how">Form not showing? Tell your teacher.</p></div>'
    +'<div><button class="btn" type="button" id="ti-back">'+(early?'Back to the problems':'Keep practicing')+'</button></div>';
  $('#ti-form').src=url+'&embed=true';$('#ti-back').onclick=closeTurnIn;
}
$('#turnBtn').onclick=()=>{if(S.ti)closeTurnIn();else openTurnIn();};
$('#newBtn').onclick=()=>{const q=cur();if(q.done)return;retry(q);};
document.addEventListener('keydown',e=>{
  if(S.ti||e.ctrlKey||e.metaKey||e.altKey)return;
  const a=document.activeElement;if(a&&a.tagName==='INPUT')return;
  const q=cur();if(q.done&&q.phase==='done'&&(e.key==='Enter'||e.key==='n'||e.key==='N')){e.preventDefault();goNext();}
});
if(location.hash==='#setup'){
  const sample=MS_FORM.url+'&'+MS_FORM.score+'='+TOTAL+(MS_FORM.results?'&'+MS_FORM.results+'='+encodeURIComponent(TOTAL+' of '+TOTAL+' correct on the first try ('+TOTAL+' finished) — '+DRILL_NAME+' — check XX'):'')+'&embed=true',b0=MS_FORM.submitButton||{x:0,y:500,width:528,height:90};
  const d=document.createElement('div');d.className='cal';
  d.innerHTML='<div class="cal-in"><h2>Set up: show only the Submit button</h2><p>Drag the sliders until the form’s <b>Submit</b> button sits inside the blue box. Nothing is turned in unless you press Submit.</p>'
    +'<p><button class="btn" type="button" id="cal-all">Show the whole form</button> <span style="color:#64748b;font-weight:500">If Submit is greyed out, look here for a question marked in red. That question needs fixing in Microsoft Forms.</span></p>'
    +['y:Up / down:0:1500','x:Left / right:0:400','w:Box width:100:528','h:Box height:50:200'].map(r=>{const p=r.split(':');const v={y:b0.y,x:b0.x||0,w:b0.width||528,h:b0.height||90}[p[0]];return '<label>'+p[1]+' <input type="range" id="cal-'+p[0]+'" min="'+p[2]+'" max="'+p[3]+'" value="'+v+'"><span id="cal-'+p[0]+'v"></span></label>';}).join('')
    +'<div class="cal-win" id="cal-win"><iframe id="cal-f" title="Form preview"></iframe></div><div class="cal-out">Your setting: <code id="cal-out"></code></div><p>Paste this over the <code>submitButton:</code> line in the drill file.</p></div>';
  document.body.appendChild(d);$('#cal-f').src=sample;
  const upd=()=>{const x=+$('#cal-x').value,y=+$('#cal-y').value,w=+$('#cal-w').value,h=+$('#cal-h').value;
    ['x','y','w','h'].forEach(k=>$('#cal-'+k+'v').textContent=$('#cal-'+k).value);
    $('#cal-win').style.height=h+'px';$('#cal-win').style.width=w+'px';$('#cal-f').style.left=(-x)+'px';$('#cal-f').style.top=(-y)+'px';
    $('#cal-out').textContent='submitButton:{x:'+x+',y:'+y+',width:'+w+',height:'+h+'}';};
  ['x','y','w','h'].forEach(k=>$('#cal-'+k).addEventListener('input',upd));upd();
  let all=false;$('#cal-all').onclick=()=>{all=!all;$('#cal-all').textContent=all?'Back to the button only':'Show the whole form';
    if(all){$('#cal-win').style.height='1600px';$('#cal-win').style.width='528px';$('#cal-f').style.left='0';$('#cal-f').style.top='0';}else upd();};
}
GENS.forEach((g,i)=>S.Q.push(mkQ(i)));
render();
window.__host={S:S,mkQ:mkQ};
})();
