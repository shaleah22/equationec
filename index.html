" ok\":\"\")):dash(fN(redNum())))\n    + '\u003c/span>\u003cspan id=\"slN\" class=\"'+pendCls(simpNumOK(),live)+'\">'\n    + dash(fN(coefIn()))+'\u003c/span>\u003c/span>';\n}\n\n/* the variable term as written.  inline folds its sign in ( \\u22123p );\n   otherwise the sign is left to the caller, which is how 12 \\u2212 3p is set. */\nfunction varTermHTML(inline,marked){\n  const p=S.p, V=p.V, c=kCls();\n  const mk=function(h){return (marked&&c) ? '\u003cspan class=\"'+c+'\">'+h+'\u003c/span>' : h;};\n  if(p.kind===\"wrap\") return dfrac(V+sgnHTML(p.k), mk(String(p.a)));\n  if(p.kind===\"mul\")  return mk(inline?dash(fN(p.a)):String(Math.abs(p.a)))+V;\n  if(p.kind===\"div\")  return dfrac(V, mk(dash(fN(p.a))));\n  const f=(inline&&p.s\u003c0?MINUS:\"\")+dfrac(p.num,p.den);\n  return (marked ? '\u003cspan class=\"'+slashCls()+'\">'+f+'\u003c/span>' : f)+V;\n}\n\n/* the second move, written on both sides of whatever line it lands on */\nfunction coefApply(t,n){\n  const p=S.p, live=coefLive();\n  if(p.kind===\"mul\"){\n    return [dfrac(t, live?boxHTML(\"kA\",S.coefIn,\"\"):markK(p.a), \"grow\"),\n            dfrac(n, live?boxHTML(\"kB\",S.coefIn,\"\"):dash(fN(p.a)), \"grow\")];\n  }\n  if(p.kind===\"frac\"){\n    const vSide = mgroup(live?fracboxHTML(\"nA\",\"dA\"):recipHTML(true), t, true, \"fade\");\n    /* once the coefficient is gone, the number side is a fraction times a number.\n       If they share a factor, cancel it there before multiplying. */\n    const nSide = (canSimp() && at(simpPhase()))\n      ? mgroup(recipCancelHTML(simplifying()), constCancelHTML(simplifying()), true, \"roomy\")\n      : mgroup(live?fracboxHTML(\"nB\",\"dB\"):recipHTML(false), n, true, \"fade\");\n    return [vSide, nSide];\n  }\n  return [mgroup(live?boxHTML(\"kA\",S.coefIn,\"\"):markK(p.a), t, true,  \"fade\"),\n          mgroup(live?boxHTML(\"kB\",S.coefIn,\"\"):dash(fN(p.a)), n, false, \"fade\")];\n}\n\n/* ============ the equation ============ */\nfunction order(t1,t2,eq,n){ return S.p.varLeft ? t1+t2+eq+n : n+eq+t1+t2; }\n\nfunction normalRows(){\n  const p=S.p, rows=[];\n  const EQ=relCell(S.p.rel,false), BLANK=cell(\"\",\"hide\"), NOEQ=cell(\"\",\"\");\n\n  /* line 1 \u2014 the problem as given */\n  const cBlue = S.phase===\"compute1\" ? \"blue\" : \"\";\n  if(p.varFirst){\n    rows.push(order(cell(varTermHTML(true,false)), cell(sgnHTML(p.k),cCls()),\n                    EQ, cell(dash(fN(p.C)),cBlue)));\n  } else {\n    rows.push(order(cell(dash(fN(p.k)),cCls()),\n                    cell('\u003cspan class=\"sgn\">'+(varSign()\u003c0?MINUS:\"+\")+'\u003c/span>'+varTermHTML(false,false)),\n                    EQ, cell(dash(fN(p.C)),cBlue)));\n  }\n\n  /* line 2 \u2014 the same move on both sides */\n  if(at(\"op1\")){\n    const live=S.phase===\"op1\";\n    const g='\u003cspan class=\"sgn\">'+(S.sign\u003c0?MINUS:\"+\")+'\u003c/span>';\n    const vSide = live ? g+boxHTML(\"cA\",S.opIn,\"\") : sgnHTML(-p.k);\n    const nSide = live ? g+boxHTML(\"cB\",S.opIn,\"\") : sgnHTML(-p.k);\n    rows.push(p.varFirst\n      ? order(BLANK, cell(vSide,cCls()+\" blue\"), NOEQ, cell(nSide,\"blue\"))\n      : order(cell(vSide,cCls()+\" blue\"), BLANK, NOEQ, cell(nSide,\"blue\")));\n    if(at(\"cancel1\")) rows.push('\u003cdiv class=\"rule\">\u003c/div>');\n  }\n\n  /* line 3 \u2014 what is left, and then the second move written over it */\n  if(at(\"compute1\")){\n    let v=varTermHTML(true,coefMoved());\n    let n=S.phase===\"compute1\" ? boxHTML(\"mv\",S.mIn,\"\") : dash(fN(p.M));\n    if(coefMoved()){ const r=coefApply(v,n); v=r[0]; n=r[1]; }\n    const nCls = (S.phase===\"compute2\"||simplifying()) ? \"blue\" : \"\";\n    rows.push(p.varFirst ? order(cell(v),BLANK,EQ,cell(n,nCls))\n                         : order(BLANK,cell(v),EQ,cell(n,nCls)));\n  }\n\n  /* line 4 \u2014 the answer */\n  if(at(\"compute2\")){\n    rows.push('\u003cdiv class=\"spacer\">\u003c/div>');\n    const ans = S.phase===\"flip2\" ? dash(fN(p.sol))\n              : S.phase===\"compute2\" ? boxHTML(\"ans\",S.ansIn,\"\")\n              : '\u003cspan class=\"green\">'+dash(fN(p.sol))+'\u003c/span>';\n    const vc = cell('\u003cspan class=\"'+(at(\"solved\")?\"green\":\"\")+'\">'+p.V+'\u003c/span>');\n    const FR = finalRelCell();\n    rows.push(p.varFirst ? order(vc,BLANK,FR,cell(ans)) : order(BLANK,vc,FR,cell(ans)));\n  }\n  rewriteRow(rows);\n  return rows;\n}\n\nfunction wrappedRows(){\n  const p=S.p, rows=[];\n  const EQ=relCell(S.p.rel,false), BLANK=cell(\"\",\"hide\"), NOEQ=cell(\"\",\"\");\n\n  /* line 1 \u2014 the whole side sits over a, so that has to go first */\n  let v=varTermHTML(true,coefMoved()), n=dash(fN(p.C));\n  if(coefMoved()){ const r=coefApply(v,n); v=r[0]; n=r[1]; }\n  const nCls = S.phase===\"compute1\" ? \"blue\" : \"\";\n  rows.push(p.varLeft ? wideCell(v)+EQ+cell(n,nCls) : cell(n,nCls)+EQ+wideCell(v));\n\n  /* line 2 \u2014 now an ordinary one-step problem */\n  if(at(\"compute1\")){\n    rows.push('\u003cdiv class=\"spacer\">\u003c/div>');\n    const mHTML = S.phase===\"compute1\" ? boxHTML(\"mv\",S.mIn,\"\") : dash(fN(p.M));\n    rows.push(order(cell(p.V), cell(sgnHTML(p.k),cCls()), finalRelCell(),\n                    cell(mHTML, S.phase===\"compute2\"?\"blue\":\"\")));\n  }\n\n  /* line 3 \u2014 the same move on both sides */\n  if(at(\"op2\")){\n    const live=S.phase===\"op2\";\n    const g='\u003cspan class=\"sgn\">'+(S.sign\u003c0?MINUS:\"+\")+'\u003c/span>';\n    const vSide = live ? g+boxHTML(\"cA\",S.opIn,\"\") : sgnHTML(-p.k);\n    const nSide = live ? g+boxHTML(\"cB\",S.opIn,\"\") : sgnHTML(-p.k);\n    rows.push(order(BLANK, cell(vSide,cCls()+\" blue\"), NOEQ, cell(nSide,\"blue\")));\n    if(at(\"cancel2\")) rows.push('\u003cdiv class=\"rule\">\u003c/div>');\n  }\n\n  /* line 4 \u2014 the answer */\n  if(at(\"compute2\")){\n    const ans = S.phase===\"compute2\" ? boxHTML(\"ans\",S.ansIn,\"\")\n              : '\u003cspan class=\"green\">'+dash(fN(p.sol))+'\u003c/span>';\n    rows.push(order(cell('\u003cspan class=\"'+(at(\"solved\")?\"green\":\"\")+'\">'+p.V+'\u003c/span>'),\n                    BLANK, finalRelCell(), cell(ans)));\n  }\n  rewriteRow(rows);\n  return rows;\n}\n\n/* the answer came out as  3 \u2264 t : write it again with the variable first.\n   Columns line up as [number][sign][variable], so the new line sits as\n   [variable][sign][number] \u2014 the sign stays in its column, the ends trade places. */\nfunction rewriteRow(rows){\n  const p=S.p;\n  if(p.varLeft || !at(\"rewrite\")) return;\n  rows.push('\u003cdiv class=\"spacer\">\u003c/div>');\n  const done=past(\"rewrite\");\n  const rc = done ? '\u003cdiv class=\"cell\">\u003cspan class=\"rel flipped\">'+RELS[solRel()]+'\u003c/span>\u003c/div>'\n                  : '\u003cdiv class=\"cell\">\u003cspan class=\"relq\">?\u003c/span>\u003c/div>';\n  rows.push(cell('\u003cspan class=\"green\">'+p.V+'\u003c/span>')+rc\n          + cell('\u003cspan class=\"green\">'+dash(fN(p.sol))+'\u003c/span>')+cell(\"\",\"hide\"));\n}\n\nfunction oneRows(){\n  const p=S.p, rows=[];\n  const EQ=relCell(p.rel,false), BLANK=cell(\"\",\"hide\"), NOEQ=cell(\"\",\"\");\n  /* clearing the fractions: the LCD in front of every term, each term multiplied out, then like terms combined */\n  if(SPEC.clr){\n    const c=SPEC.clr, ph=S.phase, n=c.terms.length;\n    rows.push(wideCell(c.orig)+EQ+cell(dash(fN(c.C))));\n    const lcd=function(i){ return ph===\"clrA\"\n      ? (i===0 ? boxHTML(\"rL\",S.rL,\" mini\") : '\u003cspan class=\"box mini mirr\">'+esc(S.rL||\"\")+'\u003c/span>')\n      : '\u003cspan class=\"'+(ph===\"clrB\"?\"blue\":\"\")+'\">'+c.L+'\u003c/span>'; };\n    rows.push(wideCell(c.terms.map(function(t,i){ return (i?' + ':'')+lcd(i)+'('+t.h+')'; }).join(\"\"))+EQ+cell(lcd(n)+'('+dash(fN(c.C))+')'));\n    if(ph===\"clrA\") return rows;\n    const res=function(i){ const w=i\u003cn ? c.terms[i].w : String(c.Cw);\n      return ph===\"clrB\" ? boxHTML(\"r\"+i,S.r[i]||\"\",\" mini\"+(clrGood(i,S.r[i])?\" ok\":\"\")) : '\u003cspan class=\"'+(ph===\"clrC\"?\"\":\"\")+'\">'+dash(w)+'\u003c/span>'; };\n    rows.push(wideCell(c.terms.map(function(t,i){ return (i?' + ':'')+res(i); }).join(\"\"))+EQ+cell(res(n)));\n    if(ph===\"clrB\") return rows;\n    if(ph===\"clrC\"){ rows.push(wideCell(boxHTML(\"rK\",S.rK,\" mini\"))+EQ+cell(dash(fN(c.Cw)))); return rows; }\n  }\n  if(SPEC.comb){\n    rows.push(wideCell(SPEC.comb.orig)+EQ+cell(dash(fN(p.C))));\n    if(S.phase===\"comb\"){\n      const ok=combOK(), cls=\" mini\"+(ok?\" ok\":\"\");\n      rows.push(wideCell('\u003cspan class=\"fracbox\">'+boxHTML(\"cN\",S.cN,cls)+'\u003cspan class=\"bar\">\u003c/span>'+boxHTML(\"cD\",S.cD,cls)+'\u003c/span>'+p.V)+EQ+cell(dash(fN(p.C))));\n      return rows;\n    }\n  }\n  const ansHTML = S.phase===\"flip2\" ? dash(fN(p.sol))\n                : S.phase===\"compute2\" ? boxHTML(\"ans\",S.ansIn,\"\")\n                : '\u003cspan class=\"green\">'+dash(fN(p.sol))+'\u003c/span>';\n  const vc = cell('\u003cspan class=\"'+(at(\"solved\")?\"green\":\"\")+'\">'+p.V+'\u003c/span>');\n  if(p.one===\"const\"){\n    const cBlue = S.phase===\"compute2\" ? \"blue\" : \"\";\n    rows.push(p.varFirst\n      ? order(cell(p.V), cell(sgnHTML(p.k),cCls()), EQ, cell(dash(fN(p.C)),cBlue))\n      : order(cell(dash(fN(p.k)),cCls()), cell('\u003cspan class=\"sgn\">+\u003c/span>'+p.V), EQ, cell(dash(fN(p.C)),cBlue)));\n    if(at(\"op2\")){\n      const live=S.phase===\"op2\";\n      const g='\u003cspan class=\"sgn\">'+(S.sign\u003c0?MINUS:\"+\")+'\u003c/span>';\n      const vSide = live ? g+boxHTML(\"cA\",S.opIn,\"\") : sgnHTML(-p.k);\n      const nSide = live ? g+boxHTML(\"cB\",S.opIn,\"\") : sgnHTML(-p.k);\n      rows.push(p.varFirst ? order(BLANK, cell(vSide,cCls()+\" blue\"), NOEQ, cell(nSide,\"blue\"))\n                           : order(cell(vSide,cCls()+\" blue\"), BLANK, NOEQ, cell(nSide,\"blue\")));\n      if(at(\"cancel2\")) rows.push('\u003cdiv class=\"rule\">\u003c/div>');\n    }\n    if(at(\"compute2\")){\n      rows.push(p.varFirst ? order(vc,BLANK,finalRelCell(),cell(ansHTML))\n                           : order(BLANK,vc,finalRelCell(),cell(ansHTML)));\n    }\n  } else {\n    let v=varTermHTML(true,coefMoved()), n=dash(fN(p.C));\n    if(coefMoved()){ const r=coefApply(v,n); v=r[0]; n=r[1]; }\n    const nCls = (S.phase===\"compute2\"||simplifying()) ? \"blue\" : \"\";\n    rows.push(p.varLeft ? wideCell(v)+EQ+cell(n,nCls) : cell(n,nCls)+EQ+wideCell(v));\n    if(at(\"compute2\")){\n      rows.push('\u003cdiv class=\"spacer\">\u003c/div>');\n      rows.push(order(vc,BLANK,finalRelCell(),cell(ansHTML)));\n    }\n  }\n  rewriteRow(rows);\n  return rows;\n}\nfunction rowsFor(){ return S.p.one ? oneRows() : S.p.wrapped ? wrappedRows() : normalRows(); }\n\nfunction renderEquation(){\n  document.getElementById(\"eq\").innerHTML = rowsFor().join(\"\");\n}\n\n/* ============ the panel ============ */\nfunction sideHTML(inner){                        /* the variable side, with `inner` for V */\n  const p=S.p;\n  if(p.one===\"const\") return p.varFirst ? inner+' '+sgnHTML(p.k)\n                                        : dash(fN(p.k))+' \u003cspan class=\"sgn\">+\u003c/span>'+inner;\n  if(p.one===\"coef\"){\n    if(p.kind===\"mul\") return dash(fN(p.a))+inner;\n    if(p.kind===\"div\") return dfrac(inner,dash(fN(p.a)));\n    return (p.s\u003c0?MINUS:\"\")+dfrac(p.num,p.den)+inner;\n  }\n  if(p.kind===\"wrap\") return dfrac(inner+sgnHTML(p.k), String(p.a));\n  if(p.varFirst){\n    const t = p.kind===\"mul\" ? dash(fN(p.a))+inner\n            : p.kind===\"div\" ? dfrac(inner,dash(fN(p.a)))\n            : (p.s\u003c0?MINUS:\"\")+dfrac(p.num,p.den)+inner;\n    return t+' '+sgnHTML(p.k);\n  }\n  const t = p.kind===\"mul\" ? String(Math.abs(p.a))+inner\n          : p.kind===\"div\" ? dfrac(inner,dash(fN(p.a)))\n          : dfrac(p.num,p.den)+inner;\n  return dash(fN(p.k))+' \u003cspan class=\"sgn\">'+(varSign()\u003c0?MINUS:\"+\")+'\u003c/span>'+t;\n}\n/* a number from the shaded part, picked so every step of the check is a whole number */\nfunction testVal(){\n  const p=S.p, dir=goesRight()?1:-1;\n  const step = p.kind===\"div\" ? Math.abs(p.a) : p.kind===\"frac\" ? p.den : p.kind===\"wrap\" ? p.a : 2;\n  return p.sol+dir*step;\n}\nfunction sideVal(x){\n  const p=S.p;\n  if(p.kind===\"add\") return x+p.k;\n  if(p.kind===\"wrap\") return (x+p.k)/p.a;\n  if(p.kind===\"mul\")  return p.a*x+p.k;\n  if(p.kind===\"div\")  return x/p.a+p.k;\n  return p.s*p.num*x/p.den+p.k;\n}\nfunction checkLineHTML(){\n  const p=S.p, t=testVal();\n  const inner='\u003cspan class=\"paren\">(\u003c/span>\u003cspan class=\"green\">'+dash(fN(t))+'\u003c/span>\u003cspan class=\"paren\">)\u003c/span>';\n  const C=dash(fN(p.C)), r=' \u003cspan class=\"rel\">'+RELS[p.rel]+'\u003c/span> ';\n  const sv=sideHTML(inner), val=dash(fN(sideVal(t)));\n  const ok='\u003cspan class=\"truth\">&#10003; true\u003c/span>';\n  return '\u003cdiv class=\"checkline\">\u003cdiv class=\"orig\">'\n    + (p.varLeft ? sv+r+C : C+r+sv) + '\u003c/div>\u003cdiv class=\"sub\">'\n    + (p.varLeft ? val+r+C : C+r+val) + ok + '\u003c/div>\u003c/div>';\n}\n\n/* ---- the number line ---- */\nfunction numlineHTML(){\n  const p=S.p, W=470, L=30, Rt=W-30, lo=p.sol-5, Y=26;\n  const X=function(v){return +(L+(v-lo)*(Rt-L)/10).toFixed(1);};\n  let g='\u003cline class=\"nl-axis\" x1=\"8\" y1=\"'+Y+'\" x2=\"'+(W-8)+'\" y2=\"'+Y+'\"/>'\n    + '\u003cpolygon class=\"nl-head\" points=\"0,'+Y+' 11,'+(Y-6)+' 11,'+(Y+6)+'\"/>'\n    + '\u003cpolygon class=\"nl-head\" points=\"'+W+','+Y+' '+(W-11)+','+(Y-6)+' '+(W-11)+','+(Y+6)+'\"/>';\n  for(let i=0;i\u003c=10;i++){\n    const v=lo+i, x=X(v);\n    g+='\u003cline class=\"nl-tick\" x1=\"'+x+'\" y1=\"'+(Y-7)+'\" x2=\"'+x+'\" y2=\"'+(Y+7)+'\"/>'\n     + '\u003ctext class=\"nl-lbl'+(v===p.sol?' key':'')+'\" x=\"'+x+'\" y=\"'+(Y+27)+'\">'+dash(fN(v))+'\u003c/text>';\n  }\n  const x0=X(p.sol);\n  if(past(\"arrow\")){\n    const right=goesRight(), tip=right?W-2:2, end=right?tip-14:tip+14;\n    g+='\u003cline class=\"nl-ray\" x1=\"'+x0+'\" y1=\"'+Y+'\" x2=\"'+end+'\" y2=\"'+Y+'\"/>'\n     + '\u003cpolygon class=\"nl-rayhead\" points=\"'+tip+','+Y+' '+end+','+(Y-10)+' '+end+','+(Y+10)+'\"/>';\n  }\n  if(S.phase===\"check\"){\n    const t=testVal();\n    if(Math.abs(t-p.sol)\u003c=5){\n      g+='\u003ccircle class=\"nl-test\" cx=\"'+X(t)+'\" cy=\"'+Y+'\" r=\"4.5\"/>'\n       + '\u003ctext class=\"nl-testlbl\" x=\"'+X(t)+'\" y=\"'+(Y-13)+'\">test\u003c/text>';\n    }\n  }\n  if(past(\"dot\")) g+='\u003ccircle class=\"nl-dot '+(isClosed()?'closed':'open')+'\" cx=\"'+x0+'\" cy=\"'+Y+'\" r=\"8.5\"/>';\n  else if(S.phase===\"dot\") g+='\u003ccircle class=\"nl-ghost\" cx=\"'+x0+'\" cy=\"'+Y+'\" r=\"10\"/>';\n  return '\u003cdiv class=\"nlwrap\">\u003csvg class=\"numline\" width=\"'+W+'\" height=\"64\" viewBox=\"0 -2 '+W+' 64\" '\n       + 'role=\"img\" aria-label=\"Number line centred on '+p.sol+'\">'+g+'\u003c/svg>\u003c/div>';\n}\n\n/* ---- choices that aren't one of the four moves ---- */\nconst IC_OPEN ='\u003csvg width=\"30\" height=\"30\" viewBox=\"0 0 30 30\">\u003ccircle class=\"ic\" cx=\"15\" cy=\"15\" r=\"9\"/>\u003c/svg>';\nconst IC_SHUT ='\u003csvg width=\"30\" height=\"30\" viewBox=\"0 0 30 30\">\u003ccircle class=\"ic fill\" cx=\"15\" cy=\"15\" r=\"9\"/>\u003c/svg>';\nconst IC_LEFT ='\u003csvg width=\"44\" height=\"28\" viewBox=\"0 0 44 28\">\u003cpath class=\"ic\" d=\"M40 14H6M15 5l-9 9 9 9\"/>\u003c/svg>';\nconst IC_RIGHT='\u003csvg width=\"44\" height=\"28\" viewBox=\"0 0 44 28\">\u003cpath class=\"ic\" d=\"M4 14h34M29 5l9 9-9 9\"/>\u003c/svg>';\nfunction choices(){\n  const sub=subName(), r=S.p.rel;\n  if(S.phase===\"rewrite\") return [\n    [\"chSame\",RELS[relF()],\"Same sign\",\"Keep the same sign\",\"same\"],\n    [\"chTurn\",RELS[FLIPR[relF()]],\"Turned around\",\"Turn the sign around\",\"turn\"]];\n  if(sub===\"flip\") return [\n    [\"chKeep\",RELS[r],\"Keep it\",\"Keep the sign the same\",\"keep\"],\n    [\"chFlip\",RELS[FLIPR[r]],\"Flip it\",\"Flip the sign\",\"flip\"]];\n  if(S.phase===\"dot\") return [\n    [\"chOpen\",IC_OPEN,\"Open\",\"Open dot: the number is not included\",\"open\"],\n    [\"chShut\",IC_SHUT,\"Closed\",\"Closed dot: the number is included\",\"closed\"]];\n  if(S.phase===\"arrow\") return [\n    [\"chLeft\",IC_LEFT,\"Smaller\",\"Shade to the left\",\"left\"],\n    [\"chRight\",IC_RIGHT,\"Bigger\",\"Shade to the right\",\"right\"]];\n  return null;\n}\nfunction panelHTML(){\n  const sub=subName(), wrap=function(h){\n    return '\u003cdiv style=\"display:flex;flex-direction:column;align-items:center;gap:16px\">'+h+'\u003c/div>';};\n  if(sub===\"pick\"||sub===\"flip\"||S.phase===\"rewrite\") return \"\";\n  if(S.phase===\"dot\"||S.phase===\"arrow\") return wrap(numlineHTML());\n  if(S.phase===\"check\") return wrap(numlineHTML()+checkLineHTML()+lettersHTML());\n  return \"\";\n}\n/* the choices themselves go in the key guide at the side of the screen */\nfunction lettersHTML(){\n  const L=SPEC.letters;\n  if(!L) return '\u003cbutton class=\"next\" id=\"nextBtn\">Next &rarr;\u003c/button>';\n  const txt=!L[0].svg;\n  if(S.letterDone){\n    const i=L.findIndex(function(o){return o.ok;});\n    return '\u003cdiv class=\"ltwrap\">\u003cdiv class=\"ltdone\">&#10003; '+\"ABCDEFGH\"[i]+' matches. '+(SPEC.answer||'')+'\u003c/div>\u003cbutton class=\"next\" id=\"nextBtn\">Next &rarr;\u003c/button>\u003c/div>';\n  }\n  return '\u003cdiv class=\"ltwrap\">\u003cdiv class=\"ltlead\">'+(SPEC.letterPrompt||'Which one matches? Type the letter.')+'\u003c/div>\u003cdiv class=\"ltopts'+(txt?' txt':'')+'\">'\n    + L.map(function(o,i){ const w=S.ltWrong.indexOf(i)>=0;\n      return '\u003cbutton type=\"button\" class=\"ltopt'+(w?' wrong':'')+'\" id=\"lt'+i+'\" data-v=\"lt'+i+'\"'+(w?' disabled':'')+'>\u003cb>'+\"ABCDEFGH\"[i]+'\u003c/b>'+(o.svg||o.t)+'\u003c/button>'; }).join('')\n    + '\u003c/div>\u003c/div>';\n}\nfunction chooseLetter(i,btn){\n  if(S.letterDone||S.phase!==\"check\") return;\n  const o=SPEC.letters[i]; if(!o||S.ltWrong.indexOf(i)>=0) return;\n  if(o.ok){ S.letterDone=true; S.miss=\"\"; POST({done:1,clean:!!S.clean}); renderPanel(); renderPrompt(); attach(); Shell.applyScale();\n    later(60,function(){ const n=document.getElementById(\"nextBtn\"); if(n) n.focus(); }); return; }\n  S.ltWrong.push(i); Shell.shake(btn); flagMiss(o.why||'Not that one.'); renderPanel(); attach();\n}\n/* clearing the fractions */\nfunction clrTerm(raw){\n  const V=S.p.V, s=String(raw||\"\").trim().replace(/[\\u2212\\u2013\\u2014]/g,\"-\").replace(/\\s+/g,\"\").toLowerCase();\n  const m=s.match(new RegExp(\"^([+-]?)(\\\\d*)\"+V.toLowerCase()+\"$\")); if(!m) return null;\n  return (m[1]===\"-\"?-1:1)*(m[2]===\"\"?1:+m[2]);\n}\nfunction clrGood(i,raw){\n  const c=SPEC.clr;\n  if(i\u003cc.terms.length){ const w=clrTerm(c.terms[i].w), v=clrTerm(raw); return v!==null && v===w; }\n  const v=parseInt2(raw); return v!==null && near(v,c.Cw);\n}\nfunction onClrL(e){\n  S.rL=e.target.value;\n  document.querySelectorAll(\".mirr\").forEach(function(m){ m.textContent=S.rL; });\n  clearTimers();\n  if(parseInt2(S.rL)===SPEC.clr.L){ e.target.classList.add(\"ok\"); document.querySelectorAll(\".mirr\").forEach(function(m){ m.classList.add(\"ok\"); });\n    later(350,function(){ S.hint=false; setPhase(\"clrB\"); }); }\n}\nlet clrT=null;\nfunction onClrR(e){\n  const id=e.target.id, i=+id.slice(1), n=SPEC.clr.terms.length;\n  S.r[i]=e.target.value; e.target.classList.toggle(\"ok\",clrGood(i,S.r[i]));\n  clearTimers(); clearTimeout(clrT);\n  if(clrGood(i,S.r[i])){\n    let all=true; for(let j=0;j\u003c=n;j++) if(!clrGood(j,S.r[j])) all=false;\n    if(all){ later(350,function(){ S.hint=false; setPhase(\"clrC\"); }); return; }\n    for(let j=0;j\u003c=n;j++) if(!clrGood(j,S.r[j])){ const b=document.getElementById(\"r\"+j); if(b){ b.focus(); } break; }\n    return;\n  }\n  clrT=setTimeout(function(){ clrWrong(e.target, i\u003cn ? SPEC.clr.terms[i].w : String(SPEC.clr.Cw)); },1100);\n}\nfunction onClrK(e){\n  S.rK=e.target.value; clearTimers(); clearTimeout(clrT);\n  const v=clrTerm(S.rK);\n  if(v!==null && v===SPEC.clr.K){ e.target.classList.add(\"ok\"); later(350,function(){ S.hint=false; setPhase(\"pick2\"); }); return; }\n  clrT=setTimeout(function(){ clrWrong(e.target, SPEC.clr.K+S.p.V); },1100);\n}\nfunction clrWrong(box,want){\n  const raw=String(box.value).trim().replace(/[\\u2212\\u2013\\u2014]/g,\"-\").replace(/\\s+/g,\"\");\n  if(!raw || box.classList.contains(\"ok\") || String(want).indexOf(raw)===0) return;\n  box.classList.remove(\"bad\"); void box.offsetWidth; box.classList.add(\"bad\");\n  const c=SPEC.clr;\n  flagMiss('\u003cstrong>Not quite.\u003c/strong> '+(S.phase===\"clrB\" ? c.how2 : c.how3));\n}\nfunction combOK(){ const n=parseInt2(S.cN), d=parseInt2(S.cD); return n!==null&&d!==null&&n===S.p.num&&d===S.p.den; }\nfunction onComb(e){\n  S[e.target.id]=e.target.value;\n  const ok=combOK();\n  [\"cN\",\"cD\"].forEach(function(id){ const b=document.getElementById(id); if(b) b.className=\"box mini\"+(ok?\" ok\":\"\"); });\n  clearTimers();\n  if(e.target.id===\"cN\" && parseInt2(S.cN)===S.p.num && parseInt2(S.cD)===null){ const d=document.getElementById(\"cD\"); if(d) d.focus(); }\n  if(ok) later(350,function(){ S.hint=false; setPhase(\"pick2\"); });\n}\nfunction guideHTML(){\n  if(/^clr/.test(S.phase)) return '\u003cdiv class=\"kg-lead\">Clear the fractions first\u003c/div>\u003cdiv class=\"gitem\">\u003cspan class=\"what\">Multiply every term on both sides by the LCD, so there are no fractions left.\u003c/span>\u003c/div>';\n  if(S.phase===\"comb\") return '\u003cdiv class=\"kg-lead\">Combine like terms first\u003c/div>\u003cdiv class=\"gitem\">\u003cspan class=\"what\">'+SPEC.comb.lead+'\u003c/span>\u003c/div>';\n  if(S.phase===\"check\" && SPEC.letters && !S.letterDone) return '\u003cdiv class=\"kg-lead\">'+(SPEC.letters.length\u003c=4?'Type A, B, C or D':'Click the matching answer')+'\u003c/div>';\n  if(subName()===\"pick\") return Shell.opsHTML();\n  const cl=choices();\n  return cl ? Shell.choicesHTML(cl) : \"\";\n}\nfunction renderPanel(){\n  document.getElementById(\"panel\").innerHTML=panelHTML();\n  document.getElementById(\"keyguide\").innerHTML=guideHTML();\n}\n\nfunction choose(v,btn){\n  if(/^lt\\d$/.test(v)){ chooseLetter(+v.slice(2),btn); return; }\n  const p=S.p, V=p.V, sol=dash(fN(p.sol)), sr=RELS[solRel()];\n  if(subName()===\"flip\"){\n    const m=multDesc();\n    if(v===(flips()?\"flip\":\"keep\")){ S.hint=false; finish(); return; }\n    Shell.shake(btn);\n    if(m.plain){\n      flagMiss('This time you only '+(p.k>0?'subtracted':'added')+'. Adding or subtracting never changes the sign &mdash; keep it.');\n      return;\n    }\n    flagMiss(v===\"keep\"\n      ? 'It has to flip, because '+m.by+' is a negative number. Multiplying or dividing by a negative '\n        + 'reverses which side is bigger.'\n      : m.by+' is positive, so which side is bigger does not change. Only a negative flips the sign.');\n    return;\n  }\n  if(S.phase===\"rewrite\"){\n    if(v===\"turn\"){ S.hint=false; setPhase(\"dot\"); return; }\n    Shell.shake(btn);\n    flagMiss('Read it out loud: &ldquo;'+sol+' is '+relWords(relF())+' '+V+'.&rdquo; Said from '+V+'\\'s side, '\n      + V+' is '+relWords(solRel())+' '+sol+'. Swapping the sides turns the sign around.');\n    return;\n  }\n  if(S.phase===\"dot\"){\n    if(v===(isClosed()?\"closed\":\"open\")){ S.hint=false; setPhase(\"arrow\"); return; }\n    Shell.shake(btn);\n    flagMiss(v===\"open\"\n      ? 'The line under '+sr+' means &ldquo;or equal to&rdquo;, so '+sol+' itself is a solution &mdash; fill the dot in.'\n      : sr+' has no &ldquo;or equal&rdquo; line, so '+sol+' itself does not work &mdash; leave the dot hollow.');\n    return;\n  }\n  if(S.phase===\"arrow\"){\n    if(v===(goesRight()?\"right\":\"left\")){ S.hint=false; Shell.solved(S.clean,plainText()); setPhase(\"check\");\n      if(!SPEC.letters) POST({done:1,clean:!!S.clean});   /* no letter to pick: the graph finishes it */\n      return; }\n    const tryN=dash(fN(p.sol+(v===\"right\"?3:-3)));\n    Shell.shake(btn);\n    flagMiss('Try a number on that side, like '+tryN+'. Is '+V+' '+sr+' '+sol+' true when '+V+' = '+tryN+'? No &mdash; so the solutions are the other way.');\n  }\n}\n\n/* ============ the prompt ============ */\nconst KEYTIP={add:'press \u003cstrong>A\u003c/strong> to add', sub:'press \u003cstrong>S\u003c/strong> to subtract',\n              multiply:'press \u003cstrong>M\u003c/strong> to multiply', divide:'press \u003cstrong>D\u003c/strong> to divide'};\nfunction pickHint(konst){\n  const p=S.p, V=p.V;\n  if(p.one===\"const\") return Math.abs(p.k)+' is '+(p.k\u003c0?\"subtracted\":\"added\")+' on that side, so '\n    + KEYTIP[p.k\u003c0?\"add\":\"sub\"]+'.';\n  if(konst){\n    if(p.wrapped) return 'The fraction is gone, so this is an ordinary one-step problem now. '\n      + Math.abs(p.k)+' is '+(p.k\u003c0?\"subtracted\":\"added\")+', so '+KEYTIP[p.k\u003c0?\"add\":\"sub\"]+'.';\n    return Math.abs(p.k)+' is '+(p.k\u003c0?\"subtracted\":\"added\")+' on that side. Clear the loose number '\n      + 'first &mdash; '+KEYTIP[p.k\u003c0?\"add\":\"sub\"]+'. Whatever is attached to '+V+' comes off last.';\n  }\n  if(p.wrapped) return 'The \u003cstrong>whole\u003c/strong> side is divided by '+p.a+', the '+Math.abs(p.k)\n    + ' included, so you cannot take that off yet. Clear the denominator first &mdash; '+KEYTIP.multiply+'.';\n  if(p.kind===\"mul\") return V+' is multiplied by '+dash(fN(p.a))\n    + '. Division undoes multiplication &mdash; '+KEYTIP.divide+'.';\n  if(p.kind===\"frac\") return V+' is multiplied by a fraction. A fraction times its reciprocal is 1, '\n    + 'so multiply both sides &mdash; '+KEYTIP.multiply+'.';\n  return V+' is divided by '+dash(fN(p.a))+'. Multiplication undoes division &mdash; '+KEYTIP.multiply+'.';\n}\n\nfunction renderPrompt(){\n  const el=document.getElementById(\"promptbar\"), p=S.p, V=p.V;\n  const hintBtn='\u003cbutton class=\"link\" id=\"hintBtn\">'+(S.hint?\"Hide hint\":\"Hint\")+'\u003c/button>';\n  const sub=subName(), step=stepNo(), konst=isConst();\n  let h=\"\";\n\n  if(S.phase===\"clrA\"){\n    h='\u003cdiv class=\"prompt\">\u003cspan>Clear the fractions. Multiply \u003cstrong>every term\u003c/strong> by the LCD of the bottom numbers. Type it in front of the first term and it fills in for all of them.\u003c/span>'+hintBtn;\n    if(S.hint) h+='\u003cdiv class=\"hintline\">'+SPEC.clr.how1+'\u003c/div>';\n    h+='\u003c/div>';\n  }\n  else if(S.phase===\"clrB\"){\n    h='\u003cdiv class=\"prompt\">\u003cspan>Multiply each term by '+SPEC.clr.L+'. Cancel the bottom number first. Type the whole term, with the '+V+'.\u003c/span>'+hintBtn;\n    if(S.hint) h+='\u003cdiv class=\"hintline\">'+SPEC.clr.how2+'\u003c/div>';\n    h+='\u003c/div>';\n  }\n  else if(S.phase===\"clrC\"){\n    h='\u003cdiv class=\"prompt\">\u003cspan>Combine like terms on the left. Type the '+V+' term.\u003c/span>'+hintBtn;\n    if(S.hint) h+='\u003cdiv class=\"hintline\">'+SPEC.clr.how3+'\u003c/div>';\n    h+='\u003c/div>';\n  }\n  else if(S.phase===\"comb\"){\n    h='\u003cdiv class=\"prompt\">\u003cspan>Combine like terms. Add the fractions in front of '+V+'.\u003c/span>'+hintBtn;\n    if(S.hint) h+='\u003cdiv class=\"hintline\">'+SPEC.comb.how+'\u003c/div>';\n    h+='\u003c/div>';\n  }\n  else if(sub===\"pick\"){\n    h='\u003cdiv class=\"prompt\">\u003cspan>'+(step===1\n        ? 'This one takes \u003cstrong>two moves\u003c/strong>. What do you do to both sides first?'\n        : 'One move left. What do you do to both sides to get '+V+' alone?')+'\u003c/span>'+hintBtn;\n    if(S.hint) h+='\u003cdiv class=\"hintline\">'+pickHint(konst)+'\u003c/div>';\n    h+='\u003c/div>';\n  }\n  else if(sub===\"op\"){\n    if(konst){\n      h='\u003cdiv class=\"prompt\">\u003cspan>Type how much you '+(S.sign\u003c0?\"subtract from\":\"add to\")+' both sides.\u003c/span>'+hintBtn;\n      if(S.hint) h+='\u003cdiv class=\"hintline\">Use '+Math.abs(p.k)+' &mdash; that is exactly what cancels '\n        + dash(fN(p.k))+' out.\u003c/div>';\n    } else if(p.kind===\"mul\"){\n      h='\u003cdiv class=\"prompt\">\u003cspan>Divide both sides by the number multiplying '+V+'.\u003c/span>'+hintBtn;\n      if(S.hint) h+='\u003cdiv class=\"hintline\">Write '+dash(fN(p.a))+' under each side &mdash; sign and all.\u003c/div>';\n    } else if(p.kind===\"frac\"){\n      h='\u003cdiv class=\"prompt\">\u003cspan>Multiply both sides by the reciprocal of\u003c/span>'\n        + '\u003cspan class=\"math\">'+coefFracHTML()+'\u003c/span>'+hintBtn;\n      if(S.hint) h+='\u003cdiv class=\"hintline\">Flip it over: '+p.den+' on top, '+p.num+' on the bottom. '\n        + (p.s\u003c0 ? 'The coefficient is negative, so the reciprocal is negative too &mdash; type the sign on top.'\n                 : 'The coefficient is positive, so the reciprocal is positive.')+'\u003c/div>';\n    } else {\n      h='\u003cdiv class=\"prompt\">\u003cspan>Multiply both sides by the number underneath '+V+'.\u003c/span>'+hintBtn;\n      if(S.hint) h+='\u003cdiv class=\"hintline\">Write '+dash(fN(p.a))\n        + ' outside each set of parentheses &mdash; sign and all.\u003c/div>';\n    }\n    h+='\u003c/div>';\n  }\n  else if(sub===\"cancel\"){\n    if(konst){\n      h='\u003cdiv class=\"prompt\">\u003cspan class=\"math\">'+dash(fN(p.k))+'\u003c/span>\u003cspan>and\u003c/span>'\n        + '\u003cspan class=\"math\">'+sgnHTML(-p.k)+'\u003c/span>\u003cspan>make zero, so they cancel'\n        + (p.wrapped?'':' &mdash; leaving the '+V+' term by itself')+'.\u003c/span>\u003c/div>';\n    } else if(p.kind===\"frac\"){\n      h='\u003cdiv class=\"prompt\">\u003cspan class=\"math\">'+recipHTML(false)+'\u003c/span>\u003cspan>'+TIMES+'\u003c/span>'\n        + '\u003cspan class=\"math\">'+coefFracHTML()+'\u003c/span>'\n        + '\u003cspan>makes 1, so the coefficient is gone &mdash; leaving '+V+' alone.\u003c/span>\u003c/div>';\n    } else {\n      h='\u003cdiv class=\"prompt\">\u003cspan class=\"math\">'+dash(fN(p.a))+'\u003c/span>\u003cspan>over\u003c/span>'\n        + '\u003cspan class=\"math\">'+dash(fN(p.a))+'\u003c/span>'\n        + '\u003cspan>makes 1, so they cancel &mdash; leaving '+V+(p.wrapped?' and the '+Math.abs(p.k):'')\n        + ' free of the fraction.\u003c/span>\u003c/div>';\n    }\n  }\n  else if(sub===\"flip\"){\n    const m=multDesc();\n    h='\u003cdiv class=\"prompt\">\u003cspan>You '+m.verb+' both sides by \u003cspan class=\"math\">'+m.by+'\u003c/span>. '\n      + 'Does the \u003cspan class=\"math rel\">'+RELS[p.rel]+'\u003c/span> sign stay the same, or flip?\u003c/span>'+hintBtn;\n    if(S.hint) h+='\u003cdiv class=\"hintline\">Adding and subtracting never change the sign. Multiplying or dividing by a '\n      + '\u003cstrong>negative\u003c/strong> reverses the order: 2 &lt; 3, but &minus;2 &gt; &minus;3. A positive number leaves it alone.\u003c/div>';\n    h+='\u003c/div>';\n  }\n  else if(S.phase===\"rewrite\"){\n    const sol=dash(fN(p.sol));\n    h='\u003cdiv class=\"prompt\">\u003cspan>Put \u003cspan class=\"math\">'+p.V+'\u003c/span> on the left before graphing. '\n      + 'Swap the two sides &mdash; which sign goes between \u003cspan class=\"math\">'+p.V+'\u003c/span> and \u003cspan class=\"math\">'+sol+'\u003c/span>?\u003c/span>'+hintBtn;\n    if(S.hint) h+='\u003cdiv class=\"hintline\">The sign always opens toward the bigger side. If the sides trade places, '\n      + 'the sign has to turn around with them: '+sol+' '+RELS[relF()]+' '+p.V+' is the same as '\n      + p.V+' '+RELS[solRel()]+' '+sol+'.\u003c/div>';\n    h+='\u003c/div>';\n  }\n  else if(S.phase===\"dot\"||S.phase===\"arrow\"){\n    const sol=dash(fN(p.sol)), rd='\u003cspan class=\"math\">'+V+' '+RELS[solRel()]+' '+sol+'\u003c/span>';\n    const same = '';\n    if(S.phase===\"dot\"){\n      h='\u003cdiv class=\"prompt\">\u003cspan>Now graph '+rd+'.\u003c/span>'+same+'\u003cspan>Open or closed dot at '+sol+'?\u003c/span>'+hintBtn;\n      if(S.hint) h+='\u003cdiv class=\"hintline\">&lt; and &gt; leave the number itself out, so the dot is hollow. '\n        + '&le; and &ge; include it, so the dot is filled in.\u003c/div>';\n    } else {\n      h='\u003cdiv class=\"prompt\">\u003cspan>Which numbers make '+rd+' true &mdash; the smaller ones or the bigger ones?\u003c/span>'+hintBtn;\n      if(S.hint) h+='\u003cdiv class=\"hintline\">Read it out loud: &ldquo;'+V+' is '\n        + (goesRight()?'greater':'less')+' than'+(isClosed()?' or equal to':'')+' '+sol+'.&rdquo; '\n        + (goesRight()?'Bigger numbers are to the right.':'Smaller numbers are to the left.')+'\u003c/div>';\n    }\n    h+='\u003c/div>';\n  }\n  else if(sub===\"simplify\"){\n    const M=coefIn(), g=gFac();\n    h='\u003cdiv class=\"prompt\">\u003cspan>\u003cstrong>Simplify before you multiply.\u003c/strong> '\n      + p.num+' and '+Math.abs(M)+' share a factor &mdash; divide them both by it.\u003c/span>'+hintBtn;\n    if(S.hint) h+='\u003cdiv class=\"hintline\">\u003cspan>'+p.num+' &divide; '+g+' = '+redDen()+', and '\n      + Math.abs(M)+' &divide; '+g+' = '+Math.abs(redNum())+'.'\n      + (M\u003c0?' The number stays negative.':'')\n      + (redDen()>1?' They don\\'t cancel all the way, so '+redDen()+' is left underneath.':'')\n      + '\u003c/span>\u003c/div>';\n    if(simpPartial()) h+='\u003cdiv class=\"noteline\">That is a common factor, but not the biggest one '\n      + '&mdash; those two can still be cancelled further.\u003c/div>';\n    h+='\u003c/div>';\n  }\n  else if(sub===\"compute\"){\n    if(konst){\n      h='\u003cdiv class=\"prompt\">\u003cspan>Combine the blue side:\u003c/span>\u003cspan class=\"math blue\">'\n        + dash(fN(constIn()))+' '+sgnHTML(-p.k)+'\u003c/span>'+hintBtn;\n      if(S.hint) h+='\u003cdiv class=\"hintline\">'+(p.k>0\n        ? 'Taking '+Math.abs(p.k)+' away moves down the number line.'\n        : 'Adding '+Math.abs(p.k)+' moves up the number line.')+'\u003c/div>';\n    } else {\n      const M=coefIn(), Md=dash(fN(M));\n      /* after cancelling, the numbers on the page are the small ones */\n      const cut = (p.s\u003c0?MINUS:\"\")+(redDen()>1?dfrac(p.den,redDen()):String(p.den))\n                + ' '+TIMES+' '+dash(fN(redNum()));\n      const expr = p.kind===\"mul\"  ? Md+' '+DIV+' '+dash(fN(p.a))\n                 : p.kind===\"frac\" ? (canSimp() ? cut : recipHTML(false)+' '+TIMES+' '+Md)\n                                   : dash(fN(p.a))+' '+TIMES+' '+Md;\n      h='\u003cdiv class=\"prompt\">\u003cspan>Now finish the other side:\u003c/span>'\n        + '\u003cspan class=\"math blue\">'+expr+'\u003c/span>'+hintBtn;\n      if(S.hint){\n        const diff = p.kind===\"frac\" ? ((p.s\u003c0)!==(M\u003c0)) : ((p.a\u003c0)!==(M\u003c0));\n        h+='\u003cdiv class=\"hintline\">'+(p.kind===\"mul\"\n            ? 'How many '+Math.abs(p.a)+'s fit into '+Math.abs(M)+'? '\n            : p.kind===\"frac\"\n              ? (canSimp()\n                  ? 'Because you cancelled first these are small numbers: '\n                    + p.den+' '+TIMES+' '+Math.abs(redNum())\n                    + (redDen()>1?', over '+redDen():'')+'. '\n                  : Math.abs(M)+' &divide; '+p.num+' = '+(Math.abs(M)/p.num)+', then '+TIMES+' '+p.den+'. ')\n              : Math.abs(p.a)+' groups of '+Math.abs(M)+'. ')\n          + (diff ? 'One number is negative, so the answer is negative.'\n                  : 'Both signs match, so the answer is positive.')+'\u003c/div>';\n      }\n    }\n    h+='\u003c/div>';\n  }\n  else if(S.phase===\"solved\"){\n    const asIs = p.varLeft ? V+' '+RELS[solRel()]+' '+dash(fN(p.sol))\n                           : dash(fN(p.sol))+' '+RELS[relF()]+' '+V;\n    h='\u003cdiv class=\"prompt\">\u003cspan class=\"green\">\u003cstrong>Solved: \u003cspan class=\"math\">'+asIs+'\u003c/span>. '\n      + (p.varLeft?'Now graph it.':'Next, put '+V+' on the left.')+'\u003c/strong>\u003c/span>\u003c/div>';\n  }\n  else if(S.phase===\"check\"){\n    h='\u003cdiv class=\"row-between\">\u003cdiv class=\"prompt\">\u003cspan>Check: '+V+' = \u003cspan class=\"math\">'\n      + dash(fN(testVal()))+'\u003c/span> is in the shaded part, and it makes the original inequality true.\u003c/span>\u003c/div>'\n      + '\u003cbutton class=\"next\" id=\"nextBtn\">Next problem &rarr;\u003c/button>\u003c/div>';\n  }\n  S.lastPrompt=h;\n  el.innerHTML=\"\";\n  /* the only writing shown: a hint, and only after a wrong answer */\n  const t=document.getElementById(\"toast\");\n  if(S.miss){\n    if(t.innerHTML!==S.miss) t.innerHTML=S.miss;\n    t.hidden=false;\n    /* in the middle of the gap, between the working and the word problem */\n    const sb=document.getElementById(\"stagebox\"), st=document.getElementById(\"story\");\n    const below=(st.offsetHeight && !Shell.sideMode()) ? st.offsetTop : sb.offsetTop+sb.offsetHeight+t.offsetHeight+60;\n    const mid=(sb.offsetTop+sb.offsetHeight+below)/2;\n    t.style.setProperty(\"--toasttop\",Math.max(sb.offsetTop+sb.offsetHeight+6, mid-t.offsetHeight/2)+\"px\");\n  }\n  else t.hidden=true;\n}\n\n/* ---- one size, worked out before the first line is drawn ----\n   The tallest the page ever gets is the check step: every line of working is\n   down, plus the substitution underneath. So each tab is sized from the tallest\n   problem it can throw, drawn off-screen and measured. Every problem in that\n   tab is then written at that one size \u2014 nothing resizes mid-solve, and nothing\n   resizes between problems either. */\n/* Templates, not real problems: every number is pushed to the widest the\n   generator can produce for that kind, so the measurement is an upper bound.\n   They do not have to be arithmetically consistent \u2014 only the drawn size counts. */\nconst TALL={\n  basic:[\n    {kind:\"div\",wrapped:false,V:\"m\",a:9, num:0,den:0,s:1,k:-15,C:-27,M:-12,sol:-60,varLeft:false,varFirst:false,rel:\"ge\"},\n    {kind:\"mul\",wrapped:false,V:\"m\",a:9, num:0,den:0,s:1,k:-15,C:-75,M:-60,sol:-12,varLeft:false,varFirst:false,rel:\"ge\"}\n  ],\n  negfrac:[\n    {kind:\"wrap\",wrapped:true,V:\"m\",a:8, num:0,den:0,s:1,k:-12,C:-9, M:-72,sol:-60,varLeft:false,varFirst:true,rel:\"ge\"},\n    {kind:\"div\", wrapped:false,V:\"m\",a:-9,num:0,den:0,s:1,k:-15,C:-27,M:-12,sol:-60,varLeft:false,varFirst:false,rel:\"ge\"},\n    {kind:\"mul\", wrapped:false,V:\"m\",a:-9,num:0,den:0,s:1,k:-15,C:-75,M:-60,sol:-12,varLeft:false,varFirst:false,rel:\"ge\"}\n  ],\n  fcoef:[\n    {kind:\"frac\",wrapped:false,V:\"m\",num:7,den:9,s:-1,k:-15,C:-78,M:-63,sol:-81,varLeft:false,varFirst:false,rel:\"ge\"}\n  ]\n};\n/* one drill now, so size each problem from its own finished page: plain\n   problems get big writing, and the size still never changes mid-solve */\nfunction tallList(){ return [S.p]; }\nfunction lockScale(){\n  const room=Shell.room();\n  if(!room.h || !room.w){ Shell.scale=1; return; }\n  const saveP=S.p, savePhase=S.phase, saveMiss=S.miss;\n  let raw=1, fullH=0;\n  tallList().forEach(function(cand){\n    S.p=cand; S.phase=\"check\"; S.miss=\"\";\n    const m=Shell.ghost('\u003cdiv class=\"stage\">'\n      + '\u003cdiv class=\"scroller\">\u003cdiv class=\"eq k-two\">'\n      + rowsFor().join(\"\")\n      + '\u003c/div>\u003c/div>\u003cdiv>'+panelHTML()+'\u003c/div>\u003c/div>');\n    if(m.length && m[0].h && m[0].w){\n      raw=Math.min(raw, room.w/m[0].w, room.h/m[0].h);\n      fullH=Math.max(fullH,m[0].h);\n    }\n  });\n  S.p=saveP; S.phase=savePhase; S.miss=saveMiss;\n  /* a floor, so a very short window shrinks the writing only so far */\n  Shell.scale=Math.max(raw, 0.5);\n  /* hold room for all the working from the start, so the word problem\n     sits in one place under it and never moves */\n  Shell.fullH=Math.ceil(fullH*Shell.scale);\n  document.querySelector(\".work\").style.overflowY = (raw \u003c Shell.scale-0.001) ? \"auto\" : \"hidden\";\n}\n\nfunction render(){\n  Shell.head(Shell.active); renderEquation(); renderPanel(); renderPrompt(); attach();\n  Shell.applyScale(); focusFirst();\n}\nfunction focusFirst(){\n  later(60,function(){\n    const el=S.firstId && document.getElementById(S.firstId);\n    if(el) el.focus();\n  });\n}\n\n/* ============ flow ============ */\nfunction setPhase(ph){\n  clearTimers();\n  S.phase=ph; S.miss=\"\";\n  S.firstId = ph===\"op\"+cs()   ? \"cA\"\n            : ph===\"op\"+ks()   ? (S.p.kind===\"frac\" ? (parseInt2(S.recN)===null?\"nA\":\"dA\") : \"kA\")\n            : ph===simpPhase() ? \"sd\"\n            : ph===\"compute1\"  ? \"mv\"\n            : ph===\"compute2\"  ? \"ans\"\n            : ph===\"clrB\" ? \"r0\" : ph===\"clrC\" ? \"rK\" : null;\n  render();\n  if(ph===\"cancel1\") later(1700,function(){ setPhase(afterCancel(1)); });\n  if(ph===\"cancel2\") later(1750,function(){ setPhase(afterCancel(2)); });\n  if(ph===\"solved\")  later(1100,function(){ setPhase(S.p.varLeft?\"dot\":\"rewrite\"); });\n}\n/* the coefficient step gets a cancelling stop first when there is one to make */\nfunction afterCancel(step){\n  if(step!==ks()) return \"compute\"+step;\n  return canSimp() ? \"simplify\"+step : \"compute\"+step;\n}\nfunction finish(){ setPhase(\"solved\"); }\nfunction flagMiss(msg){\n  POST({miss:1});\n  S.clean=false; S.miss=msg; renderPrompt(); attach();\n  later(8000,function(){ S.miss=\"\"; renderPrompt(); attach(); });\n}\n/* the step's own hint, the one the Hint link used to open */\nfunction stepHint(){\n  const save=S.hint; S.hint=true; renderPrompt(); S.hint=save;\n  const tmp=document.createElement(\"div\"); tmp.innerHTML=S.lastPrompt||\"\";\n  const pr=tmp.querySelector(\".prompt\");\n  if(!pr) return missMessage();\n  const hl=pr.querySelector(\".hintline\"), tip=hl?hl.innerHTML:\"\";\n  pr.querySelectorAll(\".hintline,button,.noteline\").forEach(function(n){n.remove();});\n  const ask=pr.innerHTML.replace(/\u003c\\/span>\u003cspan/g,'\u003c/span> \u003cspan');\n  return ask+(tip?' &nbsp;'+tip:'');\n}\nfunction wrongHint(){ return '\u003cstrong>Not quite.\u003c/strong> '+stepHint(); }\n\n/* what each box is waiting for, so a wrong number can be told from one\n   that is still being typed (1 on the way to 12) */\nconst MIRRORS={cA:[\"cA\",\"cB\"],cB:[\"cA\",\"cB\"],kA:[\"kA\",\"kB\"],kB:[\"kA\",\"kB\"],\n               nA:[\"nA\",\"nB\"],nB:[\"nA\",\"nB\"],dA:[\"dA\",\"dB\"],dB:[\"dA\",\"dB\"]};\nfunction wants(id){\n  const p=S.p;\n  switch(id){\n    case \"cA\": case \"cB\": return [Math.abs(p.k),-Math.abs(p.k)];\n    case \"kA\": case \"kB\": return [p.a];\n    case \"nA\": case \"nB\": return [p.den,-p.den];\n    case \"dA\": case \"dB\": return [p.num,-p.num];\n    case \"sd\": return [redDen()];\n    case \"sn\": return [redNum()];\n    case \"mv\": return [p.M];\n    case \"ans\": return [p.sol];\n    case \"rL\": return SPEC.clr ? [SPEC.clr.L] : null;\n  }\n  return null;\n}\nlet missT=null;\nfunction checkWrong(id,phase){\n  const box=document.getElementById(id);\n  if(!box || S.phase!==phase || /\\bok\\b/.test(box.className)) return;\n  const raw=String(box.value).trim().replace(/[\\u2212\\u2013\\u2014]/g,\"-\").replace(/\\s+/g,\"\");\n  const v=parseInt2(raw), list=wants(id);\n  if(v===null || !list) return;\n  if(list.some(function(x){return near(v,x);})) return;\n  if(list.some(function(x){return String(x).indexOf(raw)===0;})) return;   /* still typing */\n  (MIRRORS[id]||[id]).forEach(function(i){\n    const b=document.getElementById(i);\n    if(b){ b.classList.remove(\"bad\"); void b.offsetWidth; b.classList.add(\"bad\"); }\n  });\n  flagMiss(wrongHint());\n}\nfunction missMessage(){\n  const sub=subName();\n  if(sub===\"op\") return isConst()\n    ? \"That will not cancel it out \\u2014 use the same size number that is in the way.\"\n    : (S.p.kind===\"frac\" ? \"Not quite \\u2014 flip the fraction over, and keep the sign in mind.\"\n                         : \"Not quite \\u2014 check the number and its sign, then try again.\");\n  if(sub===\"simplify\") return \"Divide both numbers by the same factor, then write what each one becomes.\";\n  if(sub===\"compute\") return \"Not quite \\u2014 check the size and the sign, then try again.\";\n  return \"\";\n}\nfunction nextProblem(){ Shell.next(); }\nfunction begin(fl){\n  clearTimers();\n  S.fl = fl || \"basic\";\n  S.p = genProblem(S.fl);\n  S.phase=SPEC.clr?\"clrA\":SPEC.comb?\"comb\":(S.p.one?\"pick2\":\"pick1\"); S.sign=1; S.cN=\"\"; S.cD=\"\"; S.letterDone=false; S.ltWrong=[];\n  S.rL=\"\"; S.r={}; S.rK=\"\";\n  S.opIn=\"\"; S.coefIn=\"\"; S.recN=\"\"; S.recD=\"\"; S.mIn=\"\"; S.ansIn=\"\";\n  S.simpDen=\"\"; S.simpNum=\"\";\n  S.hint=false; S.clean=true; S.miss=\"\"; S.firstId=SPEC.clr?\"rL\":SPEC.comb?\"cN\":null;\n  const stEl=document.getElementById(\"story\");\n  stEl.innerHTML=S.p.story;\n\n  document.querySelector(\".work\").style.setProperty(\"--storyh\",(stEl.offsetHeight+6)+\"px\");\n  lockScale();\n  render();\n}\n/* if the window changes size, work the one size out again for the problem in hand */\nShell.onResize=function(){\n  if(Shell.activeEng!==KEY || !S.p) return;\n  lockScale(); Shell.applyScale();\n};\n\n/* ============ input handling ============ */\nfunction attach(){\n  const hb=document.getElementById(\"hintBtn\");\n  if(hb) hb.onclick=function(){ S.hint=!S.hint; renderPrompt(); attach(); };\n  const sb=document.getElementById(\"skipBtn\"); if(sb) sb.onclick=nextProblem;\n  const nb=document.getElementById(\"nextBtn\"); if(nb) nb.onclick=nextProblem;\n  Shell.bindOps(chooseOp);\n  const cl=choices(); if(cl) Shell.bindChoices(cl,choose);\n\n  bind(\"cA\",onConst); bind(\"cB\",onConst);\n  bind(\"kA\",onCoef);  bind(\"kB\",onCoef);\n  bind(\"nA\",onRecN);  bind(\"nB\",onRecN);\n  bind(\"dA\",onRecD);  bind(\"dB\",onRecD);\n  bind(\"sd\",onSimpDen); bind(\"sn\",onSimpNum);\n  bind(\"mv\",onMid);   bind(\"ans\",onAns);\n  bind(\"cN\",onComb);  bind(\"cD\",onComb);\n  bind(\"rL\",onClrL); bind(\"rK\",onClrK);\n  for(let j=0;j\u003c4;j++) bind(\"r\"+j,onClrR);\n  Shell.choiceFn=choose;\n  document.querySelectorAll(\".ltopt\").forEach(function(b){ b.onclick=function(){ chooseLetter(+b.id.slice(2),b); }; });\n}\nfunction bind(id,handler){\n  const el=document.getElementById(id);\n  if(!el) return;\n  el.oninput=function(e){\n    (MIRRORS[id]||[id]).forEach(function(i){ const b=document.getElementById(i); if(b) b.classList.remove(\"bad\"); });\n    handler(e);\n    const ph=S.phase;\n    clearTimeout(missT);\n    missT=setTimeout(function(){ checkWrong(id,ph); },1100);\n  };\n  el.onkeydown=function(e){\n    if(e.key===\"Enter\"){\n      e.preventDefault(); clearTimeout(missT);\n      const b=document.getElementById(id);\n      if(b && !/\\bok\\b/.test(b.className)) flagMiss(wrongHint());\n    }\n  };\n}\nfunction mirror(ids,val){\n  ids.forEach(function(id){\n    const b=document.getElementById(id);\n    if(b && b.value!==val) b.value=val;\n  });\n}\n\nfunction wantOp(step){\n  const p=S.p;\n  if(step===cs()) return p.k>0 ? \"sub\" : \"add\";\n  return p.kind===\"mul\" ? \"divide\" : \"multiply\";\n}\nfunction wrongOpMsg(step,pressed){\n  const p=S.p, V=p.V;\n  if(p.one===\"const\" && (pressed===\"multiply\"||pressed===\"divide\"))\n    return \"Nothing is multiplying or dividing \"+V+\" here. The \"+Math.abs(p.k)+\" is \"\n      + (p.k\u003c0?\"subtracted\":\"added\")+\", so undo that.\";\n  if(p.one===\"const\")\n    return \"That moves the wrong way. The \"+Math.abs(p.k)+\" is \"+(p.k\u003c0?\"subtracted\":\"added\")\n      + \", so do the opposite.\";\n  if(p.one===\"coef\" && (pressed===\"add\"||pressed===\"sub\"))\n    return \"Nothing is added to or subtracted from \"+V+\" here. \"+V+\" is \"\n      + (p.kind===\"mul\" ? \"multiplied by \"+dash(fN(p.a))\n       : p.kind===\"div\" ? \"divided by \"+dash(fN(p.a)) : \"multiplied by a fraction\")\n      + \", so undo that.\";\n  if(step===cs()){\n    if(pressed===\"add\"||pressed===\"sub\")\n      return \"That moves the wrong way \\u2014 it makes that side bigger instead of clearing the \"\n        + (p.k\u003c0?\"subtraction\":\"addition\")+\".\";\n    if(p.wrapped) return \"The fraction is already cleared. What is left is a loose \"+Math.abs(p.k)\n      + \" \\u2014 undo it by adding or subtracting.\";\n    return \"Not yet \\u2014 the loose \"+Math.abs(p.k)+\" has to go first. Undo it by adding or \"\n      + \"subtracting, then deal with what is attached to \"+V+\".\";\n  }\n  if(pressed===\"add\"||pressed===\"sub\"){\n    if(p.wrapped) return \"Careful \\u2014 the whole side is over \"+p.a+\", so the \"+Math.abs(p.k)\n      + \" is not loose yet. Multiply both sides by \"+p.a+\" first.\";\n    return \"The loose number is already gone. What is left is \"+V+\" \"\n      + (p.kind===\"mul\"  ? \"multiplied by \"+dash(fN(p.a))\n       : p.kind===\"frac\" ? \"multiplied by a fraction\"\n                         : \"divided by \"+dash(fN(p.a)))\n      + \" \\u2014 adding or subtracting will not free it.\";\n  }\n  return p.kind===\"mul\"\n    ? \"That side is already a multiplication \\u2014 multiplying again will not free \"+V+\".\"\n    : (p.kind===\"frac\"\n       ? \"Dividing by a fraction is the hard way \\u2014 flipping it over and multiplying does the \"\n         + \"same job. Press \u003cstrong>M\u003c/strong> to multiply.\"\n       : V+\" is already being divided \\u2014 dividing again will not free it.\");\n}\nfunction chooseOp(kind,btn){\n  const step = S.phase===\"pick1\" ? 1 : 2;\n  if(kind===wantOp(step)){\n    if(step===cs()){ S.sign = kind===\"sub\" ? -1 : 1; S.opIn=\"\"; }\n    else { S.coefIn=\"\"; S.recN=\"\"; S.recD=\"\"; S.simpDen=\"\"; S.simpNum=\"\"; }\n    S.hint=false; setPhase(\"op\"+step);\n    return;\n  }\n  S.clean=false; Shell.shake(btn);\n  flagMiss(wrongOpMsg(step,kind));\n}\n\nfunction paint(ids,ok,base){\n  const cls=base+(ok?\" ok\":\"\");\n  ids.forEach(function(id){ const b=document.getElementById(id); if(b) b.className=cls; });\n}\nfunction onConst(e){\n  S.opIn=e.target.value; mirror([\"cA\",\"cB\"],S.opIn);\n  const v=parseInt2(S.opIn), ok=(v!==null && near(Math.abs(v),Math.abs(S.p.k)));\n  paint([\"cA\",\"cB\"],ok,\"box\");\n  clearTimers();\n  if(ok) later(300,function(){ S.hint=false; setPhase(\"cancel\"+cs()); });\n}\nfunction onCoef(e){\n  S.coefIn=e.target.value; mirror([\"kA\",\"kB\"],S.coefIn);\n  const v=parseInt2(S.coefIn), ok=(v!==null && v===S.p.a);\n  paint([\"kA\",\"kB\"],ok,\"box\");\n  clearTimers();\n  if(ok) later(300,function(){ S.hint=false; setPhase(\"cancel\"+ks()); });\n}\nfunction onRecN(e){\n  S.recN=e.target.value; mirror([\"nA\",\"nB\"],S.recN);\n  paint([\"nA\",\"nB\",\"dA\",\"dB\"],recipOK(),\"box mini\");\n  clearTimers();\n  if(recipOK()){ later(320,function(){ S.hint=false; setPhase(\"cancel\"+ks()); }); return; }\n  const n=parseInt2(S.recN);\n  if(n!==null && Math.abs(n)===S.p.den && parseInt2(S.recD)===null){\n    const d=document.getElementById(e.target.id===\"nA\"?\"dA\":\"dB\");\n    if(d) d.focus();\n  }\n}\nfunction onRecD(e){\n  S.recD=e.target.value; mirror([\"dA\",\"dB\"],S.recD);\n  paint([\"nA\",\"nB\",\"dA\",\"dB\"],recipOK(),\"box mini\");\n  clearTimers();\n  if(recipOK()) later(320,function(){ S.hint=false; setPhase(\"cancel\"+ks()); });\n}\nfunction setCls(el,cls){ if(el && el.className!==cls) el.className=cls; }\nfunction paintSimp(){\n  if(!simplifying()) return;\n  setCls(document.getElementById(\"sd\"),\"box tiny\"+(simpDenOK()?\" ok\":\"\"));\n  setCls(document.getElementById(\"sn\"),\"box tiny\"+(simpNumOK()?\" ok\":\"\"));\n  setCls(document.getElementById(\"slD\"),pendCls(simpDenOK(),true));\n  setCls(document.getElementById(\"slN\"),pendCls(simpNumOK(),true));\n  renderPrompt(); attach();\n}\nfunction onSimpDen(e){\n  S.simpDen=e.target.value;\n  paintSimp(); clearTimers();\n  if(simpOK()){ later(420,function(){ S.hint=false; setPhase(\"compute\"+ks()); }); return; }\n  if(simpDenOK() && parseInt2(S.simpNum)===null){\n    const sn=document.getElementById(\"sn\"); if(sn) sn.focus();\n  }\n}\nfunction onSimpNum(e){\n  S.simpNum=e.target.value;\n  paintSimp(); clearTimers();\n  if(simpOK()) later(420,function(){ S.hint=false; setPhase(\"compute\"+ks()); });\n}\nfunction onMid(e){\n  S.mIn=e.target.value;\n  const v=parseInt2(S.mIn);\n  clearTimers();\n  if(near(v,S.p.M)) later(300,function(){ S.hint=false; setPhase(\"pick2\"); });\n}\nfunction onAns(e){\n  S.ansIn=e.target.value;\n  const v=parseInt2(S.ansIn);\n  clearTimers();\n  if(near(v,S.p.sol)) later(280,function(){ S.hint=false; setPhase(\"flip2\"); });\n}\n\ndocument.addEventListener(\"keydown\",function(e){\n  if(Shell.activeEng!==KEY) return;\n  if(document.body.classList.contains(\"oncard\")) return;\n  if(e.key===\"Enter\" && S.phase===\"check\" && (!SPEC.letters||S.letterDone)) nextProblem();\n});\n\nreturn {start:begin};\n\n})();\n\n/* ================= turning it in =================\n   The same Google Form the exponents review uses: period and both names read\n   back before anything is sent. It comes up by itself after ten problems, and\n   the Turn in button is always there for anyone who needs to send less. */\nconst TURNIN={TOTAL:10, POINTS:10, NAME:\"One- and Two-Step Inequalities\",\n              submitted:false, submittedAt:0, autoShown:false};\nfunction el(id){return document.getElementById(id);}\nfunction escT(t){return String(t).replace(/[&\u003c>\"]/g,function(c){return {\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c];});}\nfunction solvedCount(){return Math.min(Shell.done,TURNIN.TOTAL);}\nfunction points(){return Math.round(solvedCount()*TURNIN.POINTS/TURNIN.TOTAL);}\nfunction cleanSolves(){return Shell.records.filter(function(r){return r.clean;}).length;}\nfunction cardShowing(){return document.body.classList.contains(\"oncard\");}\nfunction setCard(on){\n  document.body.classList.toggle(\"oncard\",on);\n  el(\"turnInBtn\").textContent = on ? \"Back to the drill\" : \"Turn in\";\n}\nfunction showSubmitCard(completed){\n  setCard(true);\n  const done=solvedCount(), T=TURNIN.TOTAL;\n  el(\"submitTitle\").textContent = completed ? \"All done\" : \"Your work so far\";\n  el(\"submitNote\").textContent = completed\n    ? \"That is all ten problems. Enter your period and name to submit.\"\n    : \"Enter your period and name to submit what you have so far. Nothing is lost by doing this \\u2014 go back afterwards, finish the set, and send it again.\";\n  el(\"recap\").innerHTML='\u003cdiv>Progress\u003cspan class=\"bar\">\u003cspan class=\"fill\" style=\"width:'+(done*100/T)+'%\">\u003c/span>\u003c/span>\u003c/div>';\n  let log='';\n  if(Shell.records.length){\n    log='\u003cdiv class=\"log\">'+Shell.records.map(function(r,i){\n      return '\u003cdiv class=\"logrow\">\u003cspan class=\"logn\">'+(i+1)+'.\u003c/span>\u003cspan class=\"logq\">'+escT(r.q||\"\\u2014\")\n           + '\u003c/span>\u003cspan class=\"logh\">'+(r.clean?\"first try\":\"more than one go\")+'\u003c/span>\u003c/div>';\n    }).join(\"\")+'\u003c/div>';\n  } else log='\u003cdiv class=\"logempty\">Nothing finished yet \\u2014 work goes in here as you go.\u003c/div>';\n  el(\"workLog\").innerHTML=log;\n\n  /* only worth sending again if the earlier send had fewer than ten;\n     extra practice past ten cannot change the score */\n  const more = TURNIN.submitted && Shell.done>TURNIN.submittedAt && TURNIN.submittedAt\u003cTURNIN.TOTAL;\n  el(\"gform\").style.display = (!TURNIN.submitted || more) ? \"\" : \"none\";\n  const btn=document.querySelector(\"#gform .submit-btn\");\n  if(more){\n    el(\"formFeedback\").innerHTML='\u003cspan class=\"resend\">You have done more since you turned in. Send it again and the newer one counts.\u003c/span>';\n    btn.textContent=\"Send updated results\";\n  } else if(!TURNIN.submitted){\n    el(\"formFeedback\").innerHTML=\"\"; btn.textContent=\"Submit Results\";\n  }\n  const left=T-Shell.done;\n  document.querySelector(\".after-submit .lab\").textContent = left>0 ? \"still more to do:\" : \"want more practice?\";\n  el(\"keepBtn\").textContent = left>0 ? \"Go back and keep going\" : \"Keep practicing\";\n  document.querySelector(\".after-submit\").style.display = \"\";\n  el(\"formScore\").value=points();\n  try{ el(\"submitCard\").scrollTop=0; }catch(e){}\n}\nfunction keepDrilling(){\n  setCard(false);\n  /* coming back to a problem that is already finished: go straight to a new one */\n  if(document.getElementById(\"nextBtn\")){ Shell.next(); return; }\n  requestAnimationFrame(function(){ if(Shell.onResize) Shell.onResize(); });\n}\nfunction showSubmittedMessage(){\n  el(\"formFeedback\").innerHTML='\u003cspan style=\"color:#38a169;\">Successfully submitted. '\n    + (Shell.done>=TURNIN.TOTAL\n        ? 'You can close this page, or keep practicing. Extra practice does not need to be sent.'\n        : 'You can close this page, or go back and finish the set.')+'\u003c/span>';\n  el(\"gform\").style.display=\"none\";\n}\nfunction onHiddenFrameLoad(){ if(TURNIN.submitted) showSubmittedMessage(); }\nfunction nameCheck(){\n  const ln=el(\"lastName\").value.trim(), fn=el(\"firstName\").value.trim();\n  const row=function(tag,val){\n    return '\u003cdiv class=\"row\">\u003cspan class=\"tag\">'+tag+'\u003c/span>\u003cspan class=\"val'+(val?'':' empty')+'\">'\n         + (val?escT(val):'\\u2014')+'\u003c/span>\u003c/div>';\n  };\n  el(\"nameCheck\").innerHTML='\u003cdiv class=\"checkhead\">This is what will be sent \\u2014 check it is the right way round:\u003c/div>'\n    + row(\"Last name\",ln)+row(\"First name\",fn)+row(\"Roll call\",(ln&&fn)?ln+\", \"+fn:\"\");\n}\nel(\"lastName\").addEventListener(\"input\",nameCheck);\nel(\"firstName\").addEventListener(\"input\",nameCheck);\nnameCheck();\nel(\"gform\").addEventListener(\"submit\",function(){\n  const ln=el(\"lastName\").value.trim(), fn=el(\"firstName\").value.trim();\n  el(\"studentName\").value='Period '+el(\"studentPeriod\").value.trim()\n    + ' \\u2014 '+ln+' \\u2014 '+fn\n    + ' \\u2014 '+points()+'/'+TURNIN.POINTS+' points, '+solvedCount()+'/'+TURNIN.TOTAL+' problems'\n    + ' \\u2014 '+cleanSolves()+' first try'\n    + ' \\u2014 '+TURNIN.NAME;\n  el(\"formScore\").value=points();\n  TURNIN.submitted=true; TURNIN.submittedAt=Shell.done;\n});\nel(\"keepBtn\").onclick=keepDrilling;\nel(\"turnInBtn\").onclick=function(){\n  if(cardShowing()) keepDrilling(); else showSubmitCard(Shell.done>=TURNIN.TOTAL);\n};\n\nShell.next();\n\u003c/script>\n\u003c/body>\n\u003c/html>", "clear": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Clearing Decimals and Fractions Drill\u003c/title>\n\u003cstyle>\n/* Layout: matches the One-Step Equations drill. Header bar, equation entry, the work centered and\n   scaled to fit, the prompt bar along the bottom. One light look, like the drill. */\n:root{\n  --ink:#0f172a; --line:#1e293b; --muted:#64748b; --faint:#94a3b8; --prompt:#334155; --slate:#475569;\n  --blue:#1d4ed8; --blue-b:#3b82f6; --blue-bg:#eff6ff; --blue-edge:#bfdbfe;\n  --green:#059669; --green-b:#10b981; --green-bg:#ecfdf5;\n  --rose:#e11d48; --rose-b:#fb7185; --rose-bg:#fff1f2;\n  --ui:#047857; --ui-b:#10b981; --ui-bg:#ecfdf5; --ui-edge:#a7f3d0;\n  --page:#f8fafc; --edge:#e2e8f0; --white:#ffffff;\n  --hl:#fef08a; --hl-edge:#facc15; --pick:#fde047; --hover:#fef9c3;\n  --sl-draw:#475569; --sl-dim:#a3aec0; --dim-text:#cbd5e1;\n  color-scheme:light;\n}\n*{box-sizing:border-box;}\nhtml,body{height:100%;margin:0;}\nhtml{font-size:clamp(16px,1.15vw + .6vh,26px);}\nbody{background:var(--page);color:var(--ink);font-family:Tahoma,Verdana,Geneva,sans-serif;-webkit-font-smoothing:antialiased;}\nbutton,input{font-family:Tahoma,Verdana,Geneva,sans-serif;}\n.app{height:100%;display:flex;flex-direction:column;overflow:hidden;padding-block:12px;\n  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}\n.wrap{width:100%;max-width:120rem;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0;}\n\n/* header */\n.drillhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;\n  flex-shrink:0;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--edge);}\n.dh-name{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);}\n.dh-right{display:inline-flex;align-items:center;gap:12px;}\n.dh-count{font-size:1rem;font-weight:700;color:var(--ui);font-variant-numeric:tabular-nums;white-space:nowrap;}\n.turnin-link{font-weight:700;font-size:.75rem;padding:4px 12px;border-radius:8px;cursor:pointer;\n  background:var(--white);color:var(--ui);border:2px solid var(--ui-edge);}\n.turnin-link:hover{border-color:var(--ui-b);background:var(--ui-bg);}\n\n/* typing the equation */\n.entry{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;flex-shrink:0;margin:0 auto 0 0;}\n.entry .lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);}\n.box.eqbox{width:12rem;max-width:100%;height:1.9rem;font-size:1rem;text-align:left;padding:0 .5em;}\n.entry .checkbtn{padding:4px 14px;font-size:.85rem;}\n.entry-err{margin-top:6px;font-size:.95rem;color:var(--rose);flex-shrink:0;}\n.tally{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:10px;font-size:.72rem;\n  color:var(--faint);font-variant-numeric:tabular-nums;flex-shrink:0;}\n.tally span{white-space:nowrap;}\n.tally .done{color:var(--muted);}\n.tally .done b{color:var(--green);}\n.tally .on{color:var(--blue);font-weight:700;}\n.tally b{font-weight:700;margin-right:3px;}\n\n/* work area */\n.work{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4vh 0 8px;overflow-x:hidden;overflow-y:auto;}\n.fitbox{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;}\n.scroller{width:100%;}\n.s dth:5.5em;height:1.4em;font-size:.8em;border-color:var(--ui-b);background:var(--white);color:var(--ui);}\n.box.ownbox:focus{border-color:var(--ui);}\n.ownbtns{display:inline-flex;align-items:center;gap:12px;}\n.story .tri{display:block;width:min(300px,100%);margin:8px auto 0;font-family:inherit;}\n.stagelab{text-align:center;font-size:1.05rem;font-weight:700;letter-spacing:.04em;color:var(--ui);margin-bottom:18px;}\n.stagelab .from{display:block;margin-top:4px;font-weight:400;color:var(--muted);font-size:1.15rem;letter-spacing:0;}\n.stagelab .from .dfrac,.stagelab .from .stack{font-size:.85em;}\n.stagelab .from .tpair{vertical-align:middle;}\n.checkline .cl-lab{margin-bottom:2px;}\n/* guided work (no multiple choice) */\n.guide{display:flex;flex-direction:column;gap:10px;width:max-content;min-width:min(52rem,100%);margin:0 auto;font-size:1.5rem;}\n.grow{display:flex;flex-wrap:nowrap;white-space:nowrap;align-items:center;gap:8px 14px;padding:10px 16px;border:2px solid var(--edge);border-radius:12px;background:var(--white);}\n.grow.cur{border-color:var(--ui-b);background:var(--ui-bg);}\n.grow .box,.follow .box,.box.eqbox{border-color:var(--ui-b);background:var(--white);color:var(--ui);}\n.grow .box:focus,.follow .box:focus,.box.eqbox:focus{border-color:var(--ui);background:var(--white);}\n.grow.done{border-color:#a7f3d0;}\n.grow .gl{font-weight:700;color:var(--muted);}\n.grow .gq{white-space:nowrap;}\n.grow .gcap{font-size:.9rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}\n.grow .gbx{display:inline-flex;flex-direction:column;align-items:center;gap:2px;}\n.grow .gbx .gsub{font-size:.75rem;color:var(--muted);font-weight:600;}\n.grow .box{height:2.6rem;width:5rem;font-size:1.45rem;}\n.grow .gv{display:inline-block;min-width:2.4rem;text-align:center;font-weight:700;color:var(--green);}\n.grow .gv.no{color:var(--rose);}\n.follow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;font-size:1.6rem;padding:8px 16px;\n  border:2px solid var(--ui-b);background:var(--ui-bg);border-radius:12px;}\n.follow .box{height:2.8rem;width:7rem;font-size:1.5rem;}\n.follow .gv{font-weight:700;color:var(--green);}\n@media (max-width:640px){ .guide{font-size:1.05rem;} .grow .box{height:2.1rem;width:3.8rem;font-size:1.1rem;} .follow{font-size:1.1rem;} }\n/* cross simplifying, inside the equation */\n.xfrac{display:inline-grid;justify-items:center;align-items:center;vertical-align:middle;line-height:1.1;margin:0 2px;}\n.xfrac .xslot{height:1.15em;min-width:.6em;display:flex;align-items:center;justify-content:center;font-size:.62em;}\n.xfrac .xnum{padding:0 6px;border-radius:8px;}\n.xfrac .xbar{width:100%;min-width:1.3em;border-top:2px solid currentColor;margin:3px 0;}\n.xfrac .box{height:1.55em;width:2.1em;font-size:.95em;}\n.xfrac .xnew{color:var(--ink);}\n.xfrac .cx-old{color:var(--faint);background-repeat:no-repeat;background-image:linear-gradient(to bottom right, transparent calc(50% - 1.8px), var(--blue) calc(50% - 1.8px), var(--blue) calc(50% + 1.8px), transparent calc(50% + 1.8px));}\n.xfrac .hl1{background:var(--hl);box-shadow:0 0 0 2px var(--hl-edge);color:var(--ink);}\n.xfrac .hl2{background:#bbf7d0;box-shadow:0 0 0 2px #4ade80;color:var(--ink);}\n.xsign{margin-right:2px;}\n.nk{display:inline-block;margin-left:10px;padding:0 6px;border:1.5px solid rgba(255,255,255,.55);border-radius:5px;font-size:.75em;font-family:inherit;line-height:1.4;opacity:.85;}\n.hint1{width:100%;text-align:center;font-size:1.35rem;color:var(--muted);padding:6px 0;}\n.keyhelp{width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;padding:4px 0 6px;}\n.kh{background:none;border:none;padding:2px 4px;border-radius:6px;font-size:1.05rem;color:var(--muted);cursor:pointer;white-space:nowrap;}\n.kh:hover{color:var(--ink);}\n.kh.shake{animation:shake .32s;color:var(--rose);}\n.kh kbd{display:inline-block;min-width:1.6em;padding:1px 6px;margin-right:2px;border:1.5px solid var(--edge);border-bottom-width:3px;\n  border-radius:6px;background:var(--white);color:var(--ink);font-family:inherit;font-weight:700;text-align:center;}\n.promptbar .missline{margin-top:0;font-size:1.5rem;font-weight:700;min-height:1.5em;}\n.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}\n\n@media (max-width:640px){\n  .eq{font-size:1.45rem;column-gap:15px;}\n  .eq.k-addsub{column-gap:16px;row-gap:8px;}\n  .cell{min-height:3.1rem;}\n  .checkline{font-size:1.15rem;line-height:1.9;}\n  .checkline .box{height:2rem;width:3.1rem;font-size:1.15rem;}\n  .ops{gap:9px;}\n  .op{width:4rem;height:3.4rem;font-size:1.7rem;}\n  .box{height:2.3rem;width:3.1rem;font-size:1.3rem;}\n  .box.wide{width:4.4rem;}\n  .box.eqbox{height:1.9rem;width:9rem;font-size:.95rem;}\n  .checkbtn{padding:8px 20px;font-size:1rem;}\n  .eq.k-muldiv .dfrac.wide > .bar{min-width:3.2rem;}\n  .prompt{font-size:1.05rem;}\n  .row-between{flex-wrap:wrap;}\n}\n@media (prefers-reduced-motion:reduce){\n  .xslash.draw line,.fresh,.op.shake,.tgt.shake,.slash.draw,.ansbox{animation:none;}\n}\n.drillhead,.qstrip,.entry-err,#story,.tally{display:none!important}\n\u003c/style>\n\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"drillhead\">\n      \u003cspan class=\"dh-name\">Clearing Decimals &amp; Fractions\u003c/span>\n      \u003cform class=\"entry\" id=\"entry\" autocomplete=\"off\">\n        \u003clabel class=\"vh\" for=\"eqIn\">Equation\u003c/label>\n        \u003cinput class=\"box eqbox\" id=\"eqIn\" type=\"text\" spellcheck=\"false\" placeholder=\"Type your own\" value=\"\">\n        \u003cbutton class=\"checkbtn\" type=\"submit\">Solve it\u003c/button>\n      \u003c/form>\n      \u003cspan class=\"dh-right\">\u003cspan class=\"dh-count\" id=\"qlabel\">\u003c/span>\u003cbutton class=\"turnin-link cross-btn\" id=\"crossBtn\" type=\"button\">Cross-simplify help: On\u003c/button>\u003cbutton class=\"turnin-link\" id=\"randBtn\" type=\"button\">Give me one\u003c/button>\u003c/span>\n    \u003c/div>\n\n    \u003cdiv class=\"entry-err\" id=\"eqErr\" role=\"alert\" hidden>\u003c/div>\n    \u003cdiv class=\"qstrip\" id=\"qstrip\">\u003c/div>\n    \u003cdiv class=\"main\">\n    \u003caside class=\"side\">\n      \u003cdiv class=\"story\" id=\"story\" hidden>\u003c/div>\n      \u003cdiv class=\"promptbar\" id=\"promptbar\" aria-live=\"polite\">\u003c/div>\n      \u003cbutton class=\"undo-btn\" id=\"undoBtn\" type=\"button\" hidden>&#8630; Undo\u003ckbd class=\"nk\">Esc\u003c/kbd>\u003c/button>\n    \u003c/aside>\n\n    \u003cdiv class=\"work\">\n      \u003cdiv class=\"fitbox\" id=\"fitbox\">\n        \u003cdiv class=\"stagelab\" id=\"stagelab\" hidden>\u003c/div>\n        \u003cdiv class=\"scroller\">\u003cdiv class=\"prewrap\" id=\"pre\" hidden>\u003c/div>\u003cdiv class=\"eq prevwork\" id=\"prev\" hidden>\u003c/div>\u003cdiv class=\"eq\" id=\"eq\">\u003c/div>\u003c/div>\n        \u003cdiv id=\"panel\">\u003c/div>\n        \u003cdiv class=\"actions\">\u003cdiv class=\"notebar\" id=\"notebar\" aria-live=\"polite\">\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>/*SPEC*/\u003c/script>\n\u003cscript>\nconst SPEC=window.HOST_SPEC||{};\nfunction fN(x){ const r=Math.round(x*1e6)/1e6; if(SPEC.money&&!Number.isInteger(r)) return r.toFixed(2); return String(r); }\nfunction near(a,b){ return a!==null&&a!==undefined&&!isNaN(a)&&Math.abs(a-b)\u003c1e-9; }\nfunction POST(m){ if(m && m.done){ NOUNDO=true; HIST.length=0; } try{ parent.postMessage(Object.assign({drill:1},m),'*'); }catch(e){} }\nlet MISSED=false;\nwindow.addEventListener('message',function(e){ if(e.data&&e.data.refit) window.dispatchEvent(new Event('resize')); });\n\u003c/script>\n\u003cscript>\n/* ================= numbers ================= */\nconst MINUS = \"\u2212\";\nfunction gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a||1; }\nfunction R(n,d){ if(d===undefined) d=1; if(d\u003c0){ n=-n; d=-d; } const g=gcd(n,d); return {n:n/g, d:d/g}; }\nfunction neg(a){ return {n:-a.n, d:a.d}; }\nfunction absR(a){ return {n:Math.abs(a.n), d:a.d}; }\nfunction addR(a,b){ return R(a.n*b.d + b.n*a.d, a.d*b.d); }\nfunction subR(a,b){ return addR(a, neg(b)); }\nfunction mulR(a,b){ return R(a.n*b.n, a.d*b.d); }\nfunction divR(a,b){ return R(a.n*b.d, a.d*b.n); }\nfunction same(a,b){ return a.n*b.d === b.n*a.d; }\nfunction isNeg1(a){ return a.n===-1 && a.d===1; }\nfunction numR(s){\n  if(s.indexOf(\".\")>=0){ const p=s.split(\".\"); const d=Math.pow(10,p[1].length); return R((+p[0]||0)*d + (+p[1]||0), d); }\n  return R(+s);\n}\nfunction termR(s){ if(s.indexOf(\"/\")>=0){ const p=s.split(\"/\"); return +p[1] ? R(+p[0], +p[1]) : null; } return numR(s); }\n\nlet P = null;   /* the current problem */\nfunction terminates(d){ while(d%2===0) d/=2; while(d%5===0) d/=5; return d===1; }\nfunction decStr(r){ const s=(r.n/r.d).toFixed(6).replace(/0+$/,\"\").replace(/\\.$/,\"\"); return s===\"-0\" ? \"0\" : s; }\nfunction asDec(r){ return P && P.dec && terminates(r.d); }\nfunction plainT(r){\n  if(r.d===1) return String(r.n);\n  if(asDec(r)) return decStr(r);\n  return (r.n\u003c0?\"-\":\"\") + Math.abs(r.n) + \"/\" + r.d;\n}\nfunction stackH(t,b){ return '\u003cspan class=\"stack\">\u003cspan class=\"t\">'+t+'\u003c/span>\u003cspan class=\"bar\">\u003c/span>\u003cspan class=\"b\">'+b+'\u003c/span>\u003c/span>'; }\nfunction dfracH(t,b,cls,barCls){ return '\u003cspan class=\"dfrac'+(cls?' '+cls:'')+'\">\u003cspan class=\"t\">'+t+'\u003c/span>\u003cspan class=\"bar'+(barCls?' '+barCls:'')+'\">\u003c/span>\u003cspan class=\"b\">'+b+'\u003c/span>\u003c/span>'; }\n/* a number as written: whole numbers and decimals flat, fractions stacked */\nfunction cm(n){ return n>=10000 ? n.toLocaleString(\"en-US\") : String(n); }\nfunction H(r){\n  if(r.d===1) return (r.n\u003c0?MINUS:\"\") + cm(Math.abs(r.n));\n  if(asDec(r)) return (r.n\u003c0?MINUS:\"\") + decStr(absR(r));\n  return '\u003cspan class=\"sgn\">'+(r.n\u003c0?MINUS:\"\") + stackH(Math.abs(r.n), r.d)+'\u003c/span>';\n}\nfunction PH(r){ return r.n\u003c0 ? \"(\"+H(r)+\")\" : H(r); }\n\n/* ================= reading the equation ================= */\nconst NUM = \"(\\\\d+(?:\\\\.\\\\d*)?|\\\\.\\\\d+)\";\nconst KT  = \"(\\\\d+\\\\/\\\\d+|\\\\d+(?:\\\\.\\\\d*)?|\\\\.\\\\d+)\";\nfunction stripParens(s){ while(/^\\([^()]*\\)$/.test(s)) s=s.slice(1,-1); return s; }\nfunction parseConst(s){\n  s=stripParens(s); let m;\n  if((m=s.match(/^([+-]?)(\\d+)\\/(\\d+)$/))){ if(!+m[3]) return null; return R((m[1]===\"-\"?-1:1)*+m[2], +m[3]); }\n  if((m=s.match(new RegExp(\"^([+-]?)\"+NUM+\"$\")))){ const r=numR(m[2]); return m[1]===\"-\" ? neg(r) : r; }\n  return null;\n}\nfunction parseVarSide(s,v){\n  let m; const sg=function(x){ return x===\"-\" ? -1 : 1; };\n  const re=function(x){ return new RegExp(\"^\"+x+\"$\"); };\n  const solved={err:\"That one is already solved: \"+v+\" is by itself. Try something like \"+v+\" + 7 = 12.\"};\n  if((m=s.match(re(\"\\\\+?\"+v+\"([+-])\"+KT)))){\n    const k=termR(m[2]); if(!k) return null; if(!k.n) return {err:\"Adding 0 doesn't change anything. Try a different number.\"};\n    return {kind:\"add\", k:m[1]===\"-\"?neg(k):k, varFirst:true};\n  }\n  if((m=s.match(re(\"([+-]?)\"+KT+\"\\\\+\"+v)))){\n    const k=termR(m[2]); if(!k) return null; if(!k.n) return {err:\"Adding 0 doesn't change anything. Try a different number.\"};\n    return {kind:\"add\", k:m[1]===\"-\"?neg(k):k, varFirst:false};\n  }\n  /* 7 - x, -x + 7: the letter has a minus sign in front (solved for -x, then flipped) */\n  if((m=s.match(re(\"([+-]?)\"+KT+\"-\"+v)))){\n    const k=termR(m[2]); if(!k||!k.n) return null;\n    return {kind:\"add\", k:m[1]===\"-\"?neg(k):k, varFirst:false, negVar:true};\n  }\n  if((m=s.match(re(\"-\"+v+\"([+-])\"+KT)))){\n    const k=termR(m[2]); if(!k||!k.n) return null;\n    return {kind:\"add\", k:m[1]===\"-\"?neg(k):k, varFirst:true, negVar:true};\n  }\n  if((m=s.match(re(\"([+-]?)\"+v)))){ if(m[1]!==\"-\") return solved; return {kind:\"mul\", a:R(-1)}; }\n  if((m=s.match(re(\"([+-]?)\\\\((\\\\d+)\\\\/(\\\\d+)\\\\)\\\\*?\"+v))) || (m=s.match(re(\"([+-]?)(\\\\d+)\\\\/(\\\\d+)\\\\*?\"+v)))){\n    if(!+m[2]||!+m[3]) return {err:\"A fraction can't have 0 in it here. Try something like (2/3)\"+v+\" = 8.\"};\n    return {kind:\"frac\", s:sg(m[1]), fp:+m[2], fq:+m[3], post:false};\n  }\n  if((m=s.match(re(\"([+-]?)(\\\\d+)\"+v+\"\\\\/(\\\\d+)\")))){\n    if(!+m[2]||!+m[3]) return {err:\"A fraction can't have 0 in it here. Try something like 2\"+v+\"/3 = 8.\"};\n    return {kind:\"frac\", s:sg(m[1]), fp:+m[2], fq:+m[3], post:true};\n  }\n  if((m=s.match(re(\"([+-]?)\"+NUM+\"\\\\*?\"+v))) || (m=s.match(re(\"([+-]?)\"+v+\"\\\\*\"+NUM)))){\n    let a=numR(m[2]); if(m[1]===\"-\") a=neg(a);\n    if(!a.n) return {err:\"0 times \"+v+\" is always 0, so there's nothing to solve. Try a different number.\"};\n    if(a.n===1 && a.d===1) return solved;\n    return {kind:\"mul\", a:a};\n  }\n  if((m=s.match(re(\"([+-]?)\"+v+\"\\\\/([+-]?)\"+NUM)))){\n    const den=numR(m[3]); if(!den.n) return {err:\"You can't divide by 0. Try a different number.\"};\n    const sign=sg(m[1])*sg(m[2]);\n    /* a minus sign in front of x is written down in the denominator instead: -x/7 becomes x/-7 */\n    return {kind:\"div\", den:den, numNeg:false, denNeg:sign\u003c0, m: sign\u003c0 ? neg(den) : den, negMoved: m[1]===\"-\" && m[2]!==\"-\"};\n  }\n  return null;\n}\nfunction notReadable(vs,v){\n  const body=vs.replace(/^[+-]/,\"\");\n  if(new RegExp(\"^-\"+v+\"|-\"+v+\"$\").test(vs) && /[+-]/.test(body))\n    return v+\" has a minus sign in front of it, so this one takes two steps. For one step, try something like 7 + \"+v+\" = 12.\";\n  if(/[+-]/.test(body)) return \"That one takes two steps. This is for one-step equations, like 3\"+v+\" = 15 or \"+v+\" + 7 = 12.\";\n  return \"I can't read that yet. Try something lik
